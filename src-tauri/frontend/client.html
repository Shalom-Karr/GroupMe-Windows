<!--
  The custom client.

  This is the app's own GroupMe client, not a wrapper around web.groupme.com.
  It reads every message out of the local SQLite archive over `archive_*` IPC
  and writes through the app's own `client_*` commands, which means it is fast
  where the web app is slow and — the actual reason it exists — it can search
  the entire history, which the web app cannot.

  Four constraints hold this file together.

  NO NETWORK REFERENCES. Not a CDN, not a font, not a remote avatar, not an
  attachment URL. Every byte is inline. The app ships a strict CSP whose
  `img-src` admits only self, the asset protocol and `data:`, so a remote URL
  here would not merely be impolite, it would be blocked. Cached media is
  resolved to a local path with `archive_media_path` and loaded through
  `convertFileSrc`; a freshly sent image shows from a `data:` preview until the
  next sync downloads it.

  NO innerHTML WITH DATA. Message text, display names, attachment URLs and
  search queries are third-party content that arrives from other people's
  keyboards. Every one of them reaches the DOM through `textContent` or
  `document.createTextNode`. The only markup written as a string in this file is
  the static icon set below, which contains no interpolation at all.

  MESSAGE IDS ARE STRINGS, ALWAYS. GroupMe ids run to ~1.78e17, past
  Number.MAX_SAFE_INTEGER where a double's ulp is 32. `Number(id)` silently
  rounds, and a rounded cursor either repeats the boundary message forever or
  drops it from the thread permanently. Ids are compared with `cmpId` (length,
  then lexicographic) and the one place arithmetic is genuinely needed — the
  "jump to this message" anchor — uses BigInt, which is exact.

  THE LIST IS WINDOWED. Conversations here reach six figures. Messages are held
  in fixed-size chunks; a chunk that scrolls far out of view is replaced by a
  spacer of its own measured height and rebuilt when it comes back. A new
  message appends one row to one chunk. Nothing in this file re-renders the
  whole thread in response to a new message.

  ── Realtime payload assumptions ─────────────────────────────────────────────
  `realtime.rs` emits `realtime://message`, `realtime://reaction`,
  `realtime://typing` and `realtime://state`. Every assumption about their shape
  is isolated in the four `adapt*` functions at the top of the script and
  nowhere else, so a shape change is a small edit there rather than a rewrite.
  What they currently assume, in order of preference, is:

    realtime://message   the payload is the Message itself, or carries it under
                         `message`/`msg`/`data`. The conversation is taken from
                         an explicit `conversation_id`/`conversationId` on the
                         envelope, else from the message's own `group_id` or
                         `conversation_id`. A payload with no usable id is
                         dropped rather than guessed at.
    realtime://reaction  `{ conversation_id, message_id, reactions[] }` on the
                         envelope, or nested under `message`. If the frame
                         carries a whole message instead, the reactions are read
                         off it. `favorited_by` is accepted as an alternative to
                         `reactions` and normalised to one reaction row.
    realtime://typing    `{ conversation_id, user_id, name?, started?|until? }`.
                         Absent an expiry the indicator self-clears after 6s.
    realtime://state     a bare string, a bare bool, or an object with any of
                         `connected`/`online`/`ok` plus an optional
                         `state`/`status` label.

  Every adapter tolerates the payload arriving wrapped as `{payload: …}` and
  accepts snake_case or camelCase, because Tauri's serde bridge has been
  configured both ways in this project's history.

  ── Privacy ──────────────────────────────────────────────────────────────────
  The demo data below is synthetic and exists only so the page renders when
  opened outside the app (no IPC). No real name, user id, group id, message id
  or token appears anywhere in this file.
-->
<meta charset="utf-8" />
<title>GroupMe</title>
<style>
  :root {
    --accent: #3c16d3;
    --bg: #ffffff;
    --fg: #16161d;
    --muted: #6b6b7b;
    --card: #f5f5f8;
    --border: #e3e3ea;

    --panel: #fbfbfd;
    --hover: #eeeef4;
    --sel: #e7e2fb;
    --mine-bg: #3c16d3;
    --mine-fg: #ffffff;
    --tint: rgba(60, 22, 211, .08);
    --shadow: 0 1px 2px rgba(16, 16, 29, .06);
    --pop: 0 8px 28px rgba(16, 16, 29, .16);
    --ok: #0d7a5f;
    --warn: #a3341f;
    --mark: #ffe08a;
    --mark-fg: #16161d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e14;
      --fg: #f2f2f6;
      --muted: #9a9aab;
      --card: #191922;
      --border: #2a2a36;

      --panel: #12121a;
      --hover: #1f1f2a;
      --sel: #241c46;
      --mine-bg: #4a24e0;
      --mine-fg: #ffffff;
      --tint: rgba(122, 92, 244, .14);
      --shadow: none;
      --pop: 0 10px 30px rgba(0, 0, 0, .55);
      --ok: #35c79a;
      --warn: #ff8a6a;
      --mark: #7a5a10;
      --mark-fg: #ffeec2;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  ::selection { background: var(--sel); }
  button { font: inherit; color: inherit; }
  #icons { display: none; }

  .app { display: grid; grid-template-columns: 310px 1fr; height: 100%; }

  /* ---------- sidebar ---------- */

  .sidebar {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  .side-head { padding: .85rem .85rem .6rem; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: .55rem; margin-bottom: .75rem; }
  .mark {
    width: 28px; height: 28px; flex: none;
    border-radius: 9px; background: var(--accent);
    display: grid; place-items: center;
  }
  .mark svg { width: 16px; height: 16px; stroke: #fff; }
  .brand-name { font-size: .9rem; font-weight: 600; letter-spacing: -.01em; }
  .pill {
    margin-left: auto; font-size: .68rem; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; padding: .18rem .45rem; border-radius: 6px;
    color: var(--muted); background: var(--card); border: 1px solid var(--border);
    display: inline-flex; align-items: center; gap: .3rem; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
  .pill.live { color: var(--ok); }
  .pill.live .dot { background: var(--ok); }
  .pill.down { color: var(--warn); }
  .pill.down .dot { background: var(--warn); }

  .uiswap {
    font: inherit; font-size: .68rem; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; padding: .18rem .45rem; border-radius: 6px;
    color: var(--muted); background: var(--card); border: 1px solid var(--border);
    cursor: pointer; white-space: nowrap;
  }
  .uiswap:hover { color: var(--fg); border-color: var(--accent); }

  .search { position: relative; }
  .search > svg {
    position: absolute; left: .55rem; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--muted); pointer-events: none;
  }
  input[type="search"] {
    width: 100%; font: inherit; font-size: .85rem;
    padding: .42rem .6rem .42rem 1.85rem;
    border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg);
    -webkit-user-select: text; user-select: text;
  }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  input[type="search"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint); }
  input[type="search"]::placeholder { color: var(--muted); }
  .search-hint {
    position: absolute; right: .5rem; top: 50%; transform: translateY(-50%);
    font-size: .68rem; color: var(--muted); pointer-events: none;
    border: 1px solid var(--border); border-radius: 5px; padding: 0 .28rem; background: var(--card);
  }
  .search.busy .search-hint { display: none; }

  .list { flex: 1; overflow-y: auto; padding: .4rem; min-height: 0; }
  .list-label {
    font-size: .7rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); padding: .6rem .55rem .35rem;
    display: flex; align-items: baseline; gap: .4rem;
  }
  .list-label .sub { font-weight: 500; letter-spacing: 0; text-transform: none; }

  .row {
    display: flex; gap: .6rem; align-items: center; width: 100%;
    padding: .5rem .55rem; border-radius: 10px;
    border: 0; background: none; color: inherit; font: inherit; text-align: left;
    cursor: pointer;
  }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--sel); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row-body { min-width: 0; flex: 1; }
  .row-top { display: flex; align-items: baseline; gap: .5rem; }
  .row-name {
    font-size: .875rem; font-weight: 600; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
  }
  .row-time { font-size: .72rem; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .row-prev {
    font-size: .8rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .05rem;
  }
  .row.unread .row-name { font-weight: 700; }
  .row.unread .row-prev { color: var(--fg); }
  .unread-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    flex: none; margin-left: .1rem;
  }

  .avatar {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    object-fit: cover; background: var(--card);
    display: grid; place-items: center;
    font-size: .78rem; font-weight: 600; color: #fff; letter-spacing: .01em;
  }
  .avatar.sm { width: 30px; height: 30px; font-size: .7rem; }
  .avatar.square { border-radius: 10px; }

  .side-foot {
    border-top: 1px solid var(--border); padding: .55rem .85rem;
    font-size: .74rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side-empty { padding: 1.5rem .9rem; color: var(--muted); font-size: .82rem; text-align: center; line-height: 1.6; }

  /* ---------- main ---------- */

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }

  .thread { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .thread.show { display: flex; }

  .thread-head {
    display: flex; align-items: center; gap: .6rem;
    padding: .7rem 1rem; border-bottom: 1px solid var(--border);
    background: var(--bg); flex: none;
  }
  .back {
    display: none; flex: none; width: 30px; height: 30px; padding: 0;
    align-items: center; justify-content: center;
    border-radius: 8px; border: 1px solid var(--border); background: var(--card);
    color: var(--fg); cursor: pointer;
  }
  .back svg { width: 15px; height: 15px; }
  .thread-title { font-size: .95rem; font-weight: 600; letter-spacing: -.01em; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-sub { font-size: .74rem; color: var(--muted); margin-top: .05rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-headtext { min-width: 0; flex: 1; }
  .head-actions { display: flex; gap: .35rem; flex: none; }
  .hbtn {
    width: 30px; height: 30px; padding: 0; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
  }
  .hbtn:hover { color: var(--fg); background: var(--hover); }
  .hbtn svg { width: 15px; height: 15px; }

  .banner {
    display: none; align-items: center; gap: .6rem; flex: none;
    padding: .5rem 1rem; font-size: .78rem;
    background: var(--sel); border-bottom: 1px solid var(--border);
  }
  .banner.show { display: flex; }
  .banner span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner button {
    margin-left: auto; flex: none; border: 1px solid var(--border); background: var(--bg);
    color: var(--fg); border-radius: 8px; padding: .2rem .55rem; font-size: .76rem; cursor: pointer;
  }
  .banner button:hover { background: var(--hover); }

  .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; position: relative; }
  .messages { max-width: 46rem; margin: 0 auto; padding: 1rem 1.25rem 1.25rem; }
  .chunk { min-height: 1px; }

  .top-state { display: grid; place-items: center; padding: .9rem 0 .3rem; min-height: 1rem; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .top-note { font-size: .74rem; color: var(--muted); }

  .day { display: flex; align-items: center; gap: .75rem; margin: 1.35rem 0 .9rem; }
  .day::before, .day::after { content: ""; height: 1px; background: var(--border); flex: 1; }
  .day span { font-size: .72rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }

  .sys {
    text-align: center; font-size: .76rem; color: var(--muted);
    margin: .8rem auto; max-width: 30rem; line-height: 1.5;
  }

  .msg { display: flex; gap: .6rem; margin-top: .7rem; align-items: flex-start; position: relative; }
  .msg.cont { margin-top: .12rem; }
  .msg .gutter { width: 30px; flex: none; }
  .msg-body { min-width: 0; max-width: 34rem; }
  .msg-meta { display: flex; align-items: baseline; gap: .45rem; margin-bottom: .12rem; }
  .msg-name { font-size: .8rem; font-weight: 600; letter-spacing: -.005em; }
  .msg-time { font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .bubble {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: .42rem .68rem;
    font-size: .9rem; line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: anywhere;
    -webkit-user-select: text; user-select: text;
    box-shadow: var(--shadow);
  }
  .bubble.tomb { font-style: italic; color: var(--muted); background: transparent; border-style: dashed; }
  .bubble.pending { opacity: .6; }
  .edited { font-size: .7rem; color: var(--muted); margin-left: .3rem; font-style: normal; }

  .msg.mine { flex-direction: row-reverse; }
  .msg.mine .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.mine .msg-meta { flex-direction: row-reverse; }
  .msg.mine .bubble { background: var(--mine-bg); border-color: var(--mine-bg); color: var(--mine-fg); }
  .msg.mine .bubble.tomb { background: transparent; color: var(--muted); border-color: var(--border); }
  .msg.mine .edited { color: rgba(255, 255, 255, .7); }
  .msg.mine .quote { border-left-color: rgba(255, 255, 255, .4); }

  .msg.hit > .msg-body > .bubble { box-shadow: 0 0 0 2px var(--accent); }
  @keyframes flash { 0%, 100% { background: transparent; } 30% { background: var(--tint); } }
  .msg.flash { animation: flash 1.6s ease-out 1; border-radius: 12px; }

  .quote {
    border-left: 3px solid var(--border); padding: .1rem 0 .1rem .55rem;
    margin-bottom: .3rem; font-size: .78rem; color: var(--muted); line-height: 1.45;
    max-width: 100%; overflow: hidden; cursor: pointer; text-align: left;
    background: none; border-top: 0; border-right: 0; border-bottom: 0; display: block; width: 100%;
  }
  .quote:hover { color: var(--fg); }
  .quote b { font-weight: 600; color: var(--fg); font-size: .76rem; display: block; }
  .msg.mine .quote, .msg.mine .quote b { color: rgba(255, 255, 255, .82); }
  .quote-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .atts { display: flex; flex-direction: column; gap: .35rem; margin-top: .3rem; }
  .msg-body > .atts:first-child { margin-top: 0; }
  .att-img {
    display: block; max-width: min(320px, 100%); max-height: 340px;
    border-radius: 12px; border: 1px solid var(--border); background: var(--card);
  }
  .att-miss {
    display: flex; align-items: center; gap: .55rem;
    max-width: 320px; padding: .7rem .8rem;
    border: 1px dashed var(--border); border-radius: 12px;
    color: var(--muted); font-size: .78rem; line-height: 1.4; background: var(--card);
  }
  .att-miss svg { width: 18px; height: 18px; flex: none; }

  .reacts { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .3rem; }
  .react {
    display: inline-flex; align-items: center; gap: .25rem;
    font-size: .74rem; line-height: 1; padding: .2rem .4rem;
    border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    cursor: pointer;
  }
  .react:hover { background: var(--hover); }
  .react.own { border-color: var(--accent); color: var(--fg); background: var(--tint); }
  .react .glyph { font-size: .82rem; }
  .msg.mine .reacts { justify-content: flex-end; }

  /* Row actions: revealed on hover, never on a permanent toolbar that would
     double the height of every row in a six-figure thread. */
  .acts {
    position: absolute; top: -.55rem; display: none; gap: .15rem;
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
    padding: .12rem; box-shadow: var(--shadow); z-index: 3;
  }
  .msg .acts { right: 2.4rem; }
  .msg.mine .acts { right: auto; left: 2.4rem; }
  .msg:hover .acts, .msg:focus-within .acts { display: flex; }
  .act {
    width: 26px; height: 26px; border: 0; background: none; color: var(--muted);
    border-radius: 6px; display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .act:hover { background: var(--hover); color: var(--fg); }
  .act svg { width: 14px; height: 14px; }
  .act .emo { font-size: .95rem; line-height: 1; }

  /* ---------- composer ---------- */

  .composer { flex: none; border-top: 1px solid var(--border); padding: .6rem 1.25rem .8rem; background: var(--bg); }
  .composer-inner { max-width: 46rem; margin: 0 auto; }

  .ctx {
    display: none; align-items: flex-start; gap: .5rem;
    padding: .4rem .6rem; margin-bottom: .45rem;
    border-left: 3px solid var(--accent); background: var(--card);
    border-radius: 0 8px 8px 0; font-size: .78rem; color: var(--muted);
  }
  .ctx.show { display: flex; }
  .ctx-body { min-width: 0; flex: 1; }
  .ctx-title { font-weight: 600; color: var(--fg); font-size: .75rem; }
  .ctx-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctx-x {
    flex: none; width: 22px; height: 22px; border: 0; background: none; color: var(--muted);
    border-radius: 6px; display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .ctx-x:hover { background: var(--hover); color: var(--fg); }
  .ctx-x svg { width: 13px; height: 13px; }

  .drafts { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .45rem; }
  .draft-att { position: relative; }
  .draft-att img {
    display: block; width: 64px; height: 64px; object-fit: cover;
    border-radius: 10px; border: 1px solid var(--border); background: var(--card);
  }
  .draft-att .ctx-x {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    background: var(--bg); border: 1px solid var(--border);
  }
  .draft-att .up { font-size: .68rem; color: var(--muted); text-align: center; margin-top: .1rem; }

  .composer-box {
    display: flex; align-items: flex-end; gap: .45rem;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); padding: .35rem .4rem .35rem .7rem;
  }
  .composer-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint); }
  .composer-box textarea {
    flex: 1; min-width: 0; font: inherit; font-size: .875rem; line-height: 1.45;
    border: 0; background: none; color: var(--fg); resize: none;
    max-height: 8.5rem; padding: .35rem 0; overflow-y: auto;
    -webkit-user-select: text; user-select: text;
  }
  .composer-box textarea::placeholder { color: var(--muted); }
  .composer-box textarea:focus { outline: none; }
  .cbtn {
    flex: none; width: 30px; height: 30px; border-radius: 8px; margin-bottom: .1rem;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .cbtn:hover:not(:disabled) { color: var(--fg); background: var(--hover); }
  .cbtn:disabled { opacity: .45; cursor: not-allowed; }
  .cbtn svg { width: 15px; height: 15px; }
  .cbtn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cbtn.go:hover:not(:disabled) { background: var(--accent); color: #fff; filter: brightness(1.08); }

  .composer-foot {
    display: flex; align-items: center; gap: .5rem;
    margin-top: .4rem; font-size: .75rem; color: var(--muted); min-height: 1.1rem;
  }
  .composer-foot .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .composer-foot .count { font-variant-numeric: tabular-nums; flex: none; }
  .composer-foot .count.over { color: var(--warn); font-weight: 600; }
  .cerr { color: var(--warn); }
  .typing { font-style: italic; }

  /* ---------- popovers ---------- */

  .pop {
    position: fixed; z-index: 40; display: none;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--pop); padding: .3rem;
  }
  .pop.show { display: block; }
  .pop-emoji { display: grid; grid-template-columns: repeat(6, 2rem); gap: .1rem; }
  .pop-emoji button {
    width: 2rem; height: 2rem; border: 0; background: none; border-radius: 8px;
    font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 0;
  }
  .pop-emoji button:hover { background: var(--hover); }

  .menu { min-width: 11rem; }
  .menu button {
    display: flex; align-items: center; gap: .5rem; width: 100%;
    border: 0; background: none; text-align: left; cursor: pointer;
    padding: .38rem .5rem; border-radius: 8px; font-size: .82rem;
  }
  .menu button:hover { background: var(--hover); }

    pendingQuotes: [],      // quote nodes whose target has not been paged in

  }

  function rememberSelf(id) {
    if (!id || state.selfId === String(id)) return;
    state.selfId = String(id);
    try { window.localStorage.setItem("groupme.selfId.v1", state.selfId); } catch (e) { /* ignore */ }
  }

  function convoStamp(c) {
    return Number(fld(c, "last_message_created_at", "lastMessageCreatedAt") || fld(c, "updated_at", "updatedAt") || 0);
  }

  function isUnread(c) {
    var seen = Number(state.readAt[c.id] || 0);
    return convoStamp(c) > seen;
  }

  /* =========================== preview data =============================

     the file in a browser and see something. Every id below is synthetic and

  var T0 = nowSecs();
  var DEMO_CONVOS = [

  var DEMO_MSGS = {

  function demo(cmd, args) {
    if (cmd === "archive_conversations") return DEMO_CONVOS.slice();
    if (cmd === "archive_messages") {
      if (args.beforeId != null) return [];
      return (DEMO_MSGS[args.conversationId] || []).slice();
    }
    if (cmd === "archive_search") {
