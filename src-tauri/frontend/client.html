<!--
  The custom client.

  This is the app's own GroupMe client, not a wrapper around web.groupme.com.
  It reads every message out of the local SQLite archive over `archive_*` IPC
  and writes through the app's own `client_*` commands, which means it is fast
  where the web app is slow and — the actual reason it exists — it can search
  the entire history, which the web app cannot.

  Four constraints hold this file together.

  NO NETWORK REFERENCES. Not a CDN, not a font, not a remote avatar, not an
  attachment URL. Every byte is inline. The app ships a strict CSP whose
  `img-src` admits only self, the asset protocol and `data:`, so a remote URL
  here would not merely be impolite, it would be blocked. Cached media is
  resolved to a local path with `archive_media_path` and loaded through
  `convertFileSrc`; a freshly sent image shows from a `data:` preview until the
  next sync downloads it.

  NO innerHTML WITH DATA. Message text, display names, attachment URLs and
  search queries are third-party content that arrives from other people's
  keyboards. Every one of them reaches the DOM through `textContent` or
  `document.createTextNode`. The only markup written as a string in this file is
  the static icon set below, which contains no interpolation at all.

  That constraint is load-bearing for the markdown renderer in particular.
  Message bodies are parsed for **bold**, *italic*, `code`, fenced blocks,
  > quotations, lists and links — and the output is assembled node by node with
  `createElement` and `createTextNode`, never by building a string and handing
  it to a parser. A message body therefore cannot express an element at all,
  whatever it contains, so a script tag in a message arrives as literal
  visible characters. Anchors are the one place where untrusted text influences
  an attribute, and their `href` is rebuilt from a scheme-checked match, so
  `javascript:` and `data:` cannot reach one. See `renderRich`.

  Link previews are rendered here and fetched in Rust. `linkPreviewSource` is
  the single adapter; the page never requests a URL itself, both because
  `default-src 'self'` blocks it and because doing so would tell a third party
  what the user is reading.

  CONNECTIVITY OUTRANKS THE SOCKET. `realtime://state` describes the websocket,
  and its `unauthorized` status is latched — the Rust worker stops for good on a
  refused token, so that value outlives the condition and a later network drop
  would still have read "unauthorized" in the header. The pill therefore
  consults the socket only when the app is online; `archive://connectivity` and
  `navigator.onLine` decide that, either one being enough. See `paintConn`.

  MESSAGE IDS ARE STRINGS, ALWAYS. GroupMe ids run to ~1.78e17, past
  Number.MAX_SAFE_INTEGER where a double's ulp is 32. `Number(id)` silently
  rounds, and a rounded cursor either repeats the boundary message forever or
  drops it from the thread permanently. Ids are compared with `cmpId` (length,
  then lexicographic) and the one place arithmetic is genuinely needed — the
  "jump to this message" anchor — uses BigInt, which is exact.

  THE LIST IS WINDOWED. Conversations here reach six figures. Messages are held
  in fixed-size chunks; a chunk that scrolls far out of view is replaced by a
  spacer of its own measured height and rebuilt when it comes back. A new
  message appends one row to one chunk. Nothing in this file re-renders the
  whole thread in response to a new message.

  ── Realtime payload assumptions ─────────────────────────────────────────────
  `realtime.rs` emits `realtime://message`, `realtime://reaction`,
  `realtime://typing` and `realtime://state`. Every assumption about their shape
  is isolated in the four `adapt*` functions at the top of the script and
  nowhere else, so a shape change is a small edit there rather than a rewrite.
  What they currently assume, in order of preference, is:

    realtime://message   the payload is the Message itself, or carries it under
                         `message`/`msg`/`data`. The conversation is taken from
                         an explicit `conversation_id`/`conversationId` on the
                         envelope, else from the message's own `group_id` or
                         `conversation_id`. A payload with no usable id is
                         dropped rather than guessed at.
    realtime://reaction  `{ conversation_id, message_id, reactions[] }` on the
                         envelope, or nested under `message`. If the frame
                         carries a whole message instead, the reactions are read
                         off it. `favorited_by` is accepted as an alternative to
                         `reactions` and normalised to one reaction row.
    realtime://typing    `{ conversation_id, user_id, name?, started?|until? }`.
                         Absent an expiry the indicator self-clears after 6s.
    realtime://state     a bare string, a bare bool, or an object with any of
                         `connected`/`online`/`ok` plus an optional
                         `state`/`status` label.

  Every adapter tolerates the payload arriving wrapped as `{payload: …}` and
  accepts snake_case or camelCase, because Tauri's serde bridge has been
  configured both ways in this project's history.

  ── Privacy ──────────────────────────────────────────────────────────────────
  The demo data below is synthetic and exists only so the page renders when
  opened outside the app (no IPC). No real name, user id, group id, message id
  or token appears anywhere in this file.
-->
<meta charset="utf-8" />
<title>GroupMe</title>
<style>
  /* ────────────────────────────────────────────────────────────────────────
     "Editorial archive". This window's reason to exist is that it is a
     permanent, searchable record — so it is set like a periodical rather than
     dressed like a chat app. Every typeface below ships with Windows 10/11,
     which matters: the CSP admits no external resource and the app has to be
     legible with the network down.

     Rules, not boxes. Layered paper, not shadows. The accent appears only for
     unread state, the active selection and the primary action.
     ──────────────────────────────────────────────────────────────────────── */
  :root {
    --font-display: "Sitka Heading", Constantia, Georgia, serif;
    --font-ui:      Corbel, Candara, "Segoe UI", sans-serif;
    --font-label:   "Bahnschrift SemiLight", Bahnschrift, Corbel, sans-serif;
    --font-mono:    "Cascadia Mono", Consolas, monospace;

    --bg: #f6f3ec; --surface: #fffdf8; --raised: #ece7db;
    --rule: #dcd5c6; --fg: #16130d; --fg-soft: #5d5647;
    --accent: #a8341f; --accent-soft: #f2e3dc;
    --ok: #1f5c56; --warn: #8a5a00;

    --grain: rgba(22, 19, 13, .026);
    --pop: 0 16px 36px rgba(22, 19, 13, .13);
    --lift: 0 2px 9px rgba(22, 19, 13, .07);
    --measure: 45rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100e0c; --surface: #191611; --raised: #221e18;
      --rule: #302a22; --fg: #f1ece1; --fg-soft: #9d9483;
      --accent: #e2603f; --accent-soft: #33211b;
      --ok: #4fb3a4; --warn: #d4a24c;

      --grain: rgba(255, 249, 236, .022);
      --pop: 0 18px 42px rgba(0, 0, 0, .62);
      --lift: 0 2px 10px rgba(0, 0, 0, .38);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    /* Laid-paper texture from a repeating gradient — no request, no asset, and
       it survives the offline case this app is built for. */
    background-color: var(--bg);
    background-image: repeating-linear-gradient(0deg, var(--grain) 0 1px, transparent 1px 4px);
    color: var(--fg);
    font: 15px/1.55 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  ::selection { background: var(--accent-soft); color: var(--fg); }
  button { font: inherit; color: inherit; }
  #icons { display: none; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--rule); border: 4px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-soft); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* One orchestrated reveal at load, staggered below. Nothing else animates. */
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* Small tracked uppercase metadata: timestamps, section heads, counts. */
  .label, .list-label, .pill, .uiswap, .thread-sub, .msg-time, .row-time,
  .day span, .top-note, .side-foot, .ctx-title, .composer-foot .count, .edited,
  .react, .hit-when, .hit-who, .hit-jump, .empty-kicker, .up,
  .composer-foot .hint, .lp-site {
    font-family: var(--font-label);
    letter-spacing: .1em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  .app { display: grid; grid-template-columns: 328px 1fr; height: 100%; }

  /* ---------- sidebar ---------- */

  /* The sidebar is the index: textured stock, hairline rules, no fills. The
     reading column to its right is the clean page. */
  .sidebar {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: transparent;
    border-right: 1px solid var(--rule);
  }
  .side-head {
    padding: .7rem .8rem .6rem;
    border-bottom: 1px solid var(--rule);
    animation: rise .5s cubic-bezier(.22, .8, .24, 1) both;
  }
  .brand { display: flex; align-items: center; gap: .5rem; margin-bottom: .6rem; }
  .mark {
    width: 26px; height: 26px; flex: none;
    border-radius: 1px; background: var(--accent);
    display: grid; place-items: center;
  }
  .mark svg { width: 15px; height: 15px; stroke: var(--bg); }
  .brand-name {
    font-family: var(--font-display); font-size: 1.02rem; font-weight: 600;
    letter-spacing: .005em; line-height: 1;
    /* Yields before the status pill does, so a longer status never pushes the
       UI toggle off the edge of a 292 px sidebar. */
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pill {
    margin-left: auto; font-size: .6rem; font-weight: 400;
    padding: .2rem 0 .2rem .1rem;
    color: var(--fg-soft); background: none; border: 0;
    display: inline-flex; align-items: center; gap: .38rem; white-space: nowrap;
  }
  .pill .dot { width: 5px; height: 5px; border-radius: 0; background: var(--fg-soft); flex: none; }
  .pill.live { color: var(--ok); }
  .pill.live .dot { background: var(--ok); }
  .pill.down { color: var(--accent); }
  .pill.down .dot { background: var(--accent); }
  /* Reachable but dropping requests. Not the same alarm as a hard failure. */
  .pill.warn { color: var(--warn); }
  .pill.warn .dot { background: var(--warn); }

  .uiswap {
    font-size: .6rem; padding: .28rem .5rem; border-radius: 1px;
    color: var(--fg-soft); background: none; border: 1px solid var(--rule);
    cursor: pointer; white-space: nowrap;
  }
  .uiswap:hover { color: var(--fg); border-color: var(--fg-soft); background: var(--surface); }

  .search { position: relative; }
  .search > svg {
    position: absolute; left: .6rem; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: var(--fg-soft); pointer-events: none;
  }
  input[type="search"] {
    width: 100%; font: inherit; font-family: var(--font-ui); font-size: .87rem;
    padding: .48rem .6rem .48rem 1.9rem;
    border-radius: 1px; border: 1px solid var(--rule);
    background: var(--surface); color: var(--fg);
    -webkit-user-select: text; user-select: text;
  }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  input[type="search"]:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft);
  }
  input[type="search"]::placeholder { color: var(--fg-soft); }
  .search-hint {
    position: absolute; right: .45rem; top: 50%; transform: translateY(-50%);
    font-family: var(--font-mono); font-size: .64rem; color: var(--fg-soft);
    pointer-events: none; border: 1px solid var(--rule); border-radius: 1px;
    padding: 0 .3rem; background: var(--raised);
  }
  .search.busy .search-hint { display: none; }

  .list {
    flex: 1; overflow-y: auto; padding: 0 0 .8rem; min-height: 0;
    animation: rise .5s cubic-bezier(.22, .8, .24, 1) .07s both;
  }

  /* Section head: label, hairline rule to the margin, count. A running head. */
  .list-label {
    font-size: .6rem; color: var(--fg-soft);
    padding: .7rem .8rem .35rem;
    display: flex; align-items: center; gap: .55rem;
  }
  /* The first section head sits right under the search field; it does not need
     the full running-head lead the later ones get. */
  .list > .list-label:first-child { padding-top: .5rem; }
  .list-label::after {
    content: ""; order: 1; flex: 1; height: 1px; background: var(--rule);
  }
  .list-label .sub {
    order: 2; flex: none; letter-spacing: .09em; font-size: .58rem;
    color: var(--accent);
  }

  .row {
    display: flex; gap: .65rem; align-items: flex-start; width: 100%;
    padding: .5rem .8rem; border-radius: 0;
    border: 0; border-top: 1px solid transparent;
    background: none; color: inherit; font: inherit; text-align: left;
    cursor: pointer; position: relative;
  }
  .conv + .conv .row { border-top: 1px solid var(--rule); }
  .row + .row { border-top-color: var(--rule); }
  .row:hover { background: var(--surface); }
  .row.active { background: var(--surface); }
  .row.active::before,
  .row.unread::before {
    content: ""; position: absolute; left: 0; top: -1px; bottom: 0;
    width: 2px; background: var(--accent);
  }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row-body { min-width: 0; flex: 1; }
  .row-top { display: flex; align-items: baseline; gap: .55rem; }
  .row-name {
    font-family: var(--font-display); font-size: .93rem; font-weight: 600;
    letter-spacing: .002em; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
  }
  .row-time { font-size: .58rem; color: var(--fg-soft); flex: none; }
  .row-prev {
    font-size: .8rem; color: var(--fg-soft); line-height: 1.45;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .18rem;
  }
  .row.unread .row-name { color: var(--fg); }
  .row.unread .row-prev { color: var(--fg); }
  .row.active .row-name { color: var(--accent); }

  /* Unread marker. A count when the server knows one, otherwise a plain accent
     square — deliberately not a notification bubble. */
  .unread-dot {
    flex: none; min-width: 6px; height: 6px; margin-top: .3rem;
    background: var(--accent); border-radius: 0;
  }
  .unread-dot.n {
    height: auto; min-width: 1.2rem; padding: .1rem .25rem; margin-top: .05rem;
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 1px;
    font-family: var(--font-mono); font-size: .6rem; line-height: 1.15;
    color: var(--fg); text-align: center; font-variant-numeric: tabular-nums;
  }

  .avatar {
    width: 32px; height: 32px; flex: none; border-radius: 50%;
    object-fit: cover; background: var(--raised);
    display: grid; place-items: center;
    font-family: var(--font-label); font-size: .66rem; font-weight: 400;
    color: #fff; letter-spacing: .06em; text-transform: uppercase;
  }
  .avatar.sm { width: 26px; height: 26px; font-size: .58rem; }
  .avatar.hd { width: 34px; height: 34px; font-size: .72rem; }
  .avatar.square { border-radius: 1px; }

  .side-foot {
    border-top: 1px solid var(--rule); padding: .55rem .8rem;
    font-size: .58rem; color: var(--fg-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    animation: rise .5s cubic-bezier(.22, .8, .24, 1) .14s both;
  }
  .side-empty {
    padding: 1.6rem .95rem; color: var(--fg-soft); font-size: .82rem;
    line-height: 1.65; max-width: 26rem; margin: 0 auto;
    border-top: 1px solid var(--rule);
  }

  /* ---------- main ---------- */

  /* The reading page: an untextured surface set against the grained shell. */
  .main {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    position: relative; background: var(--surface);
  }

  .thread { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .thread.show { display: flex; }

  /* Running head. A double rule, the way a periodical sets one. Kept tight —
     this is a chat engine, so the head is a slim band, not a masthead. */
  .thread-head {
    padding: .5rem 1.1rem .52rem; border-bottom: 3px double var(--rule);
    background: var(--surface); flex: none; position: relative;
  }
  .thread-head-inner {
    display: flex; align-items: center; gap: .55rem;
    max-width: var(--measure); width: 100%; margin: 0 auto;
  }

  /* The conversation identity is a control: its avatar and name open the
     settings panel, so it reads as a button — quiet until hovered. */
  .head-id {
    display: flex; align-items: center; gap: .6rem; min-width: 0; flex: 1;
    border: 0; background: none; color: inherit; text-align: left;
    padding: .2rem .35rem .2rem .2rem; margin: 0; border-radius: 2px; cursor: pointer;
  }
  .head-id:hover { background: var(--raised); }
  .head-id:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .head-av { flex: none; }
  .head-caret {
    flex: none; width: 13px; height: 13px; color: var(--fg-soft);
    opacity: 0; transition: opacity .12s;
  }
  .head-id:hover .head-caret, .head-id:focus-visible .head-caret { opacity: 1; }
  .back {
    display: none; flex: none; width: 28px; height: 28px; padding: 0;
    align-items: center; justify-content: center;
    border-radius: 1px; border: 1px solid var(--rule); background: none;
    color: var(--fg-soft); cursor: pointer;
  }
  .back:hover { color: var(--fg); background: var(--raised); }
  .back svg { width: 14px; height: 14px; }
  .thread-title {
    display: block;
    font-family: var(--font-display); font-size: 1.18rem; font-weight: 600;
    letter-spacing: .002em; line-height: 1.2; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thread-sub {
    display: block;
    font-size: .58rem; color: var(--fg-soft); margin-top: .2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thread-sub.typing {
    text-transform: none; letter-spacing: .01em; font-family: var(--font-ui);
    font-size: .76rem; font-style: italic; color: var(--accent);
  }
  .thread-headtext { min-width: 0; flex: 1; }
  .head-actions { display: flex; gap: .25rem; flex: none; }
  .hbtn {
    width: 28px; height: 28px; padding: 0; border-radius: 1px;
    border: 1px solid var(--rule); background: none; color: var(--fg-soft);
    display: grid; place-items: center; cursor: pointer;
  }
  .hbtn:hover { color: var(--fg); background: var(--raised); }
  .hbtn svg { width: 14px; height: 14px; }

  .banner {
    display: none; align-items: center; gap: .7rem; flex: none;
    padding: .55rem 1.55rem; font-size: .8rem; color: var(--fg);
    background: var(--accent-soft); border-bottom: 1px solid var(--rule);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .banner.show { display: flex; }
  .banner span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner button {
    margin-left: auto; flex: none; border: 1px solid var(--accent); background: none;
    color: var(--fg); border-radius: 1px; padding: .22rem .6rem;
    font-family: var(--font-label); font-size: .6rem; letter-spacing: .1em;
    text-transform: uppercase; cursor: pointer; white-space: nowrap;
  }
  .banner button:hover { background: var(--accent); color: var(--bg); }

  /* The page margin lives on the scroller so the transcript column lands on
     exactly the same left edge as the running head and the composer. */
  .scroller {
    flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; position: relative;
    padding: 0 1.1rem;
  }
  .messages { max-width: var(--measure); margin: 0 auto; padding: .35rem 0 1rem; }
  .chunk { min-height: 1px; }

  .top-state { display: grid; place-items: center; padding: 1.1rem 0 .2rem; min-height: 1rem; }
  .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 1.5px solid var(--rule); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .top-note {
    font-size: .58rem; color: var(--fg-soft); text-align: center;
    padding-top: .55rem; border-top: 1px solid var(--rule); min-width: 12rem;
  }

  /* Section break between days. Rules to the margins, date set small and
     tracked in the middle — a dateline, not a chip. */
  .day { display: flex; align-items: center; gap: .95rem; margin: 1.35rem 0 .8rem; }
  .day::before, .day::after { content: ""; height: 1px; background: var(--rule); flex: 1; }
  .day span { font-size: .58rem; color: var(--fg-soft); letter-spacing: .16em; }

  /* System events are the record's footnotes: present, plainly secondary. */
  .sys {
    text-align: center; font-size: .78rem; color: var(--fg-soft);
    margin: 1.1rem auto; max-width: 28rem; line-height: 1.55;
    font-style: italic; padding: 0 1rem;
  }

  /* ── the transcript ──────────────────────────────────────────────────────
     No bubbles and no left/right ping-pong. The archive reads as one
     continuous set column, the way an interview or a court record is set: a
     byline, then the text, at one measure. Own messages are marked by an
     accent rule in the margin and an accent byline, which is unambiguous and
     costs the reading column nothing.                                       */

  .msg {
    display: flex; gap: .7rem; align-items: flex-start; position: relative;
    margin-top: .6rem; padding: .05rem .5rem;
  }
  .msg.cont { margin-top: 0; padding-top: .2rem; padding-bottom: .2rem; }
  .msg .gutter { width: 26px; flex: none; }
  .msg .avatar { margin-top: .12rem; }
  .msg-body { min-width: 0; max-width: 34rem; flex: 1; }
  .msg-meta { display: flex; align-items: baseline; gap: .55rem; margin-bottom: .22rem; }
  .msg-name {
    font-family: var(--font-display); font-size: .84rem; font-weight: 600;
    letter-spacing: .005em; line-height: 1.2;
  }
  .msg-time { font-size: .58rem; color: var(--fg-soft); line-height: 1.2; }

  /* Kept the class name: the whole thread's virtualiser and every renderer
     reference it. It is no longer a bubble — it is the set text. */
  .bubble {
    background: none; border: 0; border-radius: 0; padding: 0;
    font-size: .95rem; line-height: 1.62; color: var(--fg);
    white-space: pre-wrap; overflow-wrap: anywhere;
    -webkit-user-select: text; user-select: text;
  }
  .bubble.tomb { font-style: italic; color: var(--fg-soft); }
  .bubble.pending { opacity: .5; }
  .edited { font-size: .56rem; color: var(--fg-soft); margin-left: .45rem; font-style: normal; }

  /* ── markdown inside the set text ────────────────────────────────────────
     Chat, not a document: emphasis, code, quotations and short lists, set to
     sit inside the reading column without disturbing its rhythm. There are no
     headings and no tables on purpose. Every node is built by `renderRich`
     from a tokeniser — never from a string of markup. */
  .bubble strong { font-weight: 700; }
  .bubble em { font-style: italic; }
  .bubble code {
    font-family: var(--font-mono); font-size: .84em;
    background: var(--raised); border: 1px solid var(--rule); border-radius: 1px;
    padding: .04em .28em; overflow-wrap: anywhere;
  }
  .bubble pre {
    margin: .5rem 0; padding: .5rem .7rem; max-width: 100%; overflow-x: auto;
    background: var(--raised); border: 1px solid var(--rule); border-radius: 1px;
    border-left: 2px solid var(--rule);
  }
  .bubble pre code {
    display: block; background: none; border: 0; padding: 0;
    white-space: pre; font-size: .82em; line-height: 1.52; overflow-wrap: normal;
  }
  .bubble blockquote {
    margin: .42rem 0; padding: .04rem 0 .04rem .8rem;
    border-left: 1px solid var(--rule); color: var(--fg-soft); font-style: italic;
  }
  .bubble ul, .bubble ol { margin: .42rem 0; padding-left: 1.3rem; }
  .bubble ul { list-style: square; }
  .bubble li { margin: .08rem 0; }
  .bubble li::marker { color: var(--fg-soft); }
  .bubble a {
    color: var(--accent); text-decoration: none;
    border-bottom: 1px solid var(--accent-soft); overflow-wrap: anywhere;
  }
  .bubble a:hover { border-bottom-color: var(--accent); }
  /* A block already carries its own leading; pre-wrap must not add another. */
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }

  /* ── link preview ────────────────────────────────────────────────────────
     A catalogue entry: plate at the left, the site as tracked small caps, the
     title in the display face, one or two lines of description. Every field is
     optional and the card is designed to be right with any of them absent —
     including an image that fails, which removes itself. The data arrives from
     Rust; this page never fetches a URL. */
  .lp {
    display: flex; align-items: stretch; margin-top: .55rem;
    max-width: 27rem; overflow: hidden;
    border: 1px solid var(--rule); border-radius: 1px; background: var(--raised);
    color: inherit; text-decoration: none;
  }
  .lp:hover { border-color: var(--accent); background: var(--surface); }
  .lp.noimg { max-width: 25rem; }
  .lp-thumb {
    flex: none; width: 86px; align-self: stretch; min-height: 62px;
    object-fit: cover; display: block;
    background: var(--surface); border-right: 1px solid var(--rule);
  }
  .lp-body { min-width: 0; flex: 1; padding: .5rem .7rem .55rem; }
  .lp-site { font-size: .55rem; color: var(--fg-soft); }
  .lp-title {
    font-family: var(--font-display); font-size: .88rem; font-weight: 600;
    line-height: 1.3; margin-top: .1rem; color: var(--fg);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .lp:hover .lp-title { color: var(--accent); }
  .lp-desc {
    font-size: .78rem; line-height: 1.45; color: var(--fg-soft); margin-top: .2rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .msg.mine::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 2px; background: var(--accent);
  }
  .msg.mine .msg-name { color: var(--accent); }

  /* A message reached from a search stays marked for as long as the anchored
     view is open — a passage found, not a flash that vanishes. */
  .msg.hit { background: var(--accent-soft); }
  .msg.hit::after {
    content: ""; position: absolute; right: 0; top: 0; bottom: 0;
    width: 2px; background: var(--accent);
  }
  @keyframes flash { 0%, 100% { background: transparent; } 26% { background: var(--accent-soft); } }
  .msg.flash { animation: flash 1.6s ease-out 1; }

  /* Replies read as quotations: indented behind a hairline, set italic, with
     the quoted author as a small tracked attribution. */
  .quote {
    border: 0; border-left: 1px solid var(--rule);
    padding: .05rem 0 .05rem .8rem; margin: 0 0 .45rem;
    font: inherit; font-size: .84rem; color: var(--fg-soft); line-height: 1.5;
    max-width: 100%; overflow: hidden; cursor: pointer; text-align: left;
    background: none; display: block; width: 100%;
  }
  .quote:hover { color: var(--fg); border-left-color: var(--accent); }
  .quote:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .quote b {
    display: block; font-family: var(--font-label); font-weight: 400;
    font-size: .58rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--fg-soft); margin-bottom: .18rem;
  }
  .quote:hover b { color: var(--accent); }
  .quote-text {
    font-style: italic;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* Plates. A hairline frame on the paper stock, no rounding to speak of. */
  .atts { display: flex; flex-direction: column; gap: .4rem; margin-top: .5rem; }
  .msg-body > .atts:first-child { margin-top: 0; }
  .att-img {
    display: block; max-width: min(340px, 100%); max-height: 340px;
    border-radius: 1px; border: 1px solid var(--rule); background: var(--raised);
    padding: 3px;
  }
  .att-miss {
    display: flex; align-items: center; gap: .6rem;
    max-width: 340px; padding: .7rem .85rem;
    border: 1px solid var(--rule); border-radius: 1px;
    color: var(--fg-soft); font-size: .78rem; line-height: 1.45; background: var(--raised);
  }
  .att-miss svg { width: 17px; height: 17px; flex: none; opacity: .75; }

  /* Reactions sit under the passage like margin notes: tracked, unfilled,
     quiet until they are yours. */
  .reacts { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .5rem; }
  .react {
    display: inline-flex; align-items: center; gap: .35rem;
    font-size: .6rem; line-height: 1; padding: .24rem .42rem;
    border-radius: 1px; border: 1px solid transparent; background: none;
    color: var(--fg-soft); cursor: pointer;
  }
  .react:hover:not(:disabled) { background: var(--raised); color: var(--fg); }
  .react.own { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
  .react:disabled { cursor: default; }
  .react .glyph {
    font-family: var(--font-ui); font-size: .8rem; letter-spacing: 0; text-transform: none;
  }
  .react span:not(.glyph) { font-family: var(--font-mono); font-size: .58rem; letter-spacing: .02em; }

  /* Row actions: revealed on hover, never on a permanent toolbar that would
     double the height of every row in a six-figure thread. A segmented
     hairline strip rather than a floating pill. */
  .acts {
    position: absolute; top: -.7rem; right: .3rem; display: none; gap: 0;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 1px;
    padding: 0; box-shadow: var(--lift); z-index: 3;
  }
  .msg.mine .acts { right: .3rem; left: auto; }
  .msg:hover .acts, .msg:focus-within .acts { display: flex; }
  .act {
    width: 27px; height: 25px; border: 0; border-left: 1px solid var(--rule);
    background: none; color: var(--fg-soft);
    border-radius: 0; display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .act:first-child { border-left: 0; }
  .act:hover { background: var(--raised); color: var(--accent); }
  .act svg { width: 13px; height: 13px; }
  .act .emo { font-size: .9rem; line-height: 1; }

  /* ---------- composer ----------

     One field, not a row of controls.

     The reply/edit strip and the attachment tray are *sections of the field*,
     inside its frame and above the typing line, rather than loose blocks
     floating over it. Two things follow from that. They read as attached,
     because they are. And because the whole field is bottom-anchored in a flex
     column, they grow upward — so the line the cursor is on never moves when a
     reply is started, a thumbnail arrives or an upload finishes.

     Attach sits at the left of the text, ahead of it in reading order and
     unfilled. Send sits at the right and is the only filled control on the
     page: primary by contrast rather than by size.                          */

  .composer {
    flex: none; border-top: 1px solid var(--rule);
    padding: .55rem 1.1rem .62rem; background: var(--surface);
  }
  .composer-inner { max-width: var(--measure); margin: 0 auto; }

  .composer-field {
    border: 1px solid var(--rule); border-radius: 2px; background: var(--bg);
  }
  .composer-field:focus-within {
    border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft);
  }

  /* Reply / edit context. A section of the field, marked in its own margin. */
  .ctx {
    display: none; align-items: flex-start; gap: .55rem; position: relative;
    padding: .4rem .5rem .4rem .75rem;
    border-bottom: 1px solid var(--rule); background: var(--raised);
    font-size: .8rem; color: var(--fg-soft);
  }
  .ctx.show { display: flex; }
  .ctx::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 2px; background: var(--accent);
  }
  .ctx-body { min-width: 0; flex: 1; }
  .ctx-title { color: var(--accent); font-size: .56rem; margin-bottom: .06rem; }
  .ctx-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; }
  .ctx-x {
    flex: none; width: 21px; height: 21px; border: 0; background: none; color: var(--fg-soft);
    border-radius: 1px; display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .ctx-x:hover { background: var(--surface); color: var(--accent); }
  .ctx-x svg { width: 12px; height: 12px; }

  /* Attachment tray. Also a section of the field, so thumbnails appearing and
     disappearing never shift the typing line. */
  .drafts {
    display: none; flex-wrap: wrap; gap: .5rem;
    padding: .5rem .55rem; border-bottom: 1px solid var(--rule);
  }
  .drafts.show { display: flex; }
  .draft-att { position: relative; }
  .draft-att img {
    display: block; width: 62px; height: 62px; object-fit: cover;
    border-radius: 1px; border: 1px solid var(--rule); background: var(--surface); padding: 2px;
  }
  .draft-att .ctx-x {
    position: absolute; top: -7px; right: -7px; width: 19px; height: 19px;
    background: var(--surface); border: 1px solid var(--rule);
  }
  .draft-att .up {
    font-size: .55rem; color: var(--fg-soft); text-align: center; margin-top: .2rem;
  }
  .draft-att.failed img { border-color: var(--accent); }
  .draft-att.failed .up { color: var(--accent); }

  .composer-box { display: flex; align-items: flex-end; gap: .3rem; padding: .28rem .3rem; }
  /* A hairline between the attach control and the text, the same device the
     rest of the page uses to separate a margin from a column. It grows with
     the field, so a tall draft reads as one block rather than three controls. */
  .composer-box textarea {
    flex: 1; min-width: 0; font: inherit; font-family: var(--font-ui);
    font-size: .95rem; line-height: 1.6; color: var(--fg);
    border: 0; border-left: 1px solid var(--rule); background: none; resize: none;
    margin: 0; padding: .4rem .4rem .4rem .7rem;
    max-height: 176px; overflow-y: auto;
    -webkit-user-select: text; user-select: text;
  }
  .composer-box textarea::placeholder { color: var(--fg-soft); }
  .composer-box textarea:focus { outline: none; }
  .composer-field:focus-within .composer-box textarea { border-left-color: var(--accent-soft); }

  .cbtn {
    flex: none; width: 30px; height: 30px; border-radius: 2px; margin-bottom: 2px;
    border: 1px solid transparent; background: none; color: var(--fg-soft);
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .cbtn:hover:not(:disabled) { color: var(--fg); background: var(--raised); border-color: var(--rule); }
  .cbtn:disabled { opacity: .38; cursor: not-allowed; }
  .cbtn svg { width: 15px; height: 15px; }
  .cbtn.go {
    width: 32px; background: var(--accent); border-color: var(--accent); color: var(--bg);
  }
  .cbtn.go svg { width: 14px; height: 14px; }
  .cbtn.go:hover:not(:disabled) { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .cbtn.go:disabled { background: none; border-color: var(--rule); color: var(--fg-soft); opacity: 1; }

  /* Reserved height and a single non-wrapping line, so a hint, a count, an
     offline notice or an error appearing and disappearing cannot move the
     field above it by a pixel. */
  .composer-foot {
    display: flex; align-items: baseline; gap: .6rem;
    margin-top: .42rem; min-height: 1.15rem; font-size: .74rem; color: var(--fg-soft);
  }
  .composer-foot .grow {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.4;
  }
  .composer-foot .hint { font-size: .55rem; }
  .composer-foot .count { font-size: .58rem; flex: none; }
  .composer-foot .count.over { color: var(--warn); }
  .cerr { color: var(--accent); }

  /* ---------- popovers ---------- */

  .pop {
    position: fixed; z-index: 40; display: none;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 1px;
    box-shadow: var(--pop); padding: 0;
  }
  .pop.show { display: block; }
  .pop-emoji { display: grid; grid-template-columns: repeat(7, 2rem); gap: 0; }
  .pop-emoji button {
    width: 2rem; height: 2rem; border: 0; border-left: 1px solid var(--rule);
    background: none; border-radius: 0;
    font-size: 1.05rem; line-height: 1; cursor: pointer; padding: 0;
  }
  .pop-emoji button:first-child { border-left: 0; }
  .pop-emoji button:hover { background: var(--accent-soft); }

  .menu { min-width: 11.5rem; padding: .2rem 0; }
  .menu button {
    display: flex; align-items: center; gap: .6rem; width: 100%;
    border: 0; background: none; text-align: left; cursor: pointer;
    padding: .42rem .7rem; border-radius: 0; font-size: .84rem;
  }
  .menu button:hover { background: var(--raised); }
  .menu button.danger { color: var(--accent); }
  .menu button svg { width: 13px; height: 13px; flex: none; color: var(--fg-soft); }
  .menu button.danger svg { color: var(--accent); }
  .menu hr { border: 0; border-top: 1px solid var(--rule); margin: .22rem 0; }

  .scrim { position: fixed; inset: 0; z-index: 39; display: none; }
  .scrim.show { display: block; }

  /* ---------- search results: the index ----------
     The differentiator. Set as a proper index: an entry number, the
     conversation it belongs to, who wrote it, the passage with the term
     marked, and an explicit way into the thread at that point. */

  .row.hit-row { align-items: flex-start; padding-top: .7rem; padding-bottom: .7rem; }
  .hit-n {
    flex: none; width: 26px; padding-top: .1rem;
    font-family: var(--font-mono); font-size: .62rem; color: var(--fg-soft);
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .row.hit-row:hover .hit-n { color: var(--accent); }
  .hit-when { font-size: .58rem; color: var(--fg-soft); flex: none; }
  .hit-who { font-size: .58rem; color: var(--fg-soft); margin-top: .22rem; }
  .hit-text {
    font-size: .84rem; color: var(--fg); margin-top: .3rem; line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .hit-jump {
    display: flex; align-items: center; gap: .3rem; margin-top: .4rem;
    font-size: .56rem; color: var(--fg-soft); opacity: 0;
  }
  .hit-jump svg { width: 11px; height: 11px; transform: rotate(180deg); }
  .row.hit-row:hover .hit-jump,
  .row.hit-row:focus-visible .hit-jump { opacity: 1; color: var(--accent); }

  mark {
    background: var(--accent-soft); color: var(--fg);
    border-radius: 0; padding: .05em .1em;
    box-shadow: inset 0 -1px 0 var(--accent);
  }

  /* ---------- empty / toast ---------- */

  /* A designed cover page rather than a blank panel: kicker, display heading,
     one paragraph at a readable measure, then a ruled colophon. */
  .empty { flex: 1; display: grid; place-items: center; padding: 2.5rem 2rem; }
  .empty.hide { display: none; }
  .empty-inner { max-width: 30rem; text-align: left; }
  .empty-inner > * { animation: rise .5s cubic-bezier(.22, .8, .24, 1) both; }
  .empty-inner > *:nth-child(1) { animation-delay: .1s; }
  .empty-inner > *:nth-child(2) { animation-delay: .17s; }
  .empty-inner > *:nth-child(3) { animation-delay: .24s; }
  .empty-inner > *:nth-child(4) { animation-delay: .31s; }
  .empty-inner > *:nth-child(5) { animation-delay: .38s; }
  .empty-inner > *:nth-child(6) { animation-delay: .45s; }
  .empty .mark {
    width: 34px; height: 34px; border-radius: 1px; margin: 0 0 1.3rem;
    background: none; border: 1px solid var(--rule);
  }
  .empty .mark svg { width: 17px; height: 17px; stroke: var(--accent); }
  .empty-kicker {
    font-size: .58rem; letter-spacing: .18em; color: var(--accent);
    margin-bottom: .6rem;
  }
  .empty h1 {
    font-family: var(--font-display); font-size: 1.85rem; font-weight: 600;
    letter-spacing: -.005em; line-height: 1.16; margin: 0 0 .8rem;
    max-width: 22rem;
  }
  .empty p {
    margin: 0 0 .7rem; color: var(--fg-soft); font-size: .92rem; line-height: 1.7;
    max-width: 28rem;
  }
  .empty .fine {
    font-size: .58rem; letter-spacing: .1em; text-transform: uppercase;
    font-family: var(--font-label); color: var(--fg-soft);
    border-top: 1px solid var(--rule); padding-top: .75rem; margin-top: 1.4rem;
  }
  .empty .fine b {
    font-family: var(--font-mono); font-weight: 400; text-transform: none;
    letter-spacing: 0; color: var(--fg);
    border: 1px solid var(--rule); border-radius: 1px; padding: 0 .25rem; margin: 0 .1rem;
  }
  .empty .spinner { margin: 1.1rem 0 0; }

  .toast {
    position: fixed; left: 50%; bottom: 1.3rem; transform: translateX(-50%);
    z-index: 60; max-width: 32rem;
    background: var(--fg); color: var(--bg);
    border-radius: 1px; padding: .55rem .9rem; font-size: .82rem;
    box-shadow: var(--pop); display: none;
  }
  .toast.show { display: block; }
  .toast.bad { background: var(--accent); color: var(--bg); }

  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- responsive ---------- */

  @media (max-width: 980px) {
    .app { grid-template-columns: 292px 1fr; }
  }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .main { display: none; }
    .app.thread-open .sidebar { display: none; }
    .app.thread-open .main { display: flex; }
    .back { display: inline-flex; }
    .thread-head { padding: .7rem .95rem .75rem; }
    .scroller { padding: 0 .95rem; }
    .messages { padding: .5rem 0 1.2rem; }
    .composer { padding: .65rem .95rem .8rem; }
    .empty { padding: 1.75rem 1.15rem; }
    .empty h1 { font-size: 1.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--rule); }
    .msg.flash { animation: none; }
    .side-head, .list, .side-foot, .empty-inner > * { animation: none; }
    .head-caret { transition: none; }
    * { scroll-behavior: auto !important; }
  }

  /* ---------- conversation row: pin / mute / overflow ----------
     The row stays a single button; its per-conversation controls are siblings
     laid over it, so nothing interactive is ever nested inside a button. The
     overflow appears on hover and takes the place the timestamp vacates. */
  .conv { position: relative; }

  .row-flag {
    flex: none; display: inline-flex; align-self: center;
    color: var(--fg-soft); margin-left: .1rem;
  }
  .row-flag svg { width: 12px; height: 12px; display: block; }
  .row-flag.pin { color: var(--accent); }
  .row.muted .row-name { color: var(--fg-soft); }
  .row.muted.unread .row-name { color: var(--fg-soft); }

  .row-cog {
    position: absolute; top: .5rem; right: .55rem; z-index: 2;
    width: 24px; height: 24px; padding: 0; display: none;
    align-items: center; justify-content: center;
    border: 1px solid var(--rule); border-radius: 1px;
    background: var(--surface); color: var(--fg-soft); cursor: pointer;
  }
  .row-cog svg { width: 13px; height: 13px; }
  .row-cog:hover { color: var(--accent); border-color: var(--fg-soft); }
  .conv:hover .row-cog, .row-cog:focus-visible { display: flex; }
  .conv:hover .row-time, .conv:hover .unread-dot { visibility: hidden; }

  /* Two-step confirm, rendered inside the shared menu popover. */
  .confirm { padding: .7rem .8rem; min-width: 12rem; max-width: 16rem; }
  .confirm-msg { font-size: .82rem; line-height: 1.45; color: var(--fg); margin-bottom: .6rem; }
  .confirm-row { display: flex; gap: .4rem; justify-content: flex-end; }
  .confirm-btn {
    cursor: pointer; padding: .3rem .7rem; border-radius: 1px;
    font-family: var(--font-label); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase;
    border: 1px solid var(--rule); background: var(--surface); color: var(--fg);
  }
  .confirm-btn:hover { border-color: var(--fg-soft); }
  .confirm-btn.danger { border-color: var(--accent); background: var(--accent); color: var(--bg); }
  .confirm-btn.danger:hover { background: var(--fg); border-color: var(--fg); }

  /* ---------- in-conversation find ----------
     A second band under the running head, and a dropdown of matches scoped to
     the open thread. Keyword only; it reuses the archive search command with a
     conversation id. */
  .findbar {
    display: none; align-items: center; gap: .5rem; flex: none;
    max-width: var(--measure); width: 100%; margin: .5rem auto 0;
    padding: 0; position: relative;
  }
  .findbar.show { display: flex; }
  .findbar > svg {
    position: absolute; left: .55rem; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: var(--fg-soft); pointer-events: none;
  }
  .findbar input[type="search"] {
    flex: 1; min-width: 0; font-family: var(--font-ui); font-size: .87rem;
    padding: .4rem .6rem .4rem 1.85rem;
  }
  .find-count {
    flex: none; font-family: var(--font-label); font-size: .58rem;
    letter-spacing: .1em; text-transform: uppercase; color: var(--fg-soft);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .find-nav {
    flex: none; width: 26px; height: 26px; padding: 0; border-radius: 1px;

     Every assumption about what realtime.rs emits lives in these four
     functions and nowhere else. See the file header for the documented shapes.
     Each one returns a normalised object or null; null is dropped silently
     rather than guessed at, because acting on a misread frame is worse than
     missing one — the next sync repairs a missed frame.                    */

  function unwrap(p) {
    // Tauri hands the handler `{ payload, event, id }`; a raw payload is also
    // accepted so the adapters can be exercised directly.
    if (p && typeof p === "object" && "payload" in p && !("id" in p && "text" in p)) {
      return p.payload;
    }
    return p;
  }

    for (var i = 1; i < arguments.length; i++) {
      if (o && o[arguments[i]] !== undefined && o[arguments[i]] !== null) return o[arguments[i]];
    }
    return null;
  }

  function adaptMessage(raw) {
    var p = unwrap(raw);
    if (!p || typeof p !== "object") return null;
    var m = (p.id != null && (p.text !== undefined || p.created_at !== undefined || p.createdAt !== undefined))
      ? p
      : (p.message || p.msg || p.data || null);
    if (!m || typeof m !== "object" || m.id == null) return null;
    var cid = fld(p, "conversation_id", "conversationId") ||
              fld(m, "group_id", "groupId") ||
              fld(m, "conversation_id", "conversationId");
    if (cid == null) return null;
    return { cid: String(cid), msg: m };
  }

  function adaptReaction(raw) {
    var p = unwrap(raw);
    if (!p || typeof p !== "object") return null;
    var m = p.message || p.msg || null;
    var cid = fld(p, "conversation_id", "conversationId") ||
              (m && (fld(m, "group_id", "groupId") || fld(m, "conversation_id", "conversationId")));
    var mid = fld(p, "message_id", "messageId") || (m && m.id) || (p.id != null ? p.id : null);
    if (cid == null || mid == null) return null;

    var list = fld(p, "reactions") || (m && fld(m, "reactions"));
    if (!Array.isArray(list)) {
      // Some frames carry only the like roster. Normalise it into the one
      // reaction row the renderer already understands.
      var favs = fld(p, "favorited_by", "favoritedBy") || (m && fld(m, "favorited_by", "favoritedBy"));
      list = Array.isArray(favs) ? [{ type: "like", user_ids: favs.map(String) }] : null;
    }
    if (!Array.isArray(list)) return null;
    return { cid: String(cid), mid: String(mid), reactions: list };
  }

  function adaptTyping(raw) {
    var p = unwrap(raw);
    if (!p || typeof p !== "object") return null;
    var cid = fld(p, "conversation_id", "conversationId", "group_id", "groupId");
    if (cid == null) return null;
    var uid = fld(p, "user_id", "userId", "sender_id", "senderId");
    var until = fld(p, "until", "expires_at", "expiresAt");
    var ms = null;
    if (until != null && isFinite(Number(until))) {
      var n = Number(until);
      ms = n > 1e11 ? n : n * 1000;
    }
    return {
      cid: String(cid),
      uid: uid == null ? "?" : String(uid),
      name: fld(p, "name", "nickname", "user_name", "userName"),
      until: ms == null ? Date.now() + 6000 : ms

  }

  function adaptState(raw) {
    var p = unwrap(raw);
    if (typeof p === "boolean") return { connected: p, label: p ? "Live" : "Offline" };
    if (typeof p === "string") {
      var s = p.toLowerCase();
      return { connected: s === "connected" || s === "live" || s === "open" || s === "ready", label: p };
    }
    if (!p || typeof p !== "object") return null;
    var c = fld(p, "connected", "online", "ok", "is_connected", "isConnected");
    var label = fld(p, "state", "status", "label");
    if (c == null && label == null) return null;
    if (c == null) {
      var t = String(label).toLowerCase();
      c = t === "connected" || t === "live" || t === "open" || t === "ready";
    }
    return { connected: !!c, label: label == null ? (c ? "Live" : "Offline") : String(label) };
  }

  /* `archive://connectivity` carries `connectivity::Connectivity`, which serde
     renders lowercase: "online" | "degraded" | "offline". This is a *different*
     signal from `realtime://state` — it is the Rust monitor's probe result, not
     the websocket's opinion — and it is the one that decides whether the app is
     offline. Anything unrecognised is dropped rather than guessed at. */
  function adaptConnectivity(raw) {
    var p = unwrap(raw);
    if (typeof p === "boolean") return p ? "online" : "offline";
    if (typeof p === "string") {
      var s = p.toLowerCase().trim();
      return (s === "online" || s === "degraded" || s === "offline") ? s : null;
    }
    if (!p || typeof p !== "object") return null;
    var v = fld(p, "state", "status", "connectivity");
    if (v != null) return adaptConnectivity(String(v));
    var c = fld(p, "online", "connected", "ok");
    if (c != null) return c ? "online" : "offline";
    return null;
  }

  /* =============================== ids ==================================
     Never Number(), never parseInt(). GroupMe ids are 18-digit decimal
     strings; a double rounds them in steps of 32.                          */

  var NUMERIC = /^[0-9]+$/;

  function cmpId(a, b) {
    a = a == null ? "" : String(a);
    b = b == null ? "" : String(b);
    if (NUMERIC.test(a) && NUMERIC.test(b)) {
      if (a.length !== b.length) return a.length < b.length ? -1 : 1;
    }
    return a < b ? -1 : (a > b ? 1 : 0);

  // The exclusive `beforeId` cursor that yields `id` itself as the newest row.
  // `messages_page` filters on `id_sort < before_sort`, so the anchor has to be
  // one past the target. BigInt is exact at this magnitude; a double is not.
  function idPlusOne(id) {
    var s = String(id == null ? "" : id);
    if (!NUMERIC.test(s)) return null;
    try { return (BigInt(s) + BigInt(1)).toString(); } catch (e) { return null; }
  }

  /* ============================= DOM helpers ============================= */

  var $ = function (id) { return document.getElementById(id); };

  // The one and only way data reaches the DOM in this file: as a text node.
  function el(tag, cls, text) {

    if (text != null) n.textContent = String(text);
    return n;

    b.type = "button";

  /* ============================ time helpers ============================= */

  // Epoch seconds is the GroupMe convention; tolerate milliseconds anyway.
  // Timestamps are ordinary numbers well inside the safe range — unlike ids.
  function toDate(v) {
    if (v == null) return null;
    var n = Number(v);
    if (!isFinite(n) || n <= 0) return null;
    return new Date(n > 1e11 ? n : n * 1000);
  }

  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

  function relTime(v) {
    var d = toDate(v);
    if (!d) return "";
    var now = new Date();
    var secs = Math.floor((now - d) / 1000);
    if (secs < 45) return "now";
    if (secs < 3600) return Math.max(1, Math.floor(secs / 60)) + "m";
    var days = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
    if (days <= 0) return Math.max(1, Math.floor(secs / 3600)) + "h";
    if (days === 1) return "Yesterday";
    if (days < 7) return DAYS[d.getDay()].slice(0, 3);
    if (d.getFullYear() === now.getFullYear()) return MONTHS[d.getMonth()] + " " + d.getDate();
    return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }

  function clockTime(v) {
    var d = toDate(v);
    if (!d) return "";
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + (m < 10 ? "0" + m : m) + " " + ampm;
  }

  function dayLabel(v) {
    var d = toDate(v);
    if (!d) return "";
    var now = new Date();
    var days = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
    if (days === 0) return "Today";
    if (days === 1) return "Yesterday";
    var base = DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
    return d.getFullYear() === now.getFullYear() ? base : base + ", " + d.getFullYear();
  }

  function nowSecs() { return Math.floor(Date.now() / 1000); }

  function initials(name) {
    var parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  // Muted earth tones so the avatars sit inside the palette rather than
  // shouting over it. Every one clears 4.5:1 against the white initials.
  var HUES = ["#8c4a2f", "#1f5c56", "#3f4a7a", "#6d3f6b", "#8a5a00", "#2f5d3a", "#5d5647", "#7a3345"];

  var PAGE = 60;              // messages per archive page
  var CHUNK_MAX = 80;         // rows per virtualised chunk
  var KEEP_MARGIN = "1400px"; // how far outside the viewport a chunk stays live
  var GROUP_WINDOW = 5 * 60;  // seconds within which a sender's rows group
  var MAX_TEXT = 1000;        // mirrors client_commands::MAX_TEXT_CHARS
  var REACTIONS = ["❤️", "👍", "😂", "😮", "😢", "🎉"];

  var state = {
    convos: [],
    byId: Object.create(null),
    active: null,           // conversation id
    activeKind: "group",
    chunks: [],             // the loaded slice of this thread, oldest-first
    msgById: new Map(),     // id string -> message object
    nodeById: new Map(),    // id string -> rendered row (materialised chunks only)
    pendingQuotes: [],      // quote nodes whose target has not been paged in
    cursor: null,           // raw id string; beforeId for the next older page
    hasMore: true,
    loading: false,
    anchored: false,        // viewing an older slice reached from search
    atBottom: true,
    seq: 0,                 // guards a stale page landing after a switch
    selfId: null,
    accountName: null,
    // What the header pill resolves from, kept apart on purpose.
    //   net  — "online" | "degraded" | "offline" from archive://connectivity
    //   rt   — the realtime socket's last word, which can be latched (see
    //          paintConn); never painted while the app is offline
    //   connected — the resolved answer, which is what the composer reads
    net: null,
    rt: null,
    connected: null,
    mediaCache: new Map(),
    mediaPending: new Map(),
    localPreview: new Map(),// uploaded url -> data: url, for this session only
    typing: new Map(),      // conversation id -> Map(userId -> {name, until})
    reply: null,            // { id, name, text }
    editing: null,          // { id, original }
    drafts: [],             // { url, dataUrl, uploading, error }
    readAt: Object.create(null),
    sending: false

  /* --------- unread bookkeeping ---------
     Three tiers, server truth first. The old local-only rule showed a
     conversation as unread whenever its newest message postdated the last time
     *this window* had it open, so anything already read on a phone came back
     unread here forever.

       1. `unread_count` from the archive is authoritative when it is a number.
          It is a small count, not an id, so Number() is safe on it.
       2. Failing that, `last_read_message_id` against the newest known message
          id, compared with cmpId — digits as strings, longer wins, then
          lexicographic. Never numerically: these are 18-digit values.
       3. Failing both, the original local timestamp behaviour, which is all
          this window can know on its own.

     Marking read writes tier 1 and 2 back onto the cached conversation so the
     row does not resurrect on the next repaint, and `client_mark_read` still
     carries the real message id to GroupMe. */

  var READ_KEY = "groupme.readAt.v1";

    try {

      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o === "object") state.readAt = o;
      }

      if (self) state.selfId = String(self);
    } catch (e) { /* private mode, corrupt value: unread just resets */ }
  }

  function saveReadAt() {
    try { window.localStorage.setItem(READ_KEY, JSON.stringify(state.readAt)); } catch (e) { /* ignore */ }
  }

  function rememberSelf(id) {
    if (!id || state.selfId === String(id)) return;
    state.selfId = String(id);
    try { window.localStorage.setItem("groupme.selfId.v1", state.selfId); } catch (e) { /* ignore */ }
  }

  function convoStamp(c) {
    return Number(fld(c, "last_message_created_at", "lastMessageCreatedAt") || fld(c, "updated_at", "updatedAt") || 0);
  }

  // A count, never an id. `fld` is not used because 0 is a meaningful value
  // here and `fld` treats only null/undefined as absent — which is exactly
  // right, so it would work; this spells it out because the distinction between
  // "zero unread" and "unknown" is the whole point of tier 1.
  function unreadCountOf(c) {
    var raw = fld(c, "unread_count", "unreadCount");
    if (raw == null) return null;
    var n = Number(raw);

    return n < 0 ? 0 : Math.floor(n);
  }

  // carries one in the archive schema; if it is absent, the open thread's own
  // newest row is just as good. Optimistic rows are skipped — their ids are not
  // GroupMe ids and must never be compared against one.
  function newestIdFor(c) {
    if (!c) return null;
    var id = fld(c, "last_message_id", "lastMessageId");
    if (id != null) return String(id);
    if (String(c.id) === String(state.active)) {

    }
    return null;

    var n = unreadCountOf(c);

    var lastRead = fld(c, "last_read_message_id", "lastReadMessageId");
    if (lastRead != null) {

      // when the newest id is unknown is deliberate: tier 2 cannot answer
      // without both sides, and guessing here is what tier 3 is for.
      if (newest != null) return { unread: cmpId(newest, String(lastRead)) > 0, count: null };
    }

  var T0 = nowSecs();

  // answer stays null rather than becoming a guess — a wrong answer here would
  // put someone else's messages on the right-hand side and offer to delete
  // them. A sent message settles it for good (see rememberSelf).
  function inferSelfFromDms() {
    if (state.selfId) return;

      c.id.split("+").forEach(function (half) {

        seen[half] = 1;
        counts[half] = (counts[half] || 0) + 1;

    var winner = null;
    Object.keys(counts).forEach(function (k) {

  /* --------- pin / mute / block state ---------

  // regardless of the incoming order.
  function pinnedSorted() {
    return state.convos.filter(isPinned).sort(function (a, b) {

      if (ra !== rb) return ra < rb ? -1 : 1;

  }

  // The other participant of a DM. Ids stay strings the whole way. Prefers an
  // explicit field, then the "+"-joined key with our own id removed, then the
  // id itself (this app keys a DM by the other user's id).
  function dmOtherUserId(c) {
    if (!c) return null;
    var o = fld(c, "other_user_id", "otherUserId");
    if (o != null) return String(o);
    if (c.other_user && c.other_user.id != null) return String(c.other_user.id);
    var id = String(c.id == null ? "" : c.id);
    if (id.indexOf("+") >= 0) {
      var parts = id.split("+").map(function (s) { return s.trim(); }).filter(Boolean);
      if (state.selfId) {
        for (var i = 0; i < parts.length; i++) if (parts[i] !== state.selfId) return parts[i];
      }
      return parts[0] || null;
    }
    return id || null;
  }

  function isBlocked(uid) { return uid != null && !!blockedUsers[String(uid)]; }

  function shortName(name) {
    var s = String(name == null ? "" : name).trim();
    if (!s) return "user";
    var first = s.split(/\s+/)[0];
    return first.length > 18 ? first.slice(0, 18) + "…" : first;
  }

  function renderConversations() {
    listEl.textContent = "";
    if (!state.convos.length) {
      listEl.appendChild(el("div", "side-empty",
        "No conversations have been archived yet. The first sync is still running."));
      return;
    }
    // Pinned first, in the user's pin order; the rest keep the recency order the
    // archive already delivers. Two sections, so reorder has somewhere to move.
    var pinned = pinnedSorted();
    var rest = state.convos.filter(function (c) { return !isPinned(c); });
    var unread = state.convos.filter(isUnread).length;

    if (pinned.length) {
      var plabel = el("div", "list-label", "Pinned");
      plabel.appendChild(el("span", "sub", String(pinned.length)));
      listEl.appendChild(plabel);
      var pfrag = document.createDocumentFragment();
      pinned.forEach(function (c) { pfrag.appendChild(convoRow(c)); });
      listEl.appendChild(pfrag);
    }

    var label = el("div", "list-label", pinned.length ? "All conversations" : "Conversations");
    if (unread) label.appendChild(el("span", "sub", unread + " unread"));
    listEl.appendChild(label);
    var frag = document.createDocumentFragment();
    rest.forEach(function (c) { frag.appendChild(convoRow(c)); });
    listEl.appendChild(frag);
  }

  // The row stays a single button, wrapped in a `.conv` that also owns the
  // overflow control — a sibling laid over the row, never a button nested in a
  // button. `data-cid` is on the wrapper (what the list operations target) and
  // on the row (what the active/unread repaints target).
  function convoRow(c) {
    var name = convoTitle(c);
    var un = unreadInfo(c);
    var pinned = isPinned(c), muted = isMuted(c);

    var wrap = el("div", "conv" + (pinned ? " pinned" : ""));
    wrap.dataset.cid = c.id;

    var row = el("button", "row");
    row.type = "button";
    row.setAttribute("role", "listitem");
    if (state.active === c.id) row.classList.add("active");
    if (un.unread) row.classList.add("unread");
    if (muted) row.classList.add("muted");
    row.dataset.cid = c.id;

    row.appendChild(makeAvatar(name, fld(c, "image_url", "imageUrl"), c.id, c.kind === "group" ? "square" : null));

    var body = el("div", "row-body");
    var top = el("div", "row-top");
    top.appendChild(el("div", "row-name", name));
    if (pinned) {
      var pf = withIcon(el("span", "row-flag pin"), "pin");
      pf.setAttribute("aria-label", "Pinned");
      top.appendChild(pf);
    }
    if (muted) {
      var mf = withIcon(el("span", "row-flag mute"), "bell-off");
      mf.setAttribute("aria-label", "Muted");
      top.appendChild(mf);
    }
    top.appendChild(el("div", "row-time", relTime(convoStamp(c))));
    if (un.unread) {
      // A number when the server knows one, otherwise a plain accent mark. The
      // count is a small integer, so String() of it is exact.
      var showCount = un.count != null && un.count > 0;
      var mark = el("div", "unread-dot" + (showCount ? " n" : ""),
        showCount ? (un.count > 99 ? "99+" : String(un.count)) : null);
      mark.setAttribute("aria-label", showCount
        ? un.count + (un.count === 1 ? " unread message" : " unread messages")
        : "Unread");
      top.appendChild(mark);
    }
    body.appendChild(top);

    var prev = fld(c, "last_message_text", "lastMessageText");
    body.appendChild(el("div", "row-prev", prev ? String(prev).replace(/\s+/g, " ") : "No messages yet"));
    row.appendChild(body);
    row.addEventListener("click", function () { openConversation(c.id); });
    wrap.appendChild(row);

    var cog = btn("row-cog", "Options for " + name, function (e) {
      e.stopPropagation();
      openConvMenu(e.currentTarget, c);
    });
    cog.appendChild(icon("cog"));
    wrap.appendChild(cog);
    return wrap;
  }

  // Moves one conversation to the top and repaints only the rows that changed,
  // rather than rebuilding a list that can hold hundreds of entries.
  function touchConversation(cid, text, stamp) {
    var c = state.byId[cid];
    if (!c) return;
    if (text != null) c.last_message_text = text;
    if (stamp != null) c.last_message_created_at = stamp;
    var i = state.convos.indexOf(c);
    if (i > 0) { state.convos.splice(i, 1); state.convos.unshift(c); }
    if (searchActive()) return;

    var existing = listEl.querySelector('.conv[data-cid="' + cssEscape(cid) + '"]');
    var fresh = convoRow(c);

    // A pinned row keeps its user-chosen slot; new activity only refreshes its
    // content (preview text, timestamp, unread mark), never its position.
    if (isPinned(c)) {
      if (existing) existing.replaceWith(fresh);
      else renderConversations();
      return;
    }
    // An unpinned row rises to the top of the unpinned section — which sits
    // directly under its section label, after any pinned rows.
    if (existing) existing.remove();
    var firstUnpinned = listEl.querySelector('.conv:not(.pinned)');
    if (firstUnpinned) listEl.insertBefore(fresh, firstUnpinned);
    else renderConversations();
  }

  function cssEscape(v) {
    var s = String(v);
    if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(s);
    return s.replace(/["\\]/g, "\\$&");
  }

  async function loadStats() {
    var s = await call("archive_stats");
    if (!s) { $("stats").textContent = "Local archive"; return null; }
    var msgs = Number(fld(s, "messages") || 0);
    var convs = Number(fld(s, "conversations") || 0);
    var synced = fld(s, "last_sync_at", "lastSyncAt");
    state.accountName = fld(s, "account_name", "accountName") || null;

    var bits = [];
    bits.push(msgs.toLocaleString() + (msgs === 1 ? " message" : " messages"));
    bits.push(convs.toLocaleString() + (convs === 1 ? " conversation" : " conversations"));
    if (!synced) {
      bits.push("never synced");
    } else {
      var r = relTime(synced);
      bits.push(r === "now" ? "synced just now"
        : /^\d+[mh]$/.test(r) ? "synced " + r + " ago"
        : "synced " + r);
    }
    var foot = $("stats");
    foot.textContent = bits.join(" · ");
    foot.title = state.accountName ? "Signed in as " + state.accountName : "";
    return s;
  }

  /* ========================== virtualised log ===========================

     The thread is held as an ordered list of chunks, oldest first. A chunk
     owns up to CHUNK_MAX messages and one DOM element. When it scrolls further
     than KEEP_MARGIN outside the viewport its rows are dropped and the element
     keeps its measured height as a spacer; when it comes back, the rows are
     rebuilt. So the number of live DOM rows is bounded by the viewport, not by
     the size of the conversation — a 142,000-message thread costs the same as
     a 40-message one.

     Two properties this buys, both of which have been broken here before:
       * a new message appends exactly one row to one chunk. Nothing else in
         the thread is touched, so live traffic is O(1), not O(N) per frame
         (and not O(N²) across a burst).
       * paging older rebuilds at most the newest chunk of the page and the one
         row whose day separator or sender grouping the page can change.       */

  var scroller = $("scroller"), msgsEl = $("messages"), topState = $("topState");

  var observer = ("IntersectionObserver" in window)
    ? new IntersectionObserver(onChunkVisibility, { root: scroller, rootMargin: KEEP_MARGIN, threshold: 0 })
    : null;

  function onChunkVisibility(entries) {
    entries.forEach(function (e) {
      var chunk = e.target.__chunk;
      if (!chunk) return;
      if (e.isIntersecting) materialise(chunk); else dematerialise(chunk);
    });
  }

  function newChunk(msgs) {
    var node = el("div", "chunk");
    var chunk = { el: node, msgs: msgs || [], live: false };
    node.__chunk = chunk;
    return chunk;
  }

  function chunkIndex(chunk) { return state.chunks.indexOf(chunk); }

  function prevOf(ci, mi) {
    if (mi > 0) return state.chunks[ci].msgs[mi - 1];
    for (var i = ci - 1; i >= 0; i--) {
      var prior = state.chunks[i].msgs;
      if (prior.length) return prior[prior.length - 1];
    }
    return null;
  }

  function materialise(chunk) {
    if (chunk.live) return;
    var ci = chunkIndex(chunk);
    if (ci < 0) return;
    chunk.el.style.height = "";
    chunk.el.appendChild(buildRows(chunk.msgs, prevOf(ci, 0)));
    chunk.live = true;
    fillPendingQuotes();
  }

  function dematerialise(chunk) {
    if (!chunk.live) return;
    var h = chunk.el.offsetHeight;
    // A zero height would collapse the scroll range and yank the viewport.
    // Better to keep a chunk alive than to lose the reader's place.
    if (!h) return;
    chunk.msgs.forEach(function (m) { if (m && m.id != null) state.nodeById.delete(String(m.id)); });
    state.pendingQuotes = state.pendingQuotes.filter(function (p) { return p.node.isConnected; });
    chunk.el.textContent = "";
    chunk.el.style.height = h + "px";
    chunk.live = false;
  }

  function rebuildChunk(chunk) {
    if (!chunk.live) return;
    var ci = chunkIndex(chunk);
    if (ci < 0) return;
    chunk.msgs.forEach(function (m) { if (m && m.id != null) state.nodeById.delete(String(m.id)); });
    chunk.el.textContent = "";
    chunk.el.appendChild(buildRows(chunk.msgs, prevOf(ci, 0)));
    fillPendingQuotes();
  }

  function clearThreadDom() {
    if (observer) state.chunks.forEach(function (c) { observer.unobserve(c.el); });
    state.chunks = [];
    state.msgById = new Map();
    state.nodeById = new Map();
    state.pendingQuotes = [];
    msgsEl.textContent = "";
  }

  function indexMessages(list) {
    list.forEach(function (m) { if (m && m.id != null) state.msgById.set(String(m.id), m); });
  }

  function newestLoaded() {
    for (var i = state.chunks.length - 1; i >= 0; i--) {
      var m = state.chunks[i].msgs;
      if (m.length) return m[m.length - 1];
    }
    return null;
  }

  // Appends a page of *newer* messages (oldest-first) at the bottom.
  function appendChunk(msgs) {
    if (!msgs.length) return;
    var chunk = newChunk(msgs.slice());
    state.chunks.push(chunk);
    msgsEl.appendChild(chunk.el);
    indexMessages(chunk.msgs);
    // Rendered now, not when the observer next runs. The observer delivers on a
    // later frame, and a caller that scrolls to the bottom immediately
    // afterwards would be measuring an empty element.
    materialise(chunk);
    if (observer) observer.observe(chunk.el);
    trimRetained();
  }

  /* Caps retained message *data*, which the chunk observer does not.
     Dematerialising frees DOM nodes but each chunk keeps its `msgs` array, so a
     window left open all day in a busy group grows without limit even though
     the DOM stays flat.

     Only ever trims the oldest end, and only while the reader is at the bottom
     — so it never discards what someone is looking at, and recovery is the
     scroll-up path that already exists: reset the cursor to the new oldest
     retained id and let `pageOlder` refetch on demand. */
  var MAX_RETAINED = 3000;
  function trimRetained() {
    if (!state.atBottom) return;
    var total = 0;
    for (var i = 0; i < state.chunks.length; i++) total += state.chunks[i].msgs.length;
    if (total <= MAX_RETAINED) return;

    while (state.chunks.length > 1 && total > MAX_RETAINED) {
      var oldest = state.chunks[0];
      // Never drop so much that the thread empties; keep the newest chunk.
      if (total - oldest.msgs.length < 1) break;
      state.chunks.shift();
      if (observer) observer.unobserve(oldest.el);
      oldest.msgs.forEach(function (m) {
        if (m && m.id != null) {
          state.msgById.delete(String(m.id));
          state.nodeById.delete(String(m.id));
        }
      });
      if (oldest.el.parentNode) oldest.el.parentNode.removeChild(oldest.el);
      total -= oldest.msgs.length;
    }

    // The archive still holds everything; only this view forgot it.
    var first = state.chunks[0] && state.chunks[0].msgs[0];
    if (first && first.id != null) {
      state.cursor = String(first.id);
      state.hasMore = true;
      setTop("");
    }
  }

  // Inserts a page of *older* messages (oldest-first) at the top, preserving
  // the reader's scroll position.
  function prependChunk(msgs) {
    if (!msgs.length) return;
    var before = scroller.scrollHeight;
    var chunk = newChunk(msgs.slice());
    state.chunks.unshift(chunk);
    msgsEl.insertBefore(chunk.el, msgsEl.firstChild);
    indexMessages(chunk.msgs);
    materialise(chunk);
    if (observer) observer.observe(chunk.el);
    // The chunk that used to be first can change: its opening day separator may
    // now be redundant, and its first row may now continue the sender of the
    // page just added. One chunk, not the whole thread.
    if (state.chunks[1]) rebuildChunk(state.chunks[1]);
    scroller.scrollTop += scroller.scrollHeight - before;
  }

  // The live path. One row, one chunk, no re-render.
  function appendLive(m) {
    if (!m || m.id == null) return;
    var key = String(m.id);
    if (state.msgById.has(key)) { replaceMessage(m); return; }

    // Out-of-order frames happen: a backfill lands while a live message is in
    // flight. Appending an older message at the bottom would put it visibly in
    // the wrong place, and it is already on its way into the archive, so it is
    // left for the next open. Only checked when both ids are real GroupMe ids —
    // an optimistic row's id is not one, and comparing against it would drop
    // every genuine message.
    var newest = newestLoaded();
    if (newest && NUMERIC.test(String(newest.id)) && NUMERIC.test(key) &&
        cmpId(key, String(newest.id)) < 0) {
      return;
    }

    var last = state.chunks[state.chunks.length - 1];
    if (!last || last.msgs.length >= CHUNK_MAX) {
      appendChunk([m]);
      return;
    }
    var stick = state.atBottom;
    last.msgs.push(m);
    state.msgById.set(key, m);
    if (last.live) {
      var ci = chunkIndex(last);
      last.el.appendChild(rowFragment(m, prevOf(ci, last.msgs.length - 1)));
      fillPendingQuotes();
    } else {
      // Height is stale now; let it re-measure when it comes back into view.
      last.el.style.height = "";
      materialise(last);
    }
    if (stick) scrollToBottom();
  }

  // Replaces one message in place — an edit, a delete, a reaction, or the
  // server's copy of a message this window sent optimistically.
  function replaceMessage(m, oldId) {
    if (!m || m.id == null) return;
    var newKey = String(m.id);
    var findKey = oldId != null ? String(oldId) : newKey;

    for (var ci = 0; ci < state.chunks.length; ci++) {
      var msgs = state.chunks[ci].msgs;
      for (var mi = 0; mi < msgs.length; mi++) {
        if (msgs[mi] && String(msgs[mi].id) === findKey) {
          msgs[mi] = m;
          state.msgById.delete(findKey);
          state.msgById.set(newKey, m);
          var node = state.nodeById.get(findKey);
          state.nodeById.delete(findKey);
          if (node && node.isConnected) {
            var cont = node.classList.contains("cont");
            var fresh = renderMessage(m, cont);
            node.replaceWith(fresh);
            fillPendingQuotes();
          }
          return;
        }
      }
    }
  }

  function removeMessage(id) {
    var key = String(id);
    for (var ci = 0; ci < state.chunks.length; ci++) {
      var msgs = state.chunks[ci].msgs;
      for (var mi = 0; mi < msgs.length; mi++) {
        if (msgs[mi] && String(msgs[mi].id) === key) {
          msgs.splice(mi, 1);
          state.msgById.delete(key);
          var node = state.nodeById.get(key);
          state.nodeById.delete(key);
          if (node && node.isConnected) node.remove();
          return;
        }
      }
    }
  }

  /* ------------------------- row construction ------------------------- */

  function rowFragment(m, prev) {
    var frag = document.createDocumentFragment();
    var stamp = fld(m, "created_at", "createdAt");
    var d = toDate(stamp);
    var day = d ? startOfDay(d) : null;
    var pd = prev ? toDate(fld(prev, "created_at", "createdAt")) : null;
    var pday = pd ? startOfDay(pd) : null;

    var newDay = day !== null && day !== pday;
    if (newDay) {
      var sep = el("div", "day");
      sep.appendChild(el("span", null, dayLabel(stamp)));
      frag.appendChild(sep);
    }

    if (m.system) {
      frag.appendChild(el("div", "sys", m.text || "System message"));
      return frag;
    }

    var cont = !newDay && !!prev && !prev.system &&
      prev.user_id != null && String(prev.user_id) === String(m.user_id) &&
      Math.abs(Number(stamp) - Number(fld(prev, "created_at", "createdAt"))) <= GROUP_WINDOW;

    frag.appendChild(renderMessage(m, cont));
    return frag;
  }

  function buildRows(msgs, prev) {
    var frag = document.createDocumentFragment();
    var last = prev || null;
    for (var i = 0; i < msgs.length; i++) {
      frag.appendChild(rowFragment(msgs[i], last));
      last = msgs[i];
    }
    return frag;
  }

  /* ========================== rich message text ==========================

     Message bodies are markdown-ish. GroupMe defines no dialect, so this
     supports what people actually type in a chat window and nothing more:
     **bold**, *italic*, _italic_, `code`, ```fenced blocks```, > quotations,
     - lists, 1. lists, [labels](links) and bare http(s) URLs. No headings, no
     tables, no images, no reference links, no HTML passthrough.

     ── The safety rule ──────────────────────────────────────────────────────
     Not one node in here is created from a string of markup. No `innerHTML`,
     no `insertAdjacentHTML`, no `<template>`, no
     `Range.createContextualFragment`, no `DOMParser`. Elements come from
     `document.createElement` with a fixed tag name chosen by this file, and
     every leaf is a `document.createTextNode`. A message body has no way to
     name an element, so markup in a message is inert text and nothing runs.
     (An example is not written literally here: an HTML parser ends a script
     element at the first close-script sequence even inside a JS comment, which
     truncates this whole file and blanks the app — it did exactly that once.)

     Anchors are the one place untrusted text reaches an attribute. `safeUrl`
     is the only producer of an `href` in this file: it matches against an
     anchored `https?://…` pattern, then re-parses with `new URL` and checks
     the resulting protocol, and returns the *parser's* normalised href rather
