  /* ============================ cached media ============================
     A remote URL is never used. It would be blocked by the CSP, it points at
     an expiring signed CDN link, and offline it would render as a broken icon
     in the middle of a conversation. Only a locally cached copy is shown.   */

  function resolveMedia(url) {
    if (!url) return Promise.resolve(null);
    var key = String(url);
    if (state.mediaCache.has(key)) return Promise.resolve(state.mediaCache.get(key));
    if (state.mediaPending.has(key)) return state.mediaPending.get(key);
    var pending = call("archive_media_path", { url: key }).then(function (p) {
      state.mediaCache.set(key, p || null);
      state.mediaPending.delete(key);
      return p || null;
    }, function () {
      state.mediaPending.delete(key);
      return null;
    });
    state.mediaPending.set(key, pending);
    return pending;
  }

  function makeAvatar(name, url, seed, cls) {
    var node = el("div", "avatar" + (cls ? " " + cls : ""), initials(name));
    node.style.background = tintFor(seed || name);
    node.setAttribute("aria-hidden", "true");
    if (url) {
      resolveMedia(url).then(function (path) {
        if (!path || !node.isConnected) return;
        var img = el("img", node.className);
        img.src = localSrc(path);
        img.alt = "";
        img.onload = function () { if (node.isConnected) node.replaceWith(img); };
      });
    }
    return node;
  }

  /* ============================== sidebar =============================== */

  var listEl = $("list");

  async function loadConversations() {
    var rows = await call("archive_conversations");
    state.convos = Array.isArray(rows) ? rows : [];
    state.byId = Object.create(null);
    state.convos.forEach(function (c) { state.byId[c.id] = c; });
    inferSelfFromDms();
    if (!searchActive()) renderConversations();
    return state.convos.length;
  }

  // Which account is signed in, without a command that reports it.
  //
  // A DM's thread key is "<a>+<b>", so the id common to two different DM
  // threads is ours. With fewer than two DMs it is genuinely ambiguous and the
  // answer stays null rather than becoming a guess — a wrong answer here would
  // put someone else's messages on the right-hand side and offer to delete
  // them. A sent message settles it for good (see rememberSelf).
  function inferSelfFromDms() {
    if (state.selfId) return;
    var counts = Object.create(null), threads = 0;
    state.convos.forEach(function (c) {
      if (c.kind !== "dm" || typeof c.id !== "string" || c.id.indexOf("+") < 0) return;
      threads++;
      var seen = Object.create(null);
      c.id.split("+").forEach(function (half) {
        half = half.trim();
        if (!half || seen[half]) return;
        seen[half] = 1;
        counts[half] = (counts[half] || 0) + 1;
      });
    });
    if (threads < 2) return;
    var winner = null;
    Object.keys(counts).forEach(function (k) {
      if (counts[k] === threads) winner = winner === null ? k : false;
    });
    if (winner) rememberSelf(winner);
  }

  function convoTitle(c) {
    return (c && c.name) || (c && c.kind === "dm" ? "Direct message" : "Untitled group");
  }

  function renderConversations() {
    listEl.textContent = "";
    if (!state.convos.length) {
      listEl.appendChild(el("div", "side-empty",
        "No conversations have been archived yet. The first sync is still running."));
      return;
    }
    var unread = state.convos.filter(isUnread).length;
    var label = el("div", "list-label", "Conversations");
    if (unread) label.appendChild(el("span", "sub", unread + " unread"));
    listEl.appendChild(label);
    var frag = document.createDocumentFragment();
    state.convos.forEach(function (c) { frag.appendChild(convoRow(c)); });
    listEl.appendChild(frag);
  }

  function convoRow(c) {
    var name = convoTitle(c);
    var row = el("button", "row");
    row.type = "button";
    row.setAttribute("role", "listitem");
    if (state.active === c.id) row.classList.add("active");
    if (isUnread(c)) row.classList.add("unread");
    row.dataset.cid = c.id;

    row.appendChild(makeAvatar(name, fld(c, "image_url", "imageUrl"), c.id, c.kind === "group" ? "square" : null));

    var body = el("div", "row-body");
    var top = el("div", "row-top");
    top.appendChild(el("div", "row-name", name));
    top.appendChild(el("div", "row-time", relTime(convoStamp(c))));
    if (isUnread(c)) top.appendChild(el("div", "unread-dot"));
    body.appendChild(top);

    var prev = fld(c, "last_message_text", "lastMessageText");
    body.appendChild(el("div", "row-prev", prev ? String(prev).replace(/\s+/g, " ") : "No messages yet"));
    row.appendChild(body);

    row.addEventListener("click", function () { openConversation(c.id); });
    return row;
  }

  // Moves one conversation to the top and repaints only the rows that changed,
  // rather than rebuilding a list that can hold hundreds of entries.
  function touchConversation(cid, text, stamp) {
    var c = state.byId[cid];
    if (!c) return;
    if (text != null) c.last_message_text = text;
    if (stamp != null) c.last_message_created_at = stamp;
    var i = state.convos.indexOf(c);
    if (i > 0) { state.convos.splice(i, 1); state.convos.unshift(c); }
    if (searchActive()) return;
    var existing = listEl.querySelector('.row[data-cid="' + cssEscape(cid) + '"]');
    var fresh = convoRow(c);
    if (existing && i === 0) { existing.replaceWith(fresh); return; }
    if (existing) existing.remove();
    var first = listEl.querySelector(".row");
    if (first) listEl.insertBefore(fresh, first); else listEl.appendChild(fresh);
  }

  function cssEscape(v) {
    var s = String(v);
    if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(s);
    return s.replace(/["\\]/g, "\\$&");
  }

  async function loadStats() {
    var s = await call("archive_stats");
    if (!s) { $("stats").textContent = "Local archive"; return null; }
    var msgs = Number(fld(s, "messages") || 0);
    var convs = Number(fld(s, "conversations") || 0);
    var synced = fld(s, "last_sync_at", "lastSyncAt");
    state.accountName = fld(s, "account_name", "accountName") || null;

    var bits = [];
    bits.push(msgs.toLocaleString() + (msgs === 1 ? " message" : " messages"));
    bits.push(convs.toLocaleString() + (convs === 1 ? " conversation" : " conversations"));
    if (!synced) {
      bits.push("never synced");
    } else {
      var r = relTime(synced);
      bits.push(r === "now" ? "synced just now"
        : /^\d+[mh]$/.test(r) ? "synced " + r + " ago"
        : "synced " + r);
    }
    var foot = $("stats");
    foot.textContent = bits.join(" · ");
    foot.title = state.accountName ? "Signed in as " + state.accountName : "";
    return s;
  }

  /* ========================== virtualised log ===========================

     The thread is held as an ordered list of chunks, oldest first. A chunk
     owns up to CHUNK_MAX messages and one DOM element. When it scrolls further
     than KEEP_MARGIN outside the viewport its rows are dropped and the element
     keeps its measured height as a spacer; when it comes back, the rows are
     rebuilt. So the number of live DOM rows is bounded by the viewport, not by
     the size of the conversation — a 142,000-message thread costs the same as
     a 40-message one.

     Two properties this buys, both of which have been broken here before:
       * a new message appends exactly one row to one chunk. Nothing else in
         the thread is touched, so live traffic is O(1), not O(N) per frame
         (and not O(N²) across a burst).
       * paging older rebuilds at most the newest chunk of the page and the one
         row whose day separator or sender grouping the page can change.       */

  var scroller = $("scroller"), msgsEl = $("messages"), topState = $("topState");

  var observer = ("IntersectionObserver" in window)
    ? new IntersectionObserver(onChunkVisibility, { root: scroller, rootMargin: KEEP_MARGIN, threshold: 0 })
    : null;

  function onChunkVisibility(entries) {
    entries.forEach(function (e) {
      var chunk = e.target.__chunk;
      if (!chunk) return;
      if (e.isIntersecting) materialise(chunk); else dematerialise(chunk);
    });
  }

  function newChunk(msgs) {
    var node = el("div", "chunk");
    var chunk = { el: node, msgs: msgs || [], live: false };
    node.__chunk = chunk;
    return chunk;
  }

  function chunkIndex(chunk) { return state.chunks.indexOf(chunk); }

  function prevOf(ci, mi) {
    if (mi > 0) return state.chunks[ci].msgs[mi - 1];
    for (var i = ci - 1; i >= 0; i--) {
      var prior = state.chunks[i].msgs;
      if (prior.length) return prior[prior.length - 1];
    }
    return null;
  }

  function materialise(chunk) {
    if (chunk.live) return;
    var ci = chunkIndex(chunk);
    if (ci < 0) return;
    chunk.el.style.height = "";
    chunk.el.appendChild(buildRows(chunk.msgs, prevOf(ci, 0)));
    chunk.live = true;
    fillPendingQuotes();
  }

  function dematerialise(chunk) {
    if (!chunk.live) return;
    var h = chunk.el.offsetHeight;
    // A zero height would collapse the scroll range and yank the viewport.
    // Better to keep a chunk alive than to lose the reader's place.
    if (!h) return;
    chunk.msgs.forEach(function (m) { if (m && m.id != null) state.nodeById.delete(String(m.id)); });
    state.pendingQuotes = state.pendingQuotes.filter(function (p) { return p.node.isConnected; });
    chunk.el.textContent = "";
    chunk.el.style.height = h + "px";
    chunk.live = false;
  }

  function rebuildChunk(chunk) {
    if (!chunk.live) return;
    var ci = chunkIndex(chunk);
    if (ci < 0) return;
    chunk.msgs.forEach(function (m) { if (m && m.id != null) state.nodeById.delete(String(m.id)); });
    chunk.el.textContent = "";
    chunk.el.appendChild(buildRows(chunk.msgs, prevOf(ci, 0)));
    fillPendingQuotes();
  }

  function clearThreadDom() {
    if (observer) state.chunks.forEach(function (c) { observer.unobserve(c.el); });
    state.chunks = [];
    state.msgById = new Map();
    state.nodeById = new Map();
    state.pendingQuotes = [];
    msgsEl.textContent = "";
  }

  function indexMessages(list) {
    list.forEach(function (m) { if (m && m.id != null) state.msgById.set(String(m.id), m); });
  }

  function newestLoaded() {
    for (var i = state.chunks.length - 1; i >= 0; i--) {
      var m = state.chunks[i].msgs;
      if (m.length) return m[m.length - 1];
    }
    return null;
  }

  // Appends a page of *newer* messages (oldest-first) at the bottom.
  function appendChunk(msgs) {
    if (!msgs.length) return;
    var chunk = newChunk(msgs.slice());
    state.chunks.push(chunk);
    msgsEl.appendChild(chunk.el);
    indexMessages(chunk.msgs);
    // Rendered now, not when the observer next runs. The observer delivers on a
    // later frame, and a caller that scrolls to the bottom immediately
    // afterwards would be measuring an empty element.
    materialise(chunk);
    if (observer) observer.observe(chunk.el);
    trimRetained();
  }

  /* Caps retained message *data*, which the chunk observer does not.
     Dematerialising frees DOM nodes but each chunk keeps its `msgs` array, so a
     window left open all day in a busy group grows without limit even though
     the DOM stays flat.

     Only ever trims the oldest end, and only while the reader is at the bottom
     — so it never discards what someone is looking at, and recovery is the
     scroll-up path that already exists: reset the cursor to the new oldest
     retained id and let `pageOlder` refetch on demand. */
  var MAX_RETAINED = 3000;
  function trimRetained() {
    if (!state.atBottom) return;
    var total = 0;
    for (var i = 0; i < state.chunks.length; i++) total += state.chunks[i].msgs.length;
    if (total <= MAX_RETAINED) return;

    while (state.chunks.length > 1 && total > MAX_RETAINED) {
      var oldest = state.chunks[0];
      // Never drop so much that the thread empties; keep the newest chunk.
      if (total - oldest.msgs.length < 1) break;
      state.chunks.shift();
      if (observer) observer.unobserve(oldest.el);
      oldest.msgs.forEach(function (m) {
        if (m && m.id != null) {
          state.msgById.delete(String(m.id));
          state.nodeById.delete(String(m.id));
        }
      });
      if (oldest.el.parentNode) oldest.el.parentNode.removeChild(oldest.el);
      total -= oldest.msgs.length;
    }

    // The archive still holds everything; only this view forgot it.
    var first = state.chunks[0] && state.chunks[0].msgs[0];
    if (first && first.id != null) {
      state.cursor = String(first.id);
      state.hasMore = true;
      setTop("");
    }
  }

  // Inserts a page of *older* messages (oldest-first) at the top, preserving
  // the reader's scroll position.
  function prependChunk(msgs) {
    if (!msgs.length) return;
    var before = scroller.scrollHeight;
    var chunk = newChunk(msgs.slice());
    state.chunks.unshift(chunk);
    msgsEl.insertBefore(chunk.el, msgsEl.firstChild);
    indexMessages(chunk.msgs);
    materialise(chunk);
    if (observer) observer.observe(chunk.el);
    // The chunk that used to be first can change: its opening day separator may
    // now be redundant, and its first row may now continue the sender of the
    // page just added. One chunk, not the whole thread.
    if (state.chunks[1]) rebuildChunk(state.chunks[1]);
    scroller.scrollTop += scroller.scrollHeight - before;
  }

  // The live path. One row, one chunk, no re-render.
  function appendLive(m) {
    if (!m || m.id == null) return;
    var key = String(m.id);
    if (state.msgById.has(key)) { replaceMessage(m); return; }

    // Out-of-order frames happen: a backfill lands while a live message is in
    // flight. Appending an older message at the bottom would put it visibly in
    // the wrong place, and it is already on its way into the archive, so it is
    // left for the next open. Only checked when both ids are real GroupMe ids —
    // an optimistic row's id is not one, and comparing against it would drop
    // every genuine message.
    var newest = newestLoaded();
    if (newest && NUMERIC.test(String(newest.id)) && NUMERIC.test(key) &&
        cmpId(key, String(newest.id)) < 0) {
      return;
    }

    var last = state.chunks[state.chunks.length - 1];
    if (!last || last.msgs.length >= CHUNK_MAX) {
      appendChunk([m]);
      return;
    }
    var stick = state.atBottom;
    last.msgs.push(m);
    state.msgById.set(key, m);
    if (last.live) {
      var ci = chunkIndex(last);
      last.el.appendChild(rowFragment(m, prevOf(ci, last.msgs.length - 1)));
      fillPendingQuotes();
    } else {
      // Height is stale now; let it re-measure when it comes back into view.
      last.el.style.height = "";
      materialise(last);
    }
    if (stick) scrollToBottom();
  }

  // Replaces one message in place — an edit, a delete, a reaction, or the
  // server's copy of a message this window sent optimistically.
  function replaceMessage(m, oldId) {
    if (!m || m.id == null) return;
    var newKey = String(m.id);
    var findKey = oldId != null ? String(oldId) : newKey;

    for (var ci = 0; ci < state.chunks.length; ci++) {
      var msgs = state.chunks[ci].msgs;
      for (var mi = 0; mi < msgs.length; mi++) {
        if (msgs[mi] && String(msgs[mi].id) === findKey) {
          msgs[mi] = m;
          state.msgById.delete(findKey);
          state.msgById.set(newKey, m);
          var node = state.nodeById.get(findKey);
          state.nodeById.delete(findKey);
          if (node && node.isConnected) {
            var cont = node.classList.contains("cont");
            var fresh = renderMessage(m, cont);
            node.replaceWith(fresh);
            fillPendingQuotes();
          }
          return;
        }
      }
    }
  }

  function removeMessage(id) {
    var key = String(id);
    for (var ci = 0; ci < state.chunks.length; ci++) {
      var msgs = state.chunks[ci].msgs;
      for (var mi = 0; mi < msgs.length; mi++) {
        if (msgs[mi] && String(msgs[mi].id) === key) {
          msgs.splice(mi, 1);
          state.msgById.delete(key);
          var node = state.nodeById.get(key);
          state.nodeById.delete(key);
          if (node && node.isConnected) node.remove();
          return;
        }
      }
    }
  }

  /* ------------------------- row construction ------------------------- */

  function rowFragment(m, prev) {
    var frag = document.createDocumentFragment();
    var stamp = fld(m, "created_at", "createdAt");
    var d = toDate(stamp);
    var day = d ? startOfDay(d) : null;
    var pd = prev ? toDate(fld(prev, "created_at", "createdAt")) : null;
    var pday = pd ? startOfDay(pd) : null;

    var newDay = day !== null && day !== pday;
    if (newDay) {
      var sep = el("div", "day");
      sep.appendChild(el("span", null, dayLabel(stamp)));
      frag.appendChild(sep);
    }

    if (m.system) {
      frag.appendChild(el("div", "sys", m.text || "System message"));
      return frag;
    }

    var cont = !newDay && !!prev && !prev.system &&
      prev.user_id != null && String(prev.user_id) === String(m.user_id) &&
      Math.abs(Number(stamp) - Number(fld(prev, "created_at", "createdAt"))) <= GROUP_WINDOW;

    frag.appendChild(renderMessage(m, cont));
    return frag;
  }

  function buildRows(msgs, prev) {
    var frag = document.createDocumentFragment();
    var last = prev || null;
    for (var i = 0; i < msgs.length; i++) {
      frag.appendChild(rowFragment(msgs[i], last));
      last = msgs[i];
    }
    return frag;
  }

  /* ========================= message rendering ========================== */

  function isDeleted(m) { return fld(m, "deleted_at", "deletedAt") != null; }
  function isEdited(m) { return fld(m, "updated_at", "updatedAt") != null; }

  function isMine(m) {
    if (!m) return false;
    if (m.__local) return true;
    if (state.selfId && m.user_id != null) return String(m.user_id) === state.selfId;
    // Falls back to the display name only while the id is still unknown. It is
    // the weaker test — nicknames differ per group — so anything destructive is
    // gated on the id, not on this.
    return !!(state.accountName && m.name && m.name === state.accountName);
  }

  function canActOn(m) {
    return !!(state.selfId && m && m.user_id != null && String(m.user_id) === state.selfId);
  }

  function renderMessage(m, cont) {
    var mine = isMine(m);
    var key = String(m.id);
    var wrap = el("div", "msg" + (cont ? " cont" : "") + (mine ? " mine" : ""));
    wrap.dataset.mid = key;

    if (cont || mine) {
      wrap.appendChild(el("div", "gutter"));
    } else {
      wrap.appendChild(makeAvatar(m.name, fld(m, "avatar_url", "avatarUrl"), m.user_id || m.name, "sm"));
    }

    var body = el("div", "msg-body");

    if (!cont) {
      var meta = el("div", "msg-meta");
      meta.appendChild(el("span", "msg-name", m.name || "Unknown"));
      meta.appendChild(el("span", "msg-time", clockTime(fld(m, "created_at", "createdAt"))));
      body.appendChild(meta);
    }

    var atts = Array.isArray(m.attachments) ? m.attachments : [];
    var reply = atts.filter(function (a) { return a && a.type === "reply"; })[0];
    if (reply) body.appendChild(renderQuote(reply));

    if (isDeleted(m)) {
      body.appendChild(el("div", "bubble tomb", "This message was deleted"));
    } else {
      var text = m.text;
      if (text != null && String(text).length) {
        var b = el("div", "bubble", String(text));
        if (m.__pending) b.classList.add("pending");
        if (isEdited(m)) b.appendChild(el("span", "edited", "(edited)"));
        body.appendChild(b);
      }
      var media = atts.filter(function (a) {
        return a && a.type !== "reply" && a.type !== "emoji" && a.type !== "mentions";
      });
      if (media.length) body.appendChild(renderAttachments(media));
      if ((text == null || !String(text).length) && !media.length) {
        var ph = el("div", "bubble tomb", "No content in the archive for this message");
        if (isEdited(m)) ph.appendChild(el("span", "edited", "(edited)"));
        body.appendChild(ph);
      }
    }

    var reacts = renderReactions(m);
    if (reacts) body.appendChild(reacts);

    wrap.appendChild(body);
    if (!m.__pending && !m.system) wrap.appendChild(rowActions(m));

    state.nodeById.set(key, wrap);
    return wrap;
  }

  function rowActions(m) {
    var box = el("div", "acts");
    box.appendChild(withIcon(btn("act", "Reply", function (e) {
      e.stopPropagation(); startReply(m);
    }), "reply"));
    var react = btn("act", "React", function (e) {
      e.stopPropagation(); openEmojiPicker(e.currentTarget, m);
    });
    react.appendChild(el("span", "emo", "☺"));
    box.appendChild(react);
    box.appendChild(withIcon(btn("act", "More", function (e) {
      e.stopPropagation(); openMessageMenu(e.currentTarget, m);
    }), "more"));
    return box;
  }

  function renderQuote(a) {
    var q = el("button", "quote");
    q.type = "button";
    var refId = fld(a, "reply_id", "replyId") || fld(a, "base_reply_id", "baseReplyId");
    var ref = refId == null ? null : (state.msgById.get(String(refId)) || null);
    q.appendChild(el("b", null, ref && ref.name ? ref.name : "Replying to an earlier message"));
    var t = ref && !isDeleted(ref) ? ref.text : null;
    q.appendChild(el("div", "quote-text",
      t ? String(t).replace(/\s+/g, " ") : "The quoted message isn't loaded yet"));
    if (refId != null) {
      q.title = "Go to the quoted message";
      q.addEventListener("click", function (e) {
        e.stopPropagation();
        goToMessage(String(refId));
      });
    }
    if (!ref && refId != null) state.pendingQuotes.push({ node: q, id: String(refId), att: a });
    return q;
  }

  // A quote can name a message that only arrives with a later page. Those nodes
  // are filled in by hand rather than by re-rendering the thread.
  function fillPendingQuotes() {
    if (!state.pendingQuotes.length) return;
    var still = [];
    state.pendingQuotes.forEach(function (p) {
      if (!p.node.isConnected) return;
      if (!state.msgById.has(p.id)) { still.push(p); return; }
      p.node.replaceWith(renderQuote(p.att));
    });
    state.pendingQuotes = still;
  }

  function renderAttachments(list) {
    var box = el("div", "atts");
    list.forEach(function (a) {
      var type = a.type || "";
      if (type === "image" || type === "video" || type === "linked_image") {
        var url = a.url || fld(a, "source_url", "sourceUrl") || fld(a, "preview_url", "previewUrl");
        var slot = el("div");
        slot.appendChild(missingAttachment(type === "video"
          ? "This video hasn't been downloaded yet"
          : "This image hasn't been downloaded yet"));
        box.appendChild(slot);
        if (!url) return;

        // A just-sent image is not in the media cache yet; the local copy the
        // user picked stands in until the next sync downloads it. Everything
        // else must come from the cache — a remote URL is blocked by the CSP.
        var preview = state.localPreview.get(String(url));
        if (preview) { showImage(slot, preview, "Image you sent"); return; }

        resolveMedia(url).then(function (path) {
          if (!path || !slot.isConnected) return;
          if (type === "video") {
            var v = document.createElement("video");
            v.className = "att-img";
            v.controls = true;
            v.preload = "metadata";
            v.src = localSrc(path);
            slot.textContent = "";
            slot.appendChild(v);
            return;
          }
          showImage(slot, localSrc(path), "Attached image");
        });
      } else if (type === "location") {
        var name = a.name ? String(a.name) : "Shared location";
        var coords = (a.lat != null && a.lng != null) ? " · " + a.lat + ", " + a.lng : "";
        box.appendChild(missingAttachment(name + coords, "pin"));
      } else if (type === "file") {
        box.appendChild(missingAttachment("File attachment", "file"));
      } else {
        box.appendChild(missingAttachment("Attachment (" + (type || "unknown") + ") can't be shown here", "file"));
      }
    });
    return box;
  }

  function showImage(slot, src, alt) {
    var img = el("img", "att-img");
    img.alt = alt;
    img.loading = "lazy";
    img.src = src;
    img.onload = function () { if (slot.isConnected) { slot.textContent = ""; slot.appendChild(img); } };
  }

  function missingAttachment(label, kind) {
    var n = el("div", "att-miss");
    n.appendChild(icon(kind === "pin" ? "pin" : kind === "file" ? "file" : "broken"));
    n.appendChild(el("span", null, label));
    return n;
  }

  /* ----------------------------- reactions ----------------------------- */

  // Both roster shapes are read. `favorited_by` is not a set — a live frame has
  // been seen carrying the same account twice — so reactors are deduplicated
  // before they are counted, exactly as the Rust side does.
  function reactionGroups(m) {
    var out = [];
    var claimed = Object.create(null);
    var list = Array.isArray(m.reactions) ? m.reactions : [];

    list.forEach(function (r) {
      if (!r) return;
      var users = Array.isArray(fld(r, "user_ids", "userIds")) ? fld(r, "user_ids", "userIds") : [];
      var seen = Object.create(null), ids = [];
      users.forEach(function (u) {
        var k = String(u);
        if (seen[k]) return;
        seen[k] = 1; claimed[k] = 1; ids.push(k);
      });
      var glyph = (r.type === "unicode" && r.code) ? String(r.code) : null;
      out.push({
        code: glyph,
        glyph: glyph || "◍",
        pack: !glyph,
        ids: ids,
        count: ids.length || 1
      });
    });

    var favs = Array.isArray(fld(m, "favorited_by", "favoritedBy")) ? fld(m, "favorited_by", "favoritedBy") : [];
    var extra = [], seenFav = Object.create(null);
    favs.forEach(function (u) {
      var k = String(u);
      if (seenFav[k] || claimed[k]) return;
      seenFav[k] = 1; extra.push(k);
    });
    if (extra.length) out.push({ code: null, glyph: "❤", pack: false, like: true, ids: extra, count: extra.length });

    return out.filter(function (g) { return g.count > 0; });
  }

  function renderReactions(m) {
    var groups = reactionGroups(m);
    if (!groups.length) return null;
    var box = el("div", "reacts");
    groups.forEach(function (g) {
      var own = !!(state.selfId && g.ids.indexOf(state.selfId) >= 0);
      var chip = el("button", "react" + (own ? " own" : ""));
      chip.type = "button";
      chip.appendChild(el("span", "glyph", g.glyph));
      chip.appendChild(el("span", null, String(g.count)));
      if (g.pack) {
        chip.title = "Reaction from GroupMe's emoji pack";
        chip.disabled = true;
      } else {
        chip.title = own ? "Remove your reaction" : "React with " + g.glyph;
        chip.addEventListener("click", function (e) {
          e.stopPropagation();
          if (own) doUnreact(m); else doReact(m, g.like ? null : g.code);
        });
      }
      box.appendChild(chip);
    });
    return box;
  }

  /* ============================== thread ================================ */

  var app = $("app"), emptyEl = $("empty"), threadEl = $("thread");
  var bannerEl = $("banner"), bannerText = $("bannerText"), bannerBtn = $("bannerBtn");

  function setTop(kind) {
    topState.textContent = "";
    if (kind === "spinner") {
      var s = el("div", "spinner");
      s.setAttribute("role", "status");
      s.setAttribute("aria-label", "Loading earlier messages");
      topState.appendChild(s);
    } else if (kind === "start") {
      topState.appendChild(el("div", "top-note", "Beginning of the archived history"));
    } else if (kind === "error") {
      topState.appendChild(el("div", "top-note", "Couldn't load earlier messages from the archive"));
    }
  }

  function showBanner(text, label, onClick) {
    if (!text) { bannerEl.classList.remove("show"); return; }
    bannerText.textContent = text;
    bannerBtn.textContent = label || "Dismiss";
    bannerBtn.onclick = onClick || function () { bannerEl.classList.remove("show"); };
    bannerEl.classList.add("show");
  }

  // `settle` re-pins after the next frame. Cached images and avatars resolve
  // asynchronously and grow the log after the first scroll, which otherwise
  // leaves the newest message just off the bottom of the viewport.
  function scrollToBottom(settle) {
    scroller.scrollTop = scroller.scrollHeight;
    state.atBottom = true;
    if (!settle) return;
    requestAnimationFrame(function () {
      if (state.atBottom) scroller.scrollTop = scroller.scrollHeight;
    });
  }

  function updateSub() {
    var c = state.byId[state.active];
    var bits = [];
    var typing = typingLabel(state.active);
    if (typing) {
      $("tSub").textContent = typing;
      $("tSub").classList.add("typing");
      return;
    }
    $("tSub").classList.remove("typing");
    var count = c ? Number(fld(c, "messages_count", "messagesCount") || 0) : 0;
    if (count) bits.push(count.toLocaleString() + (count === 1 ? " message" : " messages"));
    bits.push(c && c.kind === "dm" ? "Direct message" : "Group");
    if (state.anchored) bits.push("viewing an earlier part");
    $("tSub").textContent = bits.join(" · ");
  }

  async function openConversation(cid, anchorId) {
    var c = state.byId[cid];
    // Typing notices are published per-conversation, so they only arrive for a
    // thread the socket is subscribed to. Messages come over the account
    // channel regardless, so this is best-effort and never gates the open.
    if (HAS_IPC && cid !== state.active) {
      call("client_watch_conversation", { conversationId: cid, previousId: state.active || null });
    }
    state.active = cid;
    state.activeKind = (c && c.kind) || (String(cid).indexOf("+") >= 0 ? "dm" : "group");
    state.cursor = null;
    state.hasMore = true;
    state.loading = false;
    state.anchored = false;
    state.atBottom = true;
    cancelReply();
    cancelEdit();
    clearDrafts();
    var mySeq = ++state.seq;

    app.classList.add("thread-open");
    emptyEl.classList.add("hide");
    threadEl.classList.add("show");
    showBanner(null);

    $("tTitle").textContent = convoTitle(c) || "Conversation";
    updateSub();
    clearThreadDom();
    setTop("spinner");
    syncComposer();

    Array.prototype.forEach.call(listEl.querySelectorAll(".row"), function (r) {
      r.classList.toggle("active", r.dataset.cid === cid);
    });

    var page = await call("archive_messages", { conversationId: cid, limit: PAGE, beforeId: null });
    if (mySeq !== state.seq) return;
    page = Array.isArray(page) ? page : [];

    var wanted = anchorId == null ? null : String(anchorId);
    var inPage = wanted != null && page.some(function (m) { return String(m.id) === wanted; });

    if (wanted != null && !inPage) {
      // The target is older than the newest page. `messages_page` filters on
      // `id_sort < before`, so the anchor is the target plus one — computed
      // with BigInt, which is exact at 18 digits where a double is not.
      var anchor = idPlusOne(wanted);
      if (anchor) {
        var older = await call("archive_messages", { conversationId: cid, limit: PAGE, beforeId: anchor });
        if (mySeq !== state.seq) return;
        if (Array.isArray(older) && older.length) {
          page = older;
          state.anchored = true;
        }
      }
    }

    if (!page.length) {
      state.hasMore = false;
      setTop("");
      msgsEl.appendChild(el("div", "side-empty",
        "Nothing from this conversation has been archived yet. It will fill in as the sync reaches it."));
      updateSub();
      markRead(cid);
      return;
    }

    var oldestFirst = page.slice().reverse();
    appendChunk(oldestFirst);
    state.cursor = String(page[page.length - 1].id);
    if (page.length < PAGE) state.hasMore = false;
    setTop(state.hasMore ? "" : "start");

    if (state.anchored) {
      showBanner("Showing this conversation up to the message you searched for.",
        "Jump to latest", function () { openConversation(cid); });
      updateSub();
      // The anchor is the newest row of an anchored page, so the bottom is it.
      scrollToBottom();
      flashMessage(wanted);
    } else {
      if (wanted) { scrollToBottom(); flashMessage(wanted); }
      else scrollToBottom(true);
      markRead(cid);
    }
    updateSub();
  }

  async function loadOlder() {
    if (state.loading || !state.hasMore || !state.active || state.cursor == null) return;
    state.loading = true;
    setTop("spinner");
    var mySeq = state.seq;
    var cid = state.active;

    var page = await call("archive_messages", { conversationId: cid, limit: PAGE, beforeId: state.cursor });
    if (mySeq !== state.seq) return;

    // A rejected cursor comes back null, not empty. An empty page would read as
    // "start of history" and quietly truncate the thread; say so instead.
    if (page == null) {
      state.hasMore = false;
      state.loading = false;
      setTop("error");
      return;
    }
    page = Array.isArray(page) ? page : [];
    if (!page.length) {
      state.hasMore = false;
      state.loading = false;
      setTop("start");
      return;
    }
    prependChunk(page.slice().reverse());
    state.cursor = String(page[page.length - 1].id);
    if (page.length < PAGE) state.hasMore = false;
    state.loading = false;
    setTop(state.hasMore ? "" : "start");
  }

  // Scrolls to a message that is already loaded; otherwise reopens the
  // conversation anchored on it.
  function goToMessage(id, cid) {
    var key = String(id);
    var node = state.nodeById.get(key);
    if (node && node.isConnected) {
      node.scrollIntoView({ block: "center" });
      flashMessage(key);
      return;
    }
    if (state.msgById.has(key)) {
      // Loaded but its chunk is a spacer right now: bring the chunk back, then
      // scroll once the rows exist.
      for (var i = 0; i < state.chunks.length; i++) {
        var ch = state.chunks[i];
        if (ch.msgs.some(function (m) { return String(m.id) === key; })) {
          materialise(ch);
          var n = state.nodeById.get(key);
          if (n && n.isConnected) { n.scrollIntoView({ block: "center" }); flashMessage(key); }
          return;
        }
      }
    }
    openConversation(cid || state.active, key);
  }

  function flashMessage(id) {
    if (id == null) return;
    var node = state.nodeById.get(String(id));
    if (!node || !node.isConnected) return;
    node.classList.add("flash", "hit");
    node.scrollIntoView({ block: "center" });
    setTimeout(function () { node.classList.remove("flash"); }, 1800);
  }

  function markRead(cid) {
    var c = state.byId[cid];
    if (!c) return;
    var stamp = convoStamp(c);
    if (Number(state.readAt[cid] || 0) >= stamp) return;
    state.readAt[cid] = stamp;
    saveReadAt();
    var row = listEl.querySelector('.row[data-cid="' + cssEscape(cid) + '"]');
    if (row) row.classList.remove("unread");

    var newest = newestLoaded();
    if (!newest || newest.id == null || newest.__local) return;
    // Best effort. A failed read receipt is not something the user can act on,
    // so it is logged rather than shown; it is also not a lost message.
    write("client_mark_read", { conversationId: cid, lastReadMessageId: String(newest.id) })
      .catch(function (e) { console.warn("client_mark_read failed:", e && e.message); });
  }

  /* ------------------------------ typing ------------------------------- */

  function typingLabel(cid) {
    var m = state.typing.get(cid);
    if (!m || !m.size) return null;
    var now = Date.now();
    var names = [];
    m.forEach(function (v, k) {
      if (v.until <= now) { m.delete(k); return; }
      if (state.selfId && k === state.selfId) return;
      names.push(v.name || "Someone");
    });
    if (!names.length) return null;
    if (names.length === 1) return names[0] + " is typing…";
    if (names.length === 2) return names[0] + " and " + names[1] + " are typing…";
    return names.length + " people are typing…";
  }

  var typingTimer = setInterval(function () {
    if (state.active && state.typing.has(state.active)) updateSub();
  }, 2000);

  /* ============================= composer =============================== */

  var input = $("input"), sendBtn = $("sendBtn"), attachBtn = $("attachBtn");
  var cnote = $("cnote"), ccount = $("ccount"), fileEl = $("file");
  var ctxEl = $("ctx"), ctxTitle = $("ctxTitle"), ctxText = $("ctxText");
  var draftsEl = $("drafts");
  var localSeq = 0;

  function setError(msg) {
    cnote.textContent = msg || "";
    cnote.className = msg ? "grow cerr" : "grow";
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 136) + "px";
  }

  // `[...str].length` counts code points, matching the Rust side's `chars()`.
  // `.length` would count UTF-16 units and reject a body of emoji that is well
  // inside the limit.
  function charCount(s) { return Array.from(String(s)).length; }

  function syncComposer() {
    var n = charCount(input.value);
    var over = n > MAX_TEXT;
    ccount.textContent = (n > MAX_TEXT - 150) ? (n + " / " + MAX_TEXT) : "";
    ccount.classList.toggle("over", over);

    var uploading = state.drafts.some(function (d) { return d.uploading; });
    var hasBody = input.value.trim().length > 0 ||
      state.drafts.some(function (d) { return d.url; });
    sendBtn.disabled = state.sending || uploading || over || !hasBody || !state.active;
    attachBtn.disabled = state.sending || !state.active || !!state.editing;

    input.placeholder = state.editing ? "Edit your message" : "Message";
    if (!cnote.classList.contains("cerr")) {
      cnote.textContent = state.connected === false
        ? "You're offline — messages will fail to send until the connection is back."
        : "";
    }
  }

  function startReply(m) {
    cancelEdit();
    state.reply = {
      id: String(m.id),
      userId: m.user_id == null ? null : String(m.user_id),
      name: m.name || "Someone",
      text: m.text || (isDeleted(m) ? "Deleted message" : "Attachment")
    };
    ctxTitle.textContent = "Replying to " + state.reply.name;
    ctxText.textContent = String(state.reply.text).replace(/\s+/g, " ");
    ctxEl.classList.add("show");
    setError("");
    input.focus();
    syncComposer();
  }

  function cancelReply() {
    state.reply = null;
    if (!state.editing) ctxEl.classList.remove("show");
  }

  function startEdit(m) {
    cancelReply();
    state.editing = { id: String(m.id), original: m.text == null ? "" : String(m.text) };
    ctxTitle.textContent = "Editing your message";
    ctxText.textContent = state.editing.original.replace(/\s+/g, " ") || "(no text)";
    ctxEl.classList.add("show");
    input.value = state.editing.original;
    autoGrow();
    setError("");
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    syncComposer();
  }

  function cancelEdit() {
    if (state.editing) input.value = "";
    state.editing = null;
    ctxEl.classList.remove("show");
    autoGrow();
    syncComposer();
  }

  function clearDrafts() {
    state.drafts = [];
    draftsEl.textContent = "";
    syncComposer();
  }

  function renderDrafts() {
    draftsEl.textContent = "";
    state.drafts.forEach(function (d, i) {
      var box = el("div", "draft-att");
      var img = document.createElement("img");
      img.src = d.dataUrl;
      img.alt = "Image to send";
      box.appendChild(img);
      box.appendChild(withIcon(btn("ctx-x", "Remove", function () {
        state.drafts.splice(i, 1);
        renderDrafts();
      }), "x"));
      if (d.uploading) box.appendChild(el("div", "up", "Uploading…"));
      else if (d.error) box.appendChild(el("div", "up", "Failed"));
      draftsEl.appendChild(box);
    });
    syncComposer();
  }

  function readAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error("couldn't read the file")); };
      r.readAsDataURL(file);
    });
  }

  function readAsBytes(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(new Uint8Array(r.result)); };
      r.onerror = function () { reject(new Error("couldn't read the file")); };
      r.readAsArrayBuffer(file);
    });
  }

  async function attachFiles(files) {
    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      if (!file || !/^image\//i.test(file.type || "")) {
        setError("Only images can be attached.");
        continue;
      }
      var draft = { url: null, dataUrl: "", uploading: true, error: null };
      state.drafts.push(draft);
      try {
        draft.dataUrl = await readAsDataUrl(file);
        renderDrafts();
        var bytes = await readAsBytes(file);
        // `Vec<u8>` over the IPC bridge: a plain array of numbers is what serde
        // accepts on every Tauri version this app has shipped against.
        var url = await write("client_upload_image", {
          bytes: Array.prototype.slice.call(bytes),
          mime: file.type
        });
        draft.url = String(url);
        draft.uploading = false;
        // Sent images are not in the media cache until the next sync fetches
        // them; the local copy stands in so the bubble is not a placeholder.
        state.localPreview.set(draft.url, draft.dataUrl);
        setError("");
      } catch (e) {
        draft.uploading = false;
        draft.error = true;
        setError(e && e.message ? e.message : "The image couldn't be uploaded.");
      }
      renderDrafts();
    }
  }

  async function doSend() {
    if (state.sending || !state.active) return;
    if (state.editing) return doEditSubmit();

    var text = input.value;
    var atts = state.drafts.filter(function (d) { return d.url; })
      .map(function (d) { return { type: "image", url: d.url }; });
    if (!text.trim() && !atts.length) return;
    if (charCount(text) > MAX_TEXT) {
      setError("That's " + charCount(text) + " characters and GroupMe accepts about " + MAX_TEXT + ".");
      return;
    }

    var cid = state.active;
    var reply = state.reply;
    var keptText = text, keptDrafts = state.drafts.slice();

    // Optimistic row. Its id is deliberately not id-shaped: nothing compares it
    // against a real GroupMe id, and it is replaced by the server's copy — the
    // `source_guid` echo is what makes that match reliable on the Rust side.
    var localId = "local:" + (++localSeq);
    var optimistic = {
      id: localId,
      __local: true,
      __pending: true,
      user_id: state.selfId,
      name: state.accountName || "You",
      text: text,
      created_at: nowSecs(),
      system: false,
      attachments: atts.slice(),
      reactions: [],
      favorited_by: []
    };
    if (reply) {
      optimistic.attachments.push({ type: "reply", reply_id: reply.id, base_reply_id: reply.id,
        user_id: reply.userId || undefined });
    }

    state.sending = true;
    input.value = "";
    autoGrow();
    clearDrafts();
    cancelReply();
    setError("");
    syncComposer();
    appendLive(optimistic);
    scrollToBottom();

    var args = {
      conversationId: cid,
      kind: state.activeKind,
      text: text,
      attachments: atts.length ? atts : null,
      replyTo: reply ? reply.id : null,
      replyToUserId: reply ? reply.userId : null
    };

    try {
      var sent = await write("client_send_message", args);
      state.sending = false;
      if (sent && sent.user_id != null) rememberSelf(String(sent.user_id));
      if (state.active === cid && sent) {
        replaceMessage(sent, localId);
        touchConversation(cid, sent.text || (atts.length ? "sent a photo" : ""), Number(sent.created_at) || nowSecs());
        state.readAt[cid] = convoStamp(state.byId[cid] || {});
        saveReadAt();
      }
      syncComposer();
    } catch (e) {
      state.sending = false;
      // Nothing is lost and nothing is silently dropped: the optimistic row
      // goes away, the text and attachments come back, and the reason is
      // printed under the box where the retry lives.
      if (state.active === cid) removeMessage(localId);
      input.value = keptText;
      state.drafts = keptDrafts;
      renderDrafts();
      autoGrow();
      if (reply) startReply({ id: reply.id, user_id: reply.userId, name: reply.name, text: reply.text });
      setError((e && e.message ? e.message : "The message couldn't be sent") + " — press send to try again.");
      syncComposer();
    }
  }

  async function doEditSubmit() {
    var editing = state.editing;
    if (!editing) return;
    var text = input.value;
    if (!text.trim()) { setError("An edited message can't be empty. Delete it instead."); return; }
    if (charCount(text) > MAX_TEXT) {
      setError("That's " + charCount(text) + " characters and GroupMe accepts about " + MAX_TEXT + ".");
      return;
    }
    if (state.activeKind !== "group") {
      setError("GroupMe doesn't support editing direct messages.");
      return;
    }
    state.sending = true;
    syncComposer();
    try {
      var updated = await write("client_edit_message", {
        groupId: state.active, messageId: editing.id, text: text
      });
      state.sending = false;
      cancelEdit();
      if (updated) replaceMessage(updated);
      setError("");
      toast("Message edited");
    } catch (e) {
      state.sending = false;
      setError(e && e.message ? e.message : "The edit couldn't be saved.");
      syncComposer();
    }
  }

  async function doDelete(m) {
    var cid = state.active;
    try {
      await write("client_delete_message", { conversationId: cid, messageId: String(m.id) });
      m.deleted_at = nowSecs();
      replaceMessage(m);
      toast("Message deleted");
    } catch (e) {
      toast(e && e.message ? e.message : "The message couldn't be deleted.", true);
    }
  }

  async function doReact(m, code) {
    try {
      var reactions = await write("client_react", {
        conversationId: state.active, messageId: String(m.id), code: code == null ? null : String(code)
      });
      if (Array.isArray(reactions)) m.reactions = reactions;
      else if (code == null && state.selfId) {
        var favs = Array.isArray(m.favorited_by) ? m.favorited_by.slice() : [];
        if (favs.indexOf(state.selfId) < 0) favs.push(state.selfId);
        m.favorited_by = favs;
      }
      replaceMessage(m);
    } catch (e) {
      toast(e && e.message ? e.message : "The reaction couldn't be added.", true);
    }
  }

  async function doUnreact(m) {
    try {
      var reactions = await write("client_unreact", {
        conversationId: state.active, messageId: String(m.id)
      });
      if (Array.isArray(reactions)) m.reactions = reactions;
      if (state.selfId && Array.isArray(m.favorited_by)) {
        m.favorited_by = m.favorited_by.filter(function (u) { return String(u) !== state.selfId; });
      }
      replaceMessage(m);
    } catch (e) {
      toast(e && e.message ? e.message : "The reaction couldn't be removed.", true);
    }
  }

  /* ============================= popovers =============================== */

  var scrim = $("scrim"), emojiPop = $("emojiPop"), menuPop = $("menuPop");

  function closePops() {
    emojiPop.classList.remove("show");
    menuPop.classList.remove("show");
    scrim.classList.remove("show");
  }

  function placePop(pop, anchor) {
    pop.classList.add("show");
    scrim.classList.add("show");
    var a = anchor.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(8, a.left), window.innerWidth - w - 8);
    var top = a.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, a.top - h - 6);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function openEmojiPicker(anchor, m) {
    emojiPop.textContent = "";
    REACTIONS.forEach(function (code) {
      var b = el("button", null, code);
      b.type = "button";
      b.setAttribute("aria-label", "React with " + code);
      b.addEventListener("click", function () { closePops(); doReact(m, code); });
      emojiPop.appendChild(b);
    });
    var like = el("button", null, "👌");
    like.type = "button";
    like.title = "Plain like";
    like.setAttribute("aria-label", "Like");
    like.addEventListener("click", function () { closePops(); doReact(m, null); });
    emojiPop.appendChild(like);
    placePop(emojiPop, anchor);
  }

  function menuItem(label, iconName, onClick, danger) {
    var b = el("button", danger ? "danger" : null);
    b.type = "button";
    b.appendChild(icon(iconName));
    b.appendChild(el("span", null, label));
    b.addEventListener("click", function () { closePops(); onClick(); });
    return b;
  }

  function openMessageMenu(anchor, m) {
    menuPop.textContent = "";
    menuPop.appendChild(menuItem("Reply", "reply", function () { startReply(m); }));
    if (m.text) menuPop.appendChild(menuItem("Copy text", "copy", function () { copyText(String(m.text)); }));

    var own = canActOn(m) && !isDeleted(m) && !m.__local;
    if (own && state.activeKind === "group") {
      menuPop.appendChild(menuItem("Edit", "edit", function () { startEdit(m); }));
    }
    if (own) {
      menuPop.appendChild(document.createElement("hr"));
      menuPop.appendChild(menuItem("Delete", "trash", function () { confirmDelete(m); }, true));
    }
    placePop(menuPop, anchor);
  }

  // Two-step rather than a modal: the second click is the confirmation, and it
  // cannot be reached by the same reflex that opened the menu.
  function confirmDelete(m) {
    showBanner("Delete this message for everyone? This can't be undone.", "Delete", function () {
      showBanner(null);
      doDelete(m);
    });
  }

  function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast("Copied"); },
          function () { toast("Couldn't copy", true); });
        return;
      }
    } catch (e) { /* fall through */ }
    toast("Copying isn't available here", true);
  }

  /* ============================== search ================================
     The reason this client exists. FTS5 over every archived message, with the
     match highlighted and a jump straight into the conversation at that
     point — which the web app cannot do at all.                            */

  var qEl = $("q"), searchWrap = $("searchWrap");
  var searchTimer = null, searchSeq = 0;

  function searchActive() { return qEl.value.trim().length > 0; }

  function snippet(text, q) {
    var t = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
    if (!q) return t.slice(0, 200);
    var i = t.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return t.slice(0, 200);
    var start = Math.max(0, i - 50);
    var end = Math.min(t.length, start + 200);
    return (start > 0 ? "…" : "") + t.slice(start, end) + (end < t.length ? "…" : "");
  }

  // Highlighting builds text nodes and <mark> elements. The matched text is
  // still untrusted, so it is set with textContent like everything else.
  function highlightInto(node, text, q) {
    var t = String(text == null ? "" : text);
    var needle = String(q || "").toLowerCase();
    if (!needle) { node.appendChild(document.createTextNode(t)); return node; }
    var lower = t.toLowerCase(), pos = 0;
    for (;;) {
      var i = lower.indexOf(needle, pos);
      if (i < 0) break;
      if (i > pos) node.appendChild(document.createTextNode(t.slice(pos, i)));
      var mk = document.createElement("mark");
      mk.textContent = t.slice(i, i + needle.length);
      node.appendChild(mk);
      pos = i + needle.length;
    }
    node.appendChild(document.createTextNode(t.slice(pos)));
    return node;
  }

  function onSearchInput() {
    clearTimeout(searchTimer);
    var q = qEl.value.trim();
    if (!q) { searchWrap.classList.remove("busy"); renderConversations(); return; }
    searchWrap.classList.add("busy");
    searchTimer = setTimeout(function () { runSearch(q); }, 220);
  }

  async function runSearch(q) {
    var mine = ++searchSeq;
    var hits = await call("archive_search", { query: q, limit: 100 });
    if (mine !== searchSeq || qEl.value.trim() !== q) return;
    renderSearchResults(Array.isArray(hits) ? hits : [], q);
  }

  function renderSearchResults(hits, query) {
    listEl.textContent = "";
    var label = el("div", "list-label",
      hits.length ? (hits.length === 100 ? "First 100 results" : hits.length + (hits.length === 1 ? " result" : " results")) : "No results");
    listEl.appendChild(label);

    if (!hits.length) {
      listEl.appendChild(el("div", "side-empty", "Nothing in the archive matches that."));
      return;
    }

    var frag = document.createDocumentFragment();
    hits.forEach(function (h) {
      var cid = fld(h, "conversation_id", "conversationId");
      var mid = fld(h, "message_id", "messageId");
      var cname = fld(h, "conversation_name", "conversationName") ||
        (cid != null && state.byId[cid] && state.byId[cid].name) || "Conversation";
      var sender = fld(h, "sender_name", "senderName") || "Someone";
      var when = fld(h, "created_at", "createdAt");

      var row = el("button", "row");
      row.type = "button";
      row.setAttribute("role", "listitem");
      row.appendChild(makeAvatar(sender, null, sender, "sm"));

      var body = el("div", "row-body");
      var top = el("div", "row-top");
      top.appendChild(el("div", "row-name", cname));
      top.appendChild(el("div", "row-time", relTime(when)));
      body.appendChild(top);
      body.appendChild(el("div", "row-prev", sender));
      body.appendChild(highlightInto(el("div", "hit-text"), snippet(h.text, query), query));
      row.appendChild(body);

      row.addEventListener("click", function () {
        if (cid == null) return;
        // Ids stay strings the whole way through: query -> hit -> cursor.
        if (String(cid) === String(state.active) && mid != null) goToMessage(String(mid), String(cid));
        else openConversation(String(cid), mid == null ? null : String(mid));
      });
      frag.appendChild(row);
    });
    listEl.appendChild(frag);
  }

  function clearSearch() {
    qEl.value = "";
    clearTimeout(searchTimer);
    searchSeq++;
    searchWrap.classList.remove("busy");
    renderConversations();
  }

  /* ============================== realtime =============================== */

  function setConn(connected, label) {
    state.connected = connected;
    var pill = $("conn");
    pill.classList.toggle("live", connected === true);
    pill.classList.toggle("down", connected === false);
    $("connText").textContent = label || (connected ? "Live" : "Offline");
    pill.title = connected
      ? "Connected — new messages arrive as they are sent"
      : "Not connected — you can read everything, but sending will fail";
    syncComposer();
  }

  function onRealtimeMessage(evt) {
    var a = adaptMessage(evt);
    if (!a) return;
    var stamp = Number(fld(a.msg, "created_at", "createdAt")) || nowSecs();
    var preview = a.msg.text || (Array.isArray(a.msg.attachments) && a.msg.attachments.length ? "sent an attachment" : "");

    if (a.cid === state.active && !state.anchored) {
      var wasAtBottom = state.atBottom;
      appendLive(a.msg);
      touchConversation(a.cid, preview, stamp);
      if (wasAtBottom) { scrollToBottom(); markRead(a.cid); }
      else showBanner("New messages below.", "Jump to latest", function () {
        showBanner(null); scrollToBottom(); markRead(a.cid);
      });
      return;
    }
    touchConversation(a.cid, preview, stamp);
  }

  function onRealtimeReaction(evt) {
    var a = adaptReaction(evt);
    if (!a) return;
    if (a.cid !== state.active) return;
    var m = state.msgById.get(a.mid);
    if (!m) return;
    m.reactions = a.reactions;
    replaceMessage(m);
  }

  function onRealtimeTyping(evt) {
    var a = adaptTyping(evt);
    if (!a) return;
    var m = state.typing.get(a.cid);
    if (!m) { m = new Map(); state.typing.set(a.cid, m); }
    m.set(a.uid, { name: a.name, until: a.until });
    if (a.cid === state.active) updateSub();
  }

  function onRealtimeState(evt) {
    var a = adaptState(evt);
    if (!a) return;
    setConn(a.connected, a.label);
  }

  async function subscribe() {
    if (!HAS_EVENTS) return;
    var pairs = [
      ["realtime://message", onRealtimeMessage],
      ["realtime://reaction", onRealtimeReaction],
      ["realtime://typing", onRealtimeTyping],
      ["realtime://state", onRealtimeState],
      // Emitted by the existing sync loop; the conversation list and the
      // footer counters are stale until it fires.
      ["archive://synced", onSynced]
    ];
    for (var i = 0; i < pairs.length; i++) {
      try {
        await TAURI.event.listen(pairs[i][0], pairs[i][1]);
      } catch (e) {
        console.warn("could not subscribe to " + pairs[i][0], e);
      }
    }
  }

  var syncedTimer = null;
  function onSynced() {
    // A burst of sync events must not turn into a burst of full list rebuilds.
    clearTimeout(syncedTimer);
    syncedTimer = setTimeout(async function () {
      await loadStats();
      var n = await loadConversations();
      if (n && !state.active) showIdleEmpty();
    }, 400);
  }

  /* ============================ empty states ============================ */

  function showIdleEmpty() {
    $("emptySpin").textContent = "";
    $("emptyTitle").textContent = "Pick a conversation";
    $("emptyText").textContent =
      "Everything is read from the copy of your history kept on this computer, so it opens instantly and every message is searchable.";
    $("emptyFine").textContent = "Press / to search, Esc to clear.";
  }

  function showSyncingEmpty(hasAccount) {
    $("emptyTitle").textContent = hasAccount ? "Downloading your history" : "Waiting for sign-in";
    $("emptyText").textContent = hasAccount
      ? "The first sync is still running. Conversations appear here as they arrive, newest first."
      : "Open GroupMe once so the app can pick up the session, and your conversations will start downloading.";
    $("emptyFine").textContent = "This window stays usable while it runs.";
    $("emptySpin").textContent = "";
    $("emptySpin").appendChild(el("div", "spinner"));
  }

  /* ============================== wiring ================================ */

  $("brandMark").appendChild(icon("logo"));
  $("emptyMark").appendChild(icon("logo"));
  $("back").appendChild(icon("back"));
  $("toLatest").appendChild(icon("jump"));
  $("ctxX").appendChild(icon("x"));
  attachBtn.appendChild(icon("image"));
  sendBtn.appendChild(icon("send"));
  searchWrap.insertBefore(icon("search"), searchWrap.firstChild);

  qEl.addEventListener("input", onSearchInput);

  scroller.addEventListener("scroll", function () {
    if (scroller.scrollTop < 400) loadOlder();
    state.atBottom = (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight) < 80;
    if (state.atBottom && bannerEl.classList.contains("show") && !state.anchored) showBanner(null);
  }, { passive: true });

  $("back").addEventListener("click", function () { app.classList.remove("thread-open"); });

  $("toLatest").addEventListener("click", function () {
    if (state.anchored && state.active) openConversation(state.active);
    else { scrollToBottom(); if (state.active) markRead(state.active); }
  });

  $("ctxX").addEventListener("click", function () {
    if (state.editing) cancelEdit(); else { cancelReply(); syncComposer(); }
  });

  sendBtn.addEventListener("click", doSend);
  attachBtn.addEventListener("click", function () { fileEl.click(); });
  fileEl.addEventListener("change", function () {
    var files = fileEl.files;
    if (files && files.length) attachFiles(files);
    fileEl.value = "";
  });

  /* Throttled: GroupMe's own client republishes while you keep typing rather
     than sending one notice per keystroke, and the notice carries its own
     expiry, so a fixed floor between publishes is enough. */
  var TYPING_EVERY_MS = 3000;
  var lastTypingAt = 0;
  function noteTyping() {
    if (!HAS_IPC || !state.active) return;
    var now = Date.now();
    if (now - lastTypingAt < TYPING_EVERY_MS) return;
    lastTypingAt = now;
    call("client_typing", { conversationId: state.active });
  }

  input.addEventListener("input", function () {
    autoGrow();
    if (cnote.classList.contains("cerr")) setError("");
    syncComposer();
    // Editing an existing message is not composing a new one.
    if (input.value.trim() && !state.editing) noteTyping();
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.altKey) { e.preventDefault(); doSend(); return; }
    if (e.key === "Escape") {
      if (state.editing) { cancelEdit(); e.stopPropagation(); }
      else if (state.reply) { cancelReply(); syncComposer(); e.stopPropagation(); }
    }
  });

  // Dropping an image on the thread attaches it rather than navigating the
  // webview to a file:// URL, which is what the default handler would do.
  ["dragenter", "dragover"].forEach(function (evt) {
    threadEl.addEventListener(evt, function (e) { e.preventDefault(); });
  });
  threadEl.addEventListener("drop", function (e) {
    e.preventDefault();
    if (!state.active) return;
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) attachFiles(files);
  });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) { e.preventDefault(); });

  scrim.addEventListener("click", closePops);
  window.addEventListener("resize", closePops);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (emojiPop.classList.contains("show") || menuPop.classList.contains("show")) { closePops(); return; }
      if (bannerEl.classList.contains("show")) { showBanner(null); return; }
      if (qEl.value) { clearSearch(); qEl.blur(); }
      return;
    }
    var typingInField = document.activeElement === qEl || document.activeElement === input;
    if (e.key === "/" && !typingInField) { e.preventDefault(); qEl.focus(); qEl.select(); }
    if ((e.key === "f" || e.key === "F") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); qEl.focus(); qEl.select(); }
  });

  // Fallback only. `realtime://state` is authoritative when it arrives; these
  // two events at least keep the pill honest if it never does.
  window.addEventListener("online", function () { if (state.connected === null) setConn(true, "Live"); });
  window.addEventListener("offline", function () { setConn(false, "Offline"); });

  /* =============================== boot ================================= */

  /* The other half of the surface toggle. The injected button on
     web.groupme.com brings the user here; this one takes them back. Both
     record the choice, so the router reopens whichever surface was used
     last. Preference first, then navigate — best-effort, since losing the
     preference only costs one extra click next launch. */
  document.getElementById("uiswap").addEventListener("click", async function () {
    await call("client_set_ui_preference", { ui: "web" });
    location.replace("https://web.groupme.com");
  });

  (async function boot() {
    loadReadAt();
    autoGrow();
    setConn(HAS_IPC ? (navigator.onLine ? null : false) : null, HAS_IPC ? "Connecting" : "Preview");
    if (!HAS_IPC) state.connected = null;

    // Arriving here IS the preference — however the user got here, the last
    // surface used is the one the router should reopen next launch.
    if (HAS_IPC) {
      call("client_set_ui_preference", { ui: "client" });
    }

    var stats = await loadStats();
    var count = await loadConversations();

    if (!count) showSyncingEmpty(!!(stats && fld(stats, "account_name", "accountName")));
    else showIdleEmpty();

    await subscribe();
    syncComposer();
  })();

})();
</script>
