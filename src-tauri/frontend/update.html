<!--
  Update dialog.

  A small frameless window (380x240) opened by `updater::open_dialog`. It narrates
  the check running in Rust — `src/updater.rs` emits every phase to this window
  and nowhere else — and owns the only two buttons that can start a download or
  an install.

  On load it asks for the last cached phase before subscribing, because the window
  is usually created in the same breath as the check: a check that resolves first
  would land on nobody and leave this panel spinning forever.

  Deliberately self-contained: no CDN, no downloaded fonts, no build step, matching
  index.html — every face named here ships with Windows. Every dynamic value is
  written with textContent — release notes and error strings come off a remote
  manifest and are untrusted input.
-->
<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost" />
<title>GroupMe — Updates</title>
<style>
  :root {
    color-scheme: light dark;

    --font-display: "Sitka Heading", Constantia, Georgia, serif;
    --font-ui:      Corbel, Candara, "Segoe UI", sans-serif;
    --font-label:   "Bahnschrift SemiLight", Bahnschrift, Corbel, sans-serif;
    --font-mono:    "Cascadia Mono", Consolas, monospace;

    --bg: #f6f3ec; --surface: #fffdf8; --raised: #ece7db;
    --rule: #dcd5c6; --fg: #16130d; --fg-soft: #5d5647;
    --accent: #a8341f; --accent-soft: #f2e3dc;
    --ok: #1f5c56; --warn: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100e0c; --surface: #191611; --raised: #221e18;
      --rule: #302a22; --fg: #f1ece1; --fg-soft: #9d9483;
      --accent: #e2603f; --accent-soft: #33211b;
      --ok: #4fb3a4; --warn: #d4a24c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 var(--font-ui);
    /* The window is frameless, so the 1px border is the only thing separating
       the dialog from whatever is behind it. */
    border: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: .625rem;
    padding: .625rem .875rem;
    border-bottom: 1px solid var(--rule);
  }
  .mark {
    width: 26px; height: 26px; flex: none;
    border: 1px solid var(--rule); border-radius: 2px;
    background: var(--surface);
    display: grid; place-items: center;
  }
  .mark svg { width: 14px; height: 14px; display: block; }
  .mark path { stroke: var(--fg-soft); }
  .mark .a   { stroke: var(--accent); }
  .name {
    font-family: var(--font-display);
    font-size: .9375rem; font-weight: 400; line-height: 1.25;
  }
  .ver {
    font-family: var(--font-label);
    font-size: .5625rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--fg-soft); line-height: 1.5;
  }
  #cur {
    font-family: var(--font-mono); font-size: .6875rem;
    letter-spacing: .02em; text-transform: none;
  }
  .close {
    margin-left: auto; width: 24px; height: 24px; flex: none;
    display: grid; place-items: center;
    border: 1px solid transparent; border-radius: 2px; background: transparent;
    color: var(--fg-soft); cursor: pointer;
    transition: border-color .14s ease, color .14s ease;
  }
  .close svg { display: block; }
  .close:hover { border-color: var(--rule); color: var(--fg); }
  .close:active { background: var(--raised); }
  .close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  main {
    flex: 1; min-height: 0;
    padding: .875rem;
    display: flex; flex-direction: column; justify-content: center; gap: .625rem;
  }
  /* The one line of prose in the app that has to carry a verdict — set in the
     display face, with the version it names in mono. */
  .status {
    display: flex; align-items: flex-start; gap: .5rem;
    font-family: var(--font-display); font-size: 1rem; line-height: 1.35;
  }
  .status b {
    font-family: var(--font-mono); font-weight: 400;
    font-size: .875em; letter-spacing: .01em;
  }
  /* A typesetter's caret, not a spinner: work in progress, no rotation. */
  .spin {
    width: 2px; height: 15px; flex: none; margin-top: .2rem; display: none;
    background: var(--accent);
    animation: caret 1.15s ease-in-out infinite;
  }
  @keyframes caret { 0%, 100% { opacity: .22; } 50% { opacity: 1; } }
  .dot { width: 6px; height: 6px; flex: none; margin-top: .5rem; display: none; }

  .bar {
    display: none; height: 2px;
    background: var(--rule); overflow: hidden;
  }
  .bar i {
    display: block; width: 0; height: 100%;
    background: var(--accent); transition: width .25s ease;
  }
  /* `flex: 0 1 auto` with `min-height: 0` is what keeps a long release note from
     pushing the buttons off a window that cannot be resized: the notes shrink and
     scroll internally instead of overflowing the panel. */
  .notes {
    display: none; flex: 0 1 auto; min-height: 0;
    padding-left: .625rem; border-left: 2px solid var(--rule);
    font-size: .75rem; line-height: 1.5; color: var(--fg-soft);
    white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
  }
  /* A failure message is machine text; set it as such rather than dressing it
     up in red. */
  body.error .notes {
    border-left-color: var(--warn);
    font-family: var(--font-mono); font-size: .6875rem;
  }

  footer {
    flex: none; display: flex; gap: .5rem; justify-content: flex-end;
    padding: .625rem .875rem; border-top: 1px solid var(--rule);
  }
  button {
    font-family: var(--font-ui); font-size: .8125rem;
    padding: .4375rem .9375rem;
    border-radius: 2px; border: 1px solid var(--rule);
    background: var(--surface); color: var(--fg); cursor: pointer;
    transition: border-color .14s ease, background-color .14s ease;
  }
  button:hover { border-color: var(--fg-soft); }
  button.primary {
    background: var(--accent); border-color: var(--accent);
    color: var(--surface);
  }
  button.primary:hover { filter: brightness(1.07); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* One orchestrated reveal, head to footer. */
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
  header, main, footer { animation: rise .4s cubic-bezier(.2, .7, .3, 1) both; }
  header { animation-delay: .02s; }
  main   { animation-delay: .09s; }
  footer { animation-delay: .15s; }

  /* One class on <body> drives the whole panel. */
  body.checking .spin,
  body.downloading .spin { display: block; }
  body.uptodate .dot,
  body.ready .dot { display: block; background: var(--ok); }
  body.available .dot { display: block; background: var(--accent); }
  body.error .dot { display: block; background: var(--warn); }
  body.downloading .bar { display: block; }
  body.available .notes,
  body.downloading .notes,
  body.ready .notes,
  body.error .notes { display: block; }

  #download, #restart, #retry { display: none; }
  body.available #download,
  body.ready #restart,
  body.error #retry { display: inline-block; }

  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; opacity: 1; }
    .bar i { transition: none; }
    header, main, footer { animation: none; }
    button, .close { transition: none; }
  }
</style>

<header data-tauri-drag-region>
  <div class="mark" data-tauri-drag-region aria-hidden="true">
    <svg viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke-linecap="square">
      <path d="M2.5 3.25v13.5"/>
      <path d="M6 6h11"/>
      <path d="M6 10h11"/>
      <path class="a" d="M6 14h6"/>
    </svg>
  </div>
  <div data-tauri-drag-region>
    <div class="name" data-tauri-drag-region>GroupMe</div>
    <div class="ver" data-tauri-drag-region>Version <span id="cur">…</span></div>
  </div>
  <button class="close" id="close" title="Close" aria-label="Close">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none"
         stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <line x1="1" y1="1" x2="9" y2="9"/>
      <line x1="9" y1="1" x2="1" y2="9"/>
    </svg>
  </button>
</header>

<main>
  <div class="status" role="status" aria-live="polite">
    <span class="spin"></span><span class="dot"></span><span id="msg">Checking for updates…</span>
  </div>
  <div class="bar"><i id="pct"></i></div>
  <div class="notes" id="notes"></div>
</main>

<footer>
  <button id="close2">Close</button>
  <button class="primary" id="retry">Try again</button>
  <button class="primary" id="download">Download</button>
  <button class="primary" id="restart">Restart &amp; install</button>
</footer>

<script>
  var T = window.__TAURI__ || {};
  var invoke = (T.core && T.core.invoke)
    ? T.core.invoke
    : function () { return Promise.reject(new Error("IPC unavailable")); };
  var listen = (T.event && T.event.listen) ? T.event.listen : function () {};

  var $ = function (id) { return document.getElementById(id); };

  function state(name) { document.body.className = name; }

  // Builds the status line out of text nodes only. `lead`/`tail` are literals
  // from this file; `strong` is the dynamic part (a version, a server message)
  // and is set with textContent so a manifest can never contribute markup.
  function say(lead, strong, tail) {
    var m = $("msg");
    m.textContent = "";
    if (lead) m.appendChild(document.createTextNode(lead));
    if (strong != null && strong !== "") {
      var b = document.createElement("b");
      b.textContent = String(strong);
      m.appendChild(b);
    }
    if (tail) m.appendChild(document.createTextNode(tail));
  }

  function notes(text) { $("notes").textContent = text ? String(text) : ""; }

  function render(event, p) {
    p = p || {};
    if (p.currentVersion) $("cur").textContent = String(p.currentVersion);

    if (event === "updater://checking") {
      state("checking");
      say("Checking for updates…");
      notes("");
      $("pct").style.width = "0";
    } else if (event === "updater://up-to-date") {
      state("uptodate");
      say("You're up to date. Version ", p.currentVersion, " is the latest.");
      notes("");
    } else if (event === "updater://update-available") {
      state("available");
      say("Version ", p.version, " is available.");
      notes(p.notes);
    } else if (event === "updater://downloading") {
      state("downloading");
      say("Downloading version ", p.version, "…");
      notes(p.notes);
    } else if (event === "updater://ready") {
      state("ready");
      say("Version ", p.version, " is ready. It installs when you quit GroupMe.");
      notes(p.notes);
    } else if (event === "updater://error") {
      state("error");
      say("Couldn't check for updates.");
      notes(p.message);
    }
  }

  state("checking");

  invoke("updater_version")
    .then(function (v) { $("cur").textContent = String(v); })
    .catch(function () { $("cur").textContent = "?"; });

  // Live events always win over the startup snapshot below, whichever order the
  // two arrive in.
  var live = false;
  [
    "updater://checking",
    "updater://up-to-date",
    "updater://update-available",
    "updater://downloading",
    "updater://ready",
    "updater://error"
  ].forEach(function (name) {
    listen(name, function (e) { live = true; render(name, e.payload); });
  });

  listen("updater://download-progress", function (e) {
    var p = (e && e.payload) || {};
    if (p.percent == null) return;
    var pct = Math.max(0, Math.min(100, Number(p.percent) || 0));
    $("pct").style.width = pct + "%";
  });

  invoke("updater_last_status").then(function (s) {
    if (live) return;
    if (s && s.event) { render(s.event, s.payload); return; }
    // Opened before anything has ever run. Start a check rather than sitting on
    // a spinner nothing will resolve; a check already in flight just re-announces.
    invoke("updater_check").catch(function () {});
  }).catch(function () {});

  function hide() {
    if (T.window && T.window.getCurrentWindow) T.window.getCurrentWindow().hide();
  }

  $("close").onclick = hide;
  $("close2").onclick = hide;
  $("retry").onclick = function () { invoke("updater_check").catch(function () {}); };
  $("download").onclick = function () { invoke("updater_download").catch(function () {}); };
  $("restart").onclick = function () { invoke("updater_restart").catch(function () {}); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hide(); });
</script>
