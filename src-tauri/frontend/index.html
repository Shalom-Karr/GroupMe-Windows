<!--
  Connectivity router.

  The first thing the window loads. It decides whether the session goes to the
  live client or the local archive, so the user never meets WebView2's raw
  "can't reach this page" error — which is the moment a wrapped web app stops
  feeling like an app.

  Deliberately self-contained: no CDN, no fonts, no build step. Anything fetched
  from the network here would fail in exactly the case this page exists to
  handle.
-->
<meta charset="utf-8" />
<title>GroupMe</title>
<style>
  :root {
    --accent: #3c16d3;
    --bg: #ffffff;
    --fg: #16161d;
    --muted: #6b6b7b;
    --card: #f5f5f8;
    --border: #e3e3ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e14;
      --fg: #f2f2f6;
      --muted: #9a9aab;
      --card: #191922;
      --border: #2a2a36;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap { text-align: center; max-width: 22rem; padding: 2rem; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 1.25rem;
    border-radius: 20px; background: var(--accent);
    display: grid; place-items: center;
  }
  .mark svg { width: 40px; height: 40px; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 .35rem; letter-spacing: -.01em; }
  p { margin: 0; color: var(--muted); font-size: .9rem; }
  .bar {
    width: 160px; height: 3px; margin: 1.5rem auto 0;
    background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .bar i {
    display: block; width: 40%; height: 100%; border-radius: 2px;
    background: var(--accent); animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }
  .actions { margin-top: 1.5rem; display: none; gap: .5rem; justify-content: center; }
  .actions.show { display: flex; }
  button {
    font: inherit; font-size: .875rem; padding: .5rem 1rem;
    border-radius: 9px; border: 1px solid var(--border);
    background: var(--card); color: var(--fg); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(1.08); }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; } }
</style>

<div class="wrap">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.9-.9L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
    </svg>
  </div>
  <h1 id="title">Connecting…</h1>
  <p id="detail">Checking your connection</p>
  <div class="bar" id="bar"><i></i></div>
  <div class="actions" id="actions">
    <button class="primary" id="retry">Try again</button>
    <button id="offline">Read offline</button>
  </div>
</div>

<script>
  const LIVE = "https://web.groupme.com";
  const OFFLINE = "offline.html";
  // A cache-busted opaque probe. no-cors resolves on any HTTP response and
  // rejects only on a genuine network failure, which is exactly the signal we
  // want — a 4xx from GroupMe still means the internet works.
  const PROBE = "https://api.groupme.com/v3/users/me?_probe=";

  const $ = (id) => document.getElementById(id);

  async function reachable(timeoutMs = 6000) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeoutMs);
    try {
      await fetch(PROBE + Date.now(), {
        mode: "no-cors",
        cache: "no-store",
        signal: ctl.signal,
      });
      return true;
    } catch {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  function fail() {
    $("title").textContent = "You're offline";
    $("detail").textContent = "Your archived messages are still readable.";
    $("bar").style.display = "none";
    $("actions").classList.add("show");
  }

  async function route() {
    $("bar").style.display = "";
    $("actions").classList.remove("show");
    $("title").textContent = "Connecting…";
    $("detail").textContent = "Checking your connection";

    // navigator.onLine only knows about the link layer — a captive portal or a
    // DNS blackhole reports true. Trust it to say "no", never to say "yes".
    if (navigator.onLine === false || !(await reachable())) {
      fail();
      return;
    }
    location.replace(LIVE);
  }

  $("retry").addEventListener("click", route);
  $("offline").addEventListener("click", () => location.replace(OFFLINE));
  window.addEventListener("online", route);

  route();
</script>
