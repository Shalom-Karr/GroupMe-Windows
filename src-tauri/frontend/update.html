<!--
  Update dialog.

  A small frameless window (380x240) opened by `updater::open_dialog`. It narrates
  the check running in Rust — `src/updater.rs` emits every phase to this window
  and nowhere else — and owns the only two buttons that can start a download or
  an install.

  On load it asks for the last cached phase before subscribing, because the window
  is usually created in the same breath as the check: a check that resolves first
  would land on nobody and leave this panel spinning forever.

  Deliberately self-contained: no CDN, no fonts, no build step, matching
  index.html. Every dynamic value is written with textContent — release notes and
  error strings come off a remote manifest and are untrusted input.
-->
<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost" />
<title>GroupMe — Updates</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #3c16d3;
    --bg: #ffffff;
    --fg: #16161d;
    --muted: #6b6b7b;
    --card: #f5f5f8;
    --border: #e3e3ea;
    --ok: #16794a;
    --danger: #b3243a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e14;
      --fg: #f2f2f6;
      --muted: #9a9aab;
      --card: #191922;
      --border: #2a2a36;
      --ok: #45c98a;
      --danger: #f2707d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    /* The window is frameless, so the 1px border is the only thing separating
       the dialog from whatever is behind it. */
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: .625rem;
    padding: .6875rem .875rem;
    border-bottom: 1px solid var(--border);
  }
  .mark {
    width: 32px; height: 32px; flex: none;
    border-radius: 9px; background: var(--accent);
    display: grid; place-items: center;
  }
  .mark svg { width: 18px; height: 18px; }
  .name { font-size: .9375rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
  .ver { font-size: .75rem; color: var(--muted); line-height: 1.3; }
  .close {
    margin-left: auto; width: 28px; height: 28px; flex: none;
    border: 0; border-radius: 8px; background: transparent;
    color: var(--muted); font: inherit; font-size: .875rem; cursor: pointer;
  }
  .close:hover { background: var(--card); color: var(--fg); }

  main {
    flex: 1; min-height: 0;
    padding: .875rem;
    display: flex; flex-direction: column; justify-content: center; gap: .5rem;
  }
  .status { display: flex; align-items: flex-start; gap: .5rem; font-size: .875rem; }
  .status b { font-weight: 600; }
  .spin {
    width: 14px; height: 14px; flex: none; margin-top: .3rem; display: none;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot { width: 8px; height: 8px; flex: none; margin-top: .45rem; border-radius: 50%; display: none; }

  .bar {
    display: none; height: 3px; border-radius: 2px;
    background: var(--border); overflow: hidden;
  }
  .bar i {
    display: block; width: 0; height: 100%; border-radius: 2px;
    background: var(--accent); transition: width .25s ease;
  }
  /* `flex: 0 1 auto` with `min-height: 0` is what keeps a long release note from
     pushing the buttons off a window that cannot be resized: the notes shrink and
     scroll internally instead of overflowing the panel. */
  .notes {
    display: none; flex: 0 1 auto; min-height: 0;
    font-size: .75rem; color: var(--muted);
    white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto;
  }

  footer {
    flex: none; display: flex; gap: .5rem; justify-content: flex-end;
    padding: .6875rem .875rem; border-top: 1px solid var(--border);
  }
  button {
    font: inherit; font-size: .8125rem; padding: .4375rem .875rem;
    border-radius: 9px; border: 1px solid var(--border);
    background: var(--card); color: var(--fg); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* One class on <body> drives the whole panel. */
  body.checking .spin,
  body.downloading .spin { display: block; }
  body.uptodate .dot,
  body.ready .dot { display: block; background: var(--ok); }
  body.available .dot { display: block; background: var(--accent); }
  body.error .dot { display: block; background: var(--danger); }
  body.downloading .bar { display: block; }
  body.available .notes,
  body.downloading .notes,
  body.ready .notes,
  body.error .notes { display: block; }

  #download, #restart, #retry { display: none; }
  body.available #download,
  body.ready #restart,
  body.error #retry { display: inline-block; }

  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .bar i { transition: none; }
  }
</style>

<header data-tauri-drag-region>
  <div class="mark" data-tauri-drag-region aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.9-.9L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
    </svg>
  </div>
  <div data-tauri-drag-region>
    <div class="name" data-tauri-drag-region>GroupMe</div>
    <div class="ver" data-tauri-drag-region>Version <span id="cur">…</span></div>
  </div>
  <button class="close" id="close" title="Close" aria-label="Close">✕</button>
</header>

<main>
  <div class="status" role="status" aria-live="polite">
    <span class="spin"></span><span class="dot"></span><span id="msg">Checking for updates…</span>
  </div>
  <div class="bar"><i id="pct"></i></div>
  <div class="notes" id="notes"></div>
</main>

<footer>
  <button id="close2">Close</button>
  <button class="primary" id="retry">Try again</button>
  <button class="primary" id="download">Download</button>
  <button class="primary" id="restart">Restart &amp; install</button>
</footer>

<script>
  var T = window.__TAURI__ || {};
  var invoke = (T.core && T.core.invoke)
    ? T.core.invoke
    : function () { return Promise.reject(new Error("IPC unavailable")); };
  var listen = (T.event && T.event.listen) ? T.event.listen : function () {};

  var $ = function (id) { return document.getElementById(id); };

  function state(name) { document.body.className = name; }

  // Builds the status line out of text nodes only. `lead`/`tail` are literals
  // from this file; `strong` is the dynamic part (a version, a server message)
  // and is set with textContent so a manifest can never contribute markup.
  function say(lead, strong, tail) {
    var m = $("msg");
    m.textContent = "";
    if (lead) m.appendChild(document.createTextNode(lead));
    if (strong != null && strong !== "") {
      var b = document.createElement("b");
      b.textContent = String(strong);
      m.appendChild(b);
    }
    if (tail) m.appendChild(document.createTextNode(tail));
  }

  function notes(text) { $("notes").textContent = text ? String(text) : ""; }

  function render(event, p) {
    p = p || {};
    if (p.currentVersion) $("cur").textContent = String(p.currentVersion);

    if (event === "updater://checking") {
      state("checking");
      say("Checking for updates…");
      notes("");
      $("pct").style.width = "0";
    } else if (event === "updater://up-to-date") {
      state("uptodate");
      say("You're up to date. Version ", p.currentVersion, " is the latest.");
      notes("");
    } else if (event === "updater://update-available") {
      state("available");
      say("Version ", p.version, " is available.");
      notes(p.notes);
    } else if (event === "updater://downloading") {
      state("downloading");
      say("Downloading version ", p.version, "…");
      notes(p.notes);
    } else if (event === "updater://ready") {
      state("ready");
      say("Version ", p.version, " is ready. It installs when you quit GroupMe.");
      notes(p.notes);
    } else if (event === "updater://error") {
      state("error");
      say("Couldn't check for updates.");
      notes(p.message);
    }
  }

  state("checking");

  invoke("updater_version")
    .then(function (v) { $("cur").textContent = String(v); })
    .catch(function () { $("cur").textContent = "?"; });

  // Live events always win over the startup snapshot below, whichever order the
  // two arrive in.
  var live = false;
  [
    "updater://checking",
    "updater://up-to-date",
    "updater://update-available",
    "updater://downloading",
    "updater://ready",
    "updater://error"
  ].forEach(function (name) {
    listen(name, function (e) { live = true; render(name, e.payload); });
  });

  listen("updater://download-progress", function (e) {
    var p = (e && e.payload) || {};
    if (p.percent == null) return;
    var pct = Math.max(0, Math.min(100, Number(p.percent) || 0));
    $("pct").style.width = pct + "%";
  });

  invoke("updater_last_status").then(function (s) {
    if (live) return;
    if (s && s.event) { render(s.event, s.payload); return; }
    // Opened before anything has ever run. Start a check rather than sitting on
    // a spinner nothing will resolve; a check already in flight just re-announces.
    invoke("updater_check").catch(function () {});
  }).catch(function () {});

  function hide() {
    if (T.window && T.window.getCurrentWindow) T.window.getCurrentWindow().hide();
  }

  $("close").onclick = hide;
  $("close2").onclick = hide;
  $("retry").onclick = function () { invoke("updater_check").catch(function () {}); };
  $("download").onclick = function () { invoke("updater_download").catch(function () {}); };
  $("restart").onclick = function () { invoke("updater_restart").catch(function () {}); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hide(); });
</script>
