     than the sender's string. `javascript:`, `data:`, `vbscript:`, a bare
     `//host`, and every mixed-case or whitespace-padded variant of them fail
     that test, and a rejected link is rendered as the literal characters the
     sender typed. Anchors carry `rel="noopener noreferrer"` and open through
     the opener plugin's `target="_blank"` handler, so a link never navigates
     this window.

     ── The cost rule ────────────────────────────────────────────────────────
     This runs inside the virtualiser's row builder, on a thread that reaches
     142,000 messages, so it is one linear pass with no backtracking regex.
     Every regex here is anchored with a bounded quantifier and applied to a
     single line. The delimiter search is bounded per opener (MD_PROBES) and
     abandoned for the whole body once a delimiter is known to have no closer
     left in the string (`ctx.nc`), which removes the quadratic case that a
     line of unmatched `*` would otherwise be. Bodies past MD_MAX are not
     parsed at all — a deliberate, visible degradation to plain text.        */

  var MD_MAX = 40000;   // beyond this a body renders as plain text, unparsed
  var MD_PROBES = 24;   // closer candidates examined per emphasis opener
  var MD_DEPTH = 4;     // emphasis nesting depth

  var QUOTE_RE  = /^[ \t]{0,3}>[ \t]?/;
  var FENCE_RE  = /^[ \t]{0,3}(?:```|~~~)[ \t]*[A-Za-z0-9_+.#-]{0,20}[ \t]*$/;
  var BULLET_RE = /^[ \t]{0,3}[-+*][ \t]+(.*)$/;
  var OLIST_RE  = /^[ \t]{0,3}\d{1,9}[.)][ \t]+(.*)$/;
  var MD_PUNCT  = /[\\`*_{}[\]()#+\-.!>~|]/;

  // The only producer of an href in this file. See the safety rule above.
  var URL_SHAPE = /^https?:\/\/[^\s<>"'`]{1,2000}$/i;
  var URL_CHAR  = /[^\s<>"'`]/;

  // A control character can arrive raw or through a decoded escape. A URL that
  // contains one is not a URL.
  function hasControl(s) {
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 32 || c === 127) return true;
    }
    return false;
  }

  function safeUrl(raw) {
    var u = String(raw == null ? "" : raw).trim();
    if (u.charAt(0) === "<" && u.charAt(u.length - 1) === ">") u = u.slice(1, -1).trim();
    if (!URL_SHAPE.test(u) || hasControl(u)) return null;
    try {
      var parsed = new URL(u);
      if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return null;
      if (!parsed.hostname) return null;
      return parsed.href;
    } catch (e) { return null; }
  }

  function hostOf(u) {
    try { return new URL(u).hostname.replace(/^www\./i, ""); } catch (e) { return ""; }
  }

  function isWordCode(c) {
    return (c >= 48 && c <= 57) || (c >= 65 && c <= 90) || (c >= 97 && c <= 122) ||
           c === 95 || c >= 128;
  }
  function isSpaceCode(c) { return c === 32 || c === 9 || c === 10 || c === 13 || c === 12; }

  // An emphasis span made of nothing but more delimiters is not emphasis, it is
  // a row of asterisks. Without this rule "****…" builds one <strong> per six
  // characters rather than rendering as the text it plainly is. Exits on the
  // first real character, so it costs nothing on ordinary content.
  function hasSubstance(s, from, to, code) {
    for (var i = from; i < to; i++) {
      var c = s.charCodeAt(i);
      if (c !== code && !isSpaceCode(c)) return true;
    }
    return false;
  }
  // `limit` matters: measuring the *whole* run of a delimiter is quadratic on a
  // line of bare asterisks, because every position re-measures the rest of it.
  // Emphasis only ever needs to know "one or two", so it passes 2. Code spans
  // genuinely need the true length (```a``` closes on three) and pass nothing,
  // which is safe because the run is then consumed whole in one step.
  function runLen(s, i, code, limit) {
    var stop = limit == null ? s.length : Math.min(s.length, i + limit);
    var j = i;
    while (j < stop && s.charCodeAt(j) === code) j++;
    return j - i;
  }

  // Characters that can begin a construct. Everything else is consumed in
  // slices, so ordinary prose costs one `slice` per run rather than per char.
  var MD_SPECIAL = (function () {
    var a = [];
    "*_`[\\hH".split("").forEach(function (c) { a[c.charCodeAt(0)] = 1; });
    return a;
  })();

  // Cheap veto: most messages contain no markdown and take the plain path.
  function looksRich(s) {
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c === 42 || c === 95 || c === 96 || c === 62 || c === 91 || c === 92) return true;
      if (c === 104 && s.charCodeAt(i + 1) === 116 &&
          s.charCodeAt(i + 2) === 116 && s.charCodeAt(i + 3) === 112) return true;
      if ((c === 45 || c === 43 || (c >= 48 && c <= 57)) &&
          (i === 0 || s.charCodeAt(i - 1) === 10)) return true;
    }
    return false;
  }

  // Per-render scratch: the links found (for the preview card) and the memo of
  // delimiters already proved to have no closer left in the body.
  function richCtx() { return { urls: [], nc: Object.create(null), inLink: false }; }

  function bulletOf(line) {
    var m = BULLET_RE.exec(line);
    if (m) return { ordered: false, text: m[1] };
    m = OLIST_RE.exec(line);
    if (m) return { ordered: true, text: m[1] };
    return null;
  }

  function anchorFor(href, ctx) {
    var a = document.createElement("a");
    a.href = href;                       // href only ever comes from safeUrl
    a.target = "_blank";                 // the opener plugin sends it to the browser
    a.rel = "noopener noreferrer";
    a.title = href;
    if (ctx && ctx.urls.length < 4 && ctx.urls.indexOf(href) < 0) ctx.urls.push(href);
    return a;
  }

  /* The run of characters at `i` that is a usable http(s) URL, or null. One
     scan: `text` is what the sender typed with trailing sentence punctuation
     removed, `href` is the parser's normalised form (the only thing that ever
     becomes an attribute), and `len` is how far the cursor advances. */
  function urlSpanAt(s, i, n) {
    // Cheapest possible veto first: every `h` in ordinary prose reaches here, so
    // the substring below must not be allocated for "the", "right", "which"…
    var t = s.charCodeAt(i + 1);
    if (t !== 116 && t !== 84) return null;
    var head = s.substr(i, 8).toLowerCase();
    var scheme = head.indexOf("https://") === 0 ? 8 : (head.indexOf("http://") === 0 ? 7 : 0);
    if (!scheme) return null;
    // Not a URL if it is the tail of a longer token: "xhttp://", "s://a/http://b".
    if (i > 0) {
      var pc = s.charCodeAt(i - 1);
      if (isWordCode(pc) || pc === 47 || pc === 58 || pc === 46) return null;
    }
    var j = i + scheme;
    while (j < n && URL_CHAR.test(s.charAt(j))) j++;
    if (j <= i + scheme) return null;
    var text = trimUrlTail(s.slice(i, j));
    if (!text) return null;
    var href = safeUrl(text);
    return href ? { href: href, text: text, len: text.length } : null;
  }

  // Trailing sentence punctuation belongs to the sentence, not to the URL, and
  // a closing paren belongs to the URL only if it balances one inside it.
  function trimUrlTail(u) {
    for (;;) {
      if (!u.length) break;
      var last = u.charAt(u.length - 1);
      if (".,;:!?\"'".indexOf(last) >= 0) { u = u.slice(0, -1); continue; }
      if (last === "]" || last === "}") { u = u.slice(0, -1); continue; }
      if (last === ")") {
        var opens = 0, closes = 0;
        for (var k = 0; k < u.length; k++) {
          var c = u.charCodeAt(k);
          if (c === 40) opens++; else if (c === 41) closes++;
        }
        if (closes > opens) { u = u.slice(0, -1); continue; }
      }
      break;
    }
    return u;
  }

  // `[` … `]` allowing one level of nesting, never across a line, bounded so a
  // line of open brackets cannot turn the scan quadratic.
  function matchBracket(s, i, n) {
    var depth = 0, limit = Math.min(n, i + 512);
    for (var j = i; j < limit; j++) {
      var c = s.charCodeAt(j);
      if (c === 10) return -1;
      if (c === 91) depth++;
      else if (c === 93) { depth--; if (depth === 0) return j; }
    }
    return -1;
  }

  function pushText(parent, buf) {
    if (buf) parent.appendChild(document.createTextNode(buf));
  }

  function inlineInto(parent, text, depth, ctx) {
    if (!ctx) ctx = richCtx();
    var s = String(text), n = s.length, buf = "", i = 0;

    while (i < n) {
      var code = s.charCodeAt(i);

      // A backslash makes the next punctuation character literal.
      if (code === 92 && i + 1 < n && MD_PUNCT.test(s.charAt(i + 1))) {
        buf += s.charAt(i + 1); i += 2; continue;
      }

      // `code` / ``code`` — contents are literal, so nothing inside is parsed.
      if (code === 96) {
        var k = runLen(s, i, 96);
        var key = "`" + k, found = -1;
        if (!ctx.nc[key]) {
          var j = i + k;
          while (j < n) {
            if (s.charCodeAt(j) === 96) {
              var k2 = runLen(s, j, 96);
              if (k2 === k) { found = j; break; }
              j += k2;
            } else j++;
          }
          if (found < 0) ctx.nc[key] = 1;
        }
        if (found > i + k) {
          pushText(parent, buf); buf = "";
          var codeEl = document.createElement("code");
          codeEl.appendChild(document.createTextNode(s.slice(i + k, found)));
          parent.appendChild(codeEl);
          i = found + k;
          continue;
        }
        buf += s.substr(i, k); i += k; continue;
      }

      // **strong**, *em*, _em_
      if (code === 42 || code === 95) {
        var ch = s.charAt(i);
        var run = runLen(s, i, code, 2);
        var start = i + run;
        var open = start < n && !isSpaceCode(s.charCodeAt(start));
        // `_` opens only at a word boundary, so snake_case_names survive.
        if (open && code === 95 && i > 0 && isWordCode(s.charCodeAt(i - 1))) open = false;
        if (open && depth < MD_DEPTH) {
          var need = run === 2 ? ch + ch : ch;
          var ekey = ch + run, hit = -1;
          if (!ctx.nc[ekey]) {
            var at = start, probes = 0;
            // Exhausting the probe budget is itself conclusive: 24 candidate
            // closers rejected in one body means this delimiter is being used
            // as decoration, not as emphasis, so the form is retired for the
            // rest of the body. That is what keeps the whole pass linear — a
            // line of bare asterisks would otherwise re-probe from every one of
            // them. The degradation is that the run renders as the text it is.
            ctx.nc[ekey] = 1;
            while (probes < MD_PROBES) {
              var p = s.indexOf(need, at);
              if (p < 0) break;
              probes++;
              // A single `*` closer that is really the start of a `**` run
              // belongs to the bold form, not to this one.
              if (run === 1 && code === 42 && s.charCodeAt(p + 1) === 42) { at = p + 2; continue; }
              var afterOk = code === 95 ? !isWordCode(s.charCodeAt(p + need.length)) : true;
              if (p > start && !isSpaceCode(s.charCodeAt(p - 1)) && afterOk &&
                  hasSubstance(s, start, p, code)) { hit = p; ctx.nc[ekey] = 0; break; }
              at = p + need.length;
            }
          }
          if (hit > 0) {
            pushText(parent, buf); buf = "";
            var em = document.createElement(run === 2 ? "strong" : "em");
            inlineInto(em, s.slice(start, hit), depth + 1, ctx);
            parent.appendChild(em);
            i = hit + need.length;
            continue;
          }
        }
        buf += s.substr(i, run); i += run; continue;
      }

      // [label](https://…)
      if (code === 91 && !ctx.inLink && !ctx.nc["["]) {
        // No `]` left in the body means no `[` left in it can open a label.
        if (s.indexOf("]", i) < 0) { ctx.nc["["] = 1; buf += "["; i += 1; continue; }
        var close = matchBracket(s, i, n);
        if (close > 0 && s.charAt(close + 1) === "(") {
          var end = s.indexOf(")", close + 2);
          if (end > close + 2 && end - close < 2100) {
            var href = safeUrl(s.slice(close + 2, end));
            var label = s.slice(i + 1, close);
            if (href && label) {
              pushText(parent, buf); buf = "";
              var a = anchorFor(href, ctx);
              var was = ctx.inLink;
              ctx.inLink = true;                       // no anchor inside an anchor
              inlineInto(a, label, depth + 1, ctx);
              ctx.inLink = was;
              parent.appendChild(a);
              i = end + 1;
              continue;
            }
          }
        }
        buf += "["; i += 1; continue;
      }

      // Bare http(s) URL.
      if ((code === 104 || code === 72) && !ctx.inLink) {
        var span = urlSpanAt(s, i, n);
        if (span) {
          pushText(parent, buf); buf = "";
          var la = anchorFor(span.href, ctx);
          // The visible text is the sender's URL — as a text node, like
          // everything else. Only the href comes from safeUrl.
          la.appendChild(document.createTextNode(span.text));
          parent.appendChild(la);
          i += span.len;
          continue;
        }
      }

      // Ordinary text, taken in runs.
      var q = i + 1;
      while (q < n && !MD_SPECIAL[s.charCodeAt(q)]) q++;
      buf += s.slice(i, q);
      i = q;
    }

    pushText(parent, buf);
    return parent;
  }

  /* Blocks first, then inline within each. A run of ordinary lines is emitted
     as one text node with its newlines intact, which is exactly what the old
     plain-text renderer did — `.bubble` is `white-space: pre-wrap`, so nothing
     about unformatted messages changed. */
  function renderRich(text, ctx) {
    var frag = document.createDocumentFragment();
    var s = String(text == null ? "" : text);
    if (!s) return frag;
    if (s.length > MD_MAX || !looksRich(s)) {
      frag.appendChild(document.createTextNode(s));
      return frag;
    }
    if (!ctx) ctx = richCtx();

    var lines = s.split("\n"), i = 0, plain = [];
    function flushPlain() {
      if (!plain.length) return;
      inlineInto(frag, plain.join("\n"), 0, ctx);
      plain = [];
    }

    while (i < lines.length) {
      var line = lines[i];

      if (FENCE_RE.test(line)) {
        flushPlain();
        var body = [];
        i++;
        while (i < lines.length && !FENCE_RE.test(lines[i])) { body.push(lines[i]); i++; }
        if (i < lines.length) i++;                      // the closing fence
        var pre = document.createElement("pre");
        var codeNode = document.createElement("code");
        codeNode.appendChild(document.createTextNode(body.join("\n")));
        pre.appendChild(codeNode);
        frag.appendChild(pre);
        continue;
      }

      if (QUOTE_RE.test(line)) {
        flushPlain();
        var quoted = [];
        while (i < lines.length && QUOTE_RE.test(lines[i])) {
          quoted.push(lines[i].replace(QUOTE_RE, ""));
          i++;
        }
        var bq = document.createElement("blockquote");
        inlineInto(bq, quoted.join("\n"), 0, ctx);
        frag.appendChild(bq);
        continue;
      }

      var item = bulletOf(line);
      if (item) {
        flushPlain();
        var holder = document.createElement(item.ordered ? "ol" : "ul");
        while (i < lines.length) {
          var next = bulletOf(lines[i]);
          if (!next || next.ordered !== item.ordered) break;
          var li = document.createElement("li");
          inlineInto(li, next.text, 0, ctx);
          holder.appendChild(li);
          i++;
        }
        frag.appendChild(holder);
        continue;
      }

      plain.push(line);
      i++;
    }
    flushPlain();
    return frag;
  }

  /* ============================ link previews ============================

     THIS IS THE ONLY WIRING POINT. `linkPreviewSource` returns null today,
     which means "no preview available" and costs a row nothing at all — no
     promise, no timer, no request. When the Rust command lands, the body
     becomes exactly:

         return call("client_url_preview", { url: url });

     and nothing else in this file changes. `call` already reports a failed or
     unregistered invoke as null, so an error degrades to "no card".

     The command is expected to resolve to null, or to

         { url, title, description, image, site }

     where every field but `url` is optional and `image` is a LOCAL cached path
     or a `data:` URL — never a remote one. This page must not fetch a URL: the
     CSP is `default-src 'self'`, and a request from here would disclose the
     user's reading to a third party.                                        */

  function linkPreviewSource(url) {
    // return call("client_url_preview", { url: url });   ← the entire wire-up
    void url;
    return null;
  }

  function attachLinkPreview(host, url) {
    var src = linkPreviewSource(url);
    if (!src) return;                       // the no-preview path allocates nothing
    Promise.resolve(src).then(function (data) {
      if (!host.isConnected) return;        // the row was dematerialised meanwhile
      var card = renderLinkPreview(data);
      if (card) host.appendChild(card);
    }, function () { /* no preview is an ordinary outcome, not an error */ });
  }

  function previewLine(v, cap) {
    var s = v == null ? "" : String(v).replace(/\s+/g, " ").trim();
    if (!s) return "";
    return s.length > cap ? s.slice(0, cap) + "…" : s;
  }

  /* A preview image is a *local* file that Rust has already cached, resolved
     the same way every other image in this window is. A remote URL is refused
     rather than attempted: `img-src` would block it, and a request from here
     would tell a third party what the user is reading. So would a
     protocol-relative `//host/x`, which is why that is refused too. */
  function previewImageSrc(v) {
    var s = v == null ? "" : String(v).trim();
    if (!s || hasControl(s) || /[<>"'`]/.test(s) || s.indexOf("//") === 0) return null;
    if (/^data:image\/(png|jpeg|jpg|gif|webp|bmp);/i.test(s)) return s;
    if (/^asset:/i.test(s) || s.indexOf("http://asset.localhost") === 0) return s;
    // A scheme other than a Windows drive letter means it is not a local path.
    if (/^[a-z][a-z0-9+.-]*:/i.test(s) && !/^[a-z]:[\\/]/i.test(s)) return null;
    return localSrc(s);
  }

  function renderLinkPreview(data) {
    if (!data || typeof data !== "object") return null;
    var href = safeUrl(fld(data, "url", "href"));
    if (!href) return null;
    var title = previewLine(fld(data, "title"), 300);
    var desc = previewLine(fld(data, "description", "desc"), 400);
    var site = previewLine(fld(data, "site", "site_name", "siteName"), 60);
    // A card that would say nothing the message does not already say is worse
    // than no card.
    if (!title && !desc) return null;

    var card = document.createElement("a");
    card.className = "lp";
    card.href = href;                       // safeUrl again — never the raw field
    card.target = "_blank";
    card.rel = "noopener noreferrer";
    card.title = href;

    var img = previewImageSrc(fld(data, "image", "image_url", "imageUrl"));
    if (img) {
      var plate = el("img", "lp-thumb");
      plate.alt = "";
      plate.loading = "lazy";
      // A plate that fails to load removes itself rather than leaving a hole;
      // the card is laid out to be right without one.
      plate.addEventListener("error", function () {
        if (plate.parentNode) plate.parentNode.removeChild(plate);
        card.classList.add("noimg");
      });
      plate.src = img;
      card.appendChild(plate);
    } else {
      card.classList.add("noimg");
    }

    var box = el("div", "lp-body");
    box.appendChild(el("div", "lp-site", site || hostOf(href)));
    if (title) box.appendChild(el("div", "lp-title", title));
    if (desc) box.appendChild(el("div", "lp-desc", desc));
    card.appendChild(box);
    return card;
  }

  /* ========================= message rendering ========================== */

  function isDeleted(m) { return fld(m, "deleted_at", "deletedAt") != null; }
  function isEdited(m) { return fld(m, "updated_at", "updatedAt") != null; }

  function isMine(m) {
    if (!m) return false;
    if (m.__local) return true;
    if (state.selfId && m.user_id != null) return String(m.user_id) === state.selfId;
    // Falls back to the display name only while the id is still unknown. It is
    // the weaker test — nicknames differ per group — so anything destructive is
    // gated on the id, not on this.
    return !!(state.accountName && m.name && m.name === state.accountName);
  }

  function canActOn(m) {
    return !!(state.selfId && m && m.user_id != null && String(m.user_id) === state.selfId);
  }

  function renderMessage(m, cont) {
    var mine = isMine(m);
    var key = String(m.id);
    var wrap = el("div", "msg" + (cont ? " cont" : "") + (mine ? " mine" : ""));
    wrap.dataset.mid = key;

    if (cont || mine) {
      wrap.appendChild(el("div", "gutter"));
    } else {
      wrap.appendChild(makeAvatar(m.name, fld(m, "avatar_url", "avatarUrl"), m.user_id || m.name, "sm"));
    }

    var body = el("div", "msg-body");

    if (!cont) {
      var meta = el("div", "msg-meta");
      meta.appendChild(el("span", "msg-name", m.name || "Unknown"));
      meta.appendChild(el("span", "msg-time", clockTime(fld(m, "created_at", "createdAt"))));
      body.appendChild(meta);
    }

    var atts = Array.isArray(m.attachments) ? m.attachments : [];
    var reply = atts.filter(function (a) { return a && a.type === "reply"; })[0];
    if (reply) body.appendChild(renderQuote(reply));

    if (isDeleted(m)) {
      body.appendChild(el("div", "bubble tomb", "This message was deleted"));
    } else {
      var text = m.text;
      var rich = null;
      if (text != null && String(text).length) {
        // Markdown is built as nodes, never as markup. `rich.urls` is what the
        // tokeniser already found, so the preview costs no second scan.
        rich = richCtx();
        var b = el("div", "bubble");
        b.appendChild(renderRich(text, rich));
        if (m.__pending) b.classList.add("pending");
        if (isEdited(m)) b.appendChild(el("span", "edited", "(edited)"));
        body.appendChild(b);
      }
      var media = atts.filter(function (a) {
        return a && a.type !== "reply" && a.type !== "emoji" && a.type !== "mentions";
      });
      if (media.length) body.appendChild(renderAttachments(media));
      if ((text == null || !String(text).length) && !media.length) {
        var ph = el("div", "bubble tomb", "No content in the archive for this message");
        if (isEdited(m)) ph.appendChild(el("span", "edited", "(edited)"));
        body.appendChild(ph);
      }
      // One card for the first link, and only for a message that exists: an
      // optimistic row is replaced by the server's copy a moment later.
      if (rich && rich.urls.length && !media.length && !m.__pending) {
        attachLinkPreview(body, rich.urls[0]);
      }
    }

    var reacts = renderReactions(m);
    if (reacts) body.appendChild(reacts);

    wrap.appendChild(body);
    if (!m.__pending && !m.system) wrap.appendChild(rowActions(m));

    state.nodeById.set(key, wrap);
    return wrap;
  }

  function rowActions(m) {
    var box = el("div", "acts");
    box.appendChild(withIcon(btn("act", "Reply", function (e) {
      e.stopPropagation(); startReply(m);
    }), "reply"));
    var react = btn("act", "React", function (e) {
      e.stopPropagation(); openEmojiPicker(e.currentTarget, m);
    });
    react.appendChild(el("span", "emo", "☺"));
    box.appendChild(react);
    box.appendChild(withIcon(btn("act", "More", function (e) {
      e.stopPropagation(); openMessageMenu(e.currentTarget, m);
    }), "more"));
    return box;
  }

  function renderQuote(a) {
    var q = el("button", "quote");
    q.type = "button";
    var refId = fld(a, "reply_id", "replyId") || fld(a, "base_reply_id", "baseReplyId");
    var ref = refId == null ? null : (state.msgById.get(String(refId)) || null);
    q.appendChild(el("b", null, ref && ref.name ? ref.name : "Replying to an earlier message"));
    var t = ref && !isDeleted(ref) ? ref.text : null;
    q.appendChild(el("div", "quote-text",
      t ? String(t).replace(/\s+/g, " ") : "The quoted message isn't loaded yet"));
    if (refId != null) {
      q.title = "Go to the quoted message";
      q.addEventListener("click", function (e) {
        e.stopPropagation();
        goToMessage(String(refId));
      });
    }
    if (!ref && refId != null) state.pendingQuotes.push({ node: q, id: String(refId), att: a });
    return q;
  }

  // A quote can name a message that only arrives with a later page. Those nodes
  // are filled in by hand rather than by re-rendering the thread.
  function fillPendingQuotes() {
    if (!state.pendingQuotes.length) return;
    var still = [];
    state.pendingQuotes.forEach(function (p) {
      if (!p.node.isConnected) return;
      if (!state.msgById.has(p.id)) { still.push(p); return; }
      p.node.replaceWith(renderQuote(p.att));
    });
    state.pendingQuotes = still;
  }

  function renderAttachments(list) {
    var box = el("div", "atts");
    list.forEach(function (a) {
      var type = a.type || "";
      if (type === "image" || type === "video" || type === "linked_image") {
        var url = a.url || fld(a, "source_url", "sourceUrl") || fld(a, "preview_url", "previewUrl");
        var slot = el("div");
        slot.appendChild(missingAttachment(type === "video"
          ? "This video hasn't been downloaded yet"
          : "This image hasn't been downloaded yet"));
        box.appendChild(slot);
        if (!url) return;

        // A just-sent image is not in the media cache yet; the local copy the
        // user picked stands in until the next sync downloads it. Everything
        // else must come from the cache — a remote URL is blocked by the CSP.
        var preview = state.localPreview.get(String(url));
        if (preview) { showImage(slot, preview, "Image you sent"); return; }

        resolveMedia(url).then(function (path) {
          if (!path || !slot.isConnected) return;
          if (type === "video") {
            var v = document.createElement("video");
            v.className = "att-img";
            v.controls = true;
            v.preload = "metadata";
            v.src = localSrc(path);
            slot.textContent = "";
            slot.appendChild(v);
            return;
          }
          showImage(slot, localSrc(path), "Attached image");
        });
      } else if (type === "location") {
        var name = a.name ? String(a.name) : "Shared location";
        var coords = (a.lat != null && a.lng != null) ? " · " + a.lat + ", " + a.lng : "";
        box.appendChild(missingAttachment(name + coords, "pin"));
      } else if (type === "file") {
        box.appendChild(missingAttachment("File attachment", "file"));
      } else {
        box.appendChild(missingAttachment("Attachment (" + (type || "unknown") + ") can't be shown here", "file"));
      }
    });
    return box;
  }

  function showImage(slot, src, alt) {
    var img = el("img", "att-img");
    img.alt = alt;
    img.loading = "lazy";
    img.src = src;
    img.onload = function () { if (slot.isConnected) { slot.textContent = ""; slot.appendChild(img); } };
  }

  function missingAttachment(label, kind) {
    var n = el("div", "att-miss");
    n.appendChild(icon(kind === "pin" ? "pin" : kind === "file" ? "file" : "broken"));
    n.appendChild(el("span", null, label));
    return n;
  }

  /* ----------------------------- reactions ----------------------------- */

  // Both roster shapes are read. `favorited_by` is not a set — a live frame has
  // been seen carrying the same account twice — so reactors are deduplicated
  // before they are counted, exactly as the Rust side does.
  function reactionGroups(m) {
    var out = [];
    var claimed = Object.create(null);
    var list = Array.isArray(m.reactions) ? m.reactions : [];

    list.forEach(function (r) {
      if (!r) return;
      var users = Array.isArray(fld(r, "user_ids", "userIds")) ? fld(r, "user_ids", "userIds") : [];
      var seen = Object.create(null), ids = [];
      users.forEach(function (u) {
        var k = String(u);
        if (seen[k]) return;
        seen[k] = 1; claimed[k] = 1; ids.push(k);
      });
      var glyph = (r.type === "unicode" && r.code) ? String(r.code) : null;
      out.push({
        code: glyph,
        glyph: glyph || "◍",
        pack: !glyph,
        ids: ids,
        count: ids.length || 1
      });
    });

    var favs = Array.isArray(fld(m, "favorited_by", "favoritedBy")) ? fld(m, "favorited_by", "favoritedBy") : [];
    var extra = [], seenFav = Object.create(null);
    favs.forEach(function (u) {
      var k = String(u);
      if (seenFav[k] || claimed[k]) return;
      seenFav[k] = 1; extra.push(k);
    });
    if (extra.length) out.push({ code: null, glyph: "❤", pack: false, like: true, ids: extra, count: extra.length });

    return out.filter(function (g) { return g.count > 0; });
  }

  function renderReactions(m) {
    var groups = reactionGroups(m);
    if (!groups.length) return null;
    var box = el("div", "reacts");
    groups.forEach(function (g) {
      var own = !!(state.selfId && g.ids.indexOf(state.selfId) >= 0);
      var chip = el("button", "react" + (own ? " own" : ""));
      chip.type = "button";
      chip.appendChild(el("span", "glyph", g.glyph));
      chip.appendChild(el("span", null, String(g.count)));
      if (g.pack) {
        chip.title = "Reaction from GroupMe's emoji pack";
        chip.disabled = true;
      } else {
        chip.title = own ? "Remove your reaction" : "React with " + g.glyph;
        chip.addEventListener("click", function (e) {
          e.stopPropagation();
          if (own) doUnreact(m); else doReact(m, g.like ? null : g.code);
        });
      }
      box.appendChild(chip);
    });
    return box;
  }

  /* ============================== thread ================================ */

  var app = $("app"), emptyEl = $("empty"), threadEl = $("thread");
  var bannerEl = $("banner"), bannerText = $("bannerText"), bannerBtn = $("bannerBtn");

  function setTop(kind) {
    topState.textContent = "";
    if (kind === "spinner") {
      var s = el("div", "spinner");
      s.setAttribute("role", "status");
      s.setAttribute("aria-label", "Loading earlier messages");
      topState.appendChild(s);
    } else if (kind === "start") {
      topState.appendChild(el("div", "top-note", "Beginning of the archived history"));
    } else if (kind === "error") {
      topState.appendChild(el("div", "top-note", "Couldn't load earlier messages from the archive"));
    }
  }

  function showBanner(text, label, onClick) {
    if (!text) { bannerEl.classList.remove("show"); return; }
    bannerText.textContent = text;
    bannerBtn.textContent = label || "Dismiss";
    bannerBtn.onclick = onClick || function () { bannerEl.classList.remove("show"); };
    bannerEl.classList.add("show");
  }

  // `settle` re-pins after the next frame. Cached images and avatars resolve
  // asynchronously and grow the log after the first scroll, which otherwise
  // leaves the newest message just off the bottom of the viewport.
  function scrollToBottom(settle) {
    scroller.scrollTop = scroller.scrollHeight;
    state.atBottom = true;
    if (!settle) return;
    requestAnimationFrame(function () {
      if (state.atBottom) scroller.scrollTop = scroller.scrollHeight;
    });
  }

  function updateSub() {
    var c = state.byId[state.active];
    var bits = [];
    var typing = typingLabel(state.active);
    if (typing) {
      $("tSub").textContent = typing;
      $("tSub").classList.add("typing");
      return;
    }
    $("tSub").classList.remove("typing");
    var count = c ? Number(fld(c, "messages_count", "messagesCount") || 0) : 0;
    if (count) bits.push(count.toLocaleString() + (count === 1 ? " message" : " messages"));
    bits.push(c && c.kind === "dm" ? "Direct message" : "Group");
    if (state.anchored) bits.push("viewing an earlier part");
    $("tSub").textContent = bits.join(" · ");
  }

  async function openConversation(cid, anchorId) {
    var c = state.byId[cid];
    // The archive keys a DM by the other participant's user id, so its id is
    // shape-identical to a group id and `kind` is the only way to tell. Rust
    // needs it to pick the channel: guessing subscribed DMs to /group/{user_id},
    // which GroupMe rejects as an auth failure and which killed the whole
    // realtime session on the first DM opened.
    var kind = (c && c.kind) || (String(cid).indexOf("+") >= 0 ? "dm" : "group");
    // Typing notices are published per-conversation, so they only arrive for a
    // thread the socket is subscribed to. Messages come over the account
    // channel regardless, so this is best-effort and never gates the open.
    if (HAS_IPC && cid !== state.active) {
      call("client_watch_conversation", {
        conversationId: cid,
        kind: kind,
        previousId: state.active || null,
      });
    }
    state.active = cid;
    state.activeKind = kind;
    state.cursor = null;
    state.hasMore = true;
    state.loading = false;
    state.anchored = false;
    state.atBottom = true;
    cancelReply();
    cancelEdit();
    clearDrafts();
    var mySeq = ++state.seq;

    app.classList.add("thread-open");
    emptyEl.classList.add("hide");
    threadEl.classList.add("show");
    showBanner(null);

    $("tTitle").textContent = convoTitle(c) || "Conversation";
    // The conversation's own avatar next to its name — the group image or the
    // DM avatar, and the same letter-plate the sidebar uses when there is none.
    var av = $("tAvatar");
    av.textContent = "";
    av.appendChild(makeAvatar(convoTitle(c), c && fld(c, "image_url", "imageUrl"), cid,
      "hd" + (kind === "group" ? " square" : "")));
    $("headId").setAttribute("aria-label", "Settings for " + (convoTitle(c) || "this conversation"));
    closeFind();
    updateSub();
    clearThreadDom();
    setTop("spinner");
    syncComposer();

    Array.prototype.forEach.call(listEl.querySelectorAll(".row"), function (r) {
      r.classList.toggle("active", r.dataset.cid === cid);
    });

    var page = await call("archive_messages", { conversationId: cid, limit: PAGE, beforeId: null });
    if (mySeq !== state.seq) return;
    page = Array.isArray(page) ? page : [];

    var wanted = anchorId == null ? null : String(anchorId);
    var inPage = wanted != null && page.some(function (m) { return String(m.id) === wanted; });

    if (wanted != null && !inPage) {
      // The target is older than the newest page. `messages_page` filters on
      // `id_sort < before`, so the anchor is the target plus one — computed
      // with BigInt, which is exact at 18 digits where a double is not.
      var anchor = idPlusOne(wanted);
      if (anchor) {
        var older = await call("archive_messages", { conversationId: cid, limit: PAGE, beforeId: anchor });
        if (mySeq !== state.seq) return;
        if (Array.isArray(older) && older.length) {
          page = older;
          state.anchored = true;
        }
      }
    }

    if (!page.length) {
      state.hasMore = false;
      setTop("");
      msgsEl.appendChild(el("div", "side-empty",
        "Nothing from this conversation has been archived yet. It will fill in as the sync reaches it."));
      updateSub();
      markRead(cid);
      return;
    }

    var oldestFirst = page.slice().reverse();
    appendChunk(oldestFirst);
    state.cursor = String(page[page.length - 1].id);
    if (page.length < PAGE) state.hasMore = false;
    setTop(state.hasMore ? "" : "start");

    if (state.anchored) {
      showBanner("Showing this conversation up to the message you searched for.",
        "Jump to latest", function () { openConversation(cid); });
      updateSub();
      // The anchor is the newest row of an anchored page, so the bottom is it.
      scrollToBottom();
      flashMessage(wanted);
    } else {
      if (wanted) { scrollToBottom(); flashMessage(wanted); }
      else scrollToBottom(true);
      markRead(cid);
    }
    updateSub();
  }

  async function loadOlder() {
    if (state.loading || !state.hasMore || !state.active || state.cursor == null) return;
    state.loading = true;
    setTop("spinner");
    var mySeq = state.seq;
    var cid = state.active;

    var page = await call("archive_messages", { conversationId: cid, limit: PAGE, beforeId: state.cursor });
    if (mySeq !== state.seq) return;

    // A rejected cursor comes back null, not empty. An empty page would read as
    // "start of history" and quietly truncate the thread; say so instead.
    if (page == null) {
      state.hasMore = false;
      state.loading = false;
      setTop("error");
      return;
    }
    page = Array.isArray(page) ? page : [];
    if (!page.length) {
      state.hasMore = false;
      state.loading = false;
      setTop("start");
      return;
    }
    prependChunk(page.slice().reverse());
    state.cursor = String(page[page.length - 1].id);
    if (page.length < PAGE) state.hasMore = false;
    state.loading = false;
    setTop(state.hasMore ? "" : "start");
  }

  // Scrolls to a message that is already loaded; otherwise reopens the
  // conversation anchored on it.
  function goToMessage(id, cid) {
    var key = String(id);
    var node = state.nodeById.get(key);
    if (node && node.isConnected) {
      node.scrollIntoView({ block: "center" });
      flashMessage(key);
      return;
    }
    if (state.msgById.has(key)) {
      // Loaded but its chunk is a spacer right now: bring the chunk back, then
      // scroll once the rows exist.
      for (var i = 0; i < state.chunks.length; i++) {
        var ch = state.chunks[i];
        if (ch.msgs.some(function (m) { return String(m.id) === key; })) {
          materialise(ch);
          var n = state.nodeById.get(key);
          if (n && n.isConnected) { n.scrollIntoView({ block: "center" }); flashMessage(key); }
          return;
        }
      }
    }
    openConversation(cid || state.active, key);
  }

  function flashMessage(id) {
    if (id == null) return;
    var node = state.nodeById.get(String(id));
    if (!node || !node.isConnected) return;
    node.classList.add("flash", "hit");
    node.scrollIntoView({ block: "center" });
    setTimeout(function () { node.classList.remove("flash"); }, 1800);
  }

  function markRead(cid) {
    var c = state.byId[cid];
    if (!c) return;
    var newest = newestLoaded();
    var newestId = (newest && newest.id != null && !newest.__local) ? String(newest.id) : null;

    // Read *before* anything is cleared: server truth can say unread while the
    // local timestamp has not moved since this window last had the thread open,
    // which is exactly the case the old timestamp-only rule got wrong.
    var wasUnread = isUnread(c);

    var stamp = convoStamp(c);
    var already = Number(state.readAt[cid] || 0) >= stamp;
    if (!already) { state.readAt[cid] = stamp; saveReadAt(); }
    clearUnreadLocally(cid, newestId);

    var row = listEl.querySelector('.row[data-cid="' + cssEscape(cid) + '"]');
    if (row) {
      row.classList.remove("unread");
      var badge = row.querySelector(".unread-dot");
      if (badge) badge.remove();
    }

    // Nothing to report if the receipt is already this id and nothing was
    // outstanding — markRead runs on every scroll to the bottom.
    if (!newestId || (already && !wasUnread)) return;
    // Best effort. A failed read receipt is not something the user can act on,
    // so it is logged rather than shown; it is also not a lost message.
    write("client_mark_read", { conversationId: cid, lastReadMessageId: newestId })
      .catch(function (e) { console.warn("client_mark_read failed:", e && e.message); });
  }

  /* ------------------------------ typing ------------------------------- */

  function typingLabel(cid) {
    var m = state.typing.get(cid);
    if (!m || !m.size) return null;
    var now = Date.now();
    var names = [];
    m.forEach(function (v, k) {
      if (v.until <= now) { m.delete(k); return; }
      if (state.selfId && k === state.selfId) return;
      names.push(v.name || "Someone");
    });
    if (!names.length) return null;
    if (names.length === 1) return names[0] + " is typing…";
    if (names.length === 2) return names[0] + " and " + names[1] + " are typing…";
    return names.length + " people are typing…";
  }

  var typingTimer = setInterval(function () {
    if (state.active && state.typing.has(state.active)) updateSub();
  }, 2000);

  /* ============================= composer =============================== */

  var input = $("input"), sendBtn = $("sendBtn"), attachBtn = $("attachBtn");
  var cnote = $("cnote"), ccount = $("ccount"), fileEl = $("file");
  var ctxEl = $("ctx"), ctxTitle = $("ctxTitle"), ctxText = $("ctxText");
  var draftsEl = $("drafts");
  var localSeq = 0;

  // Whether the field has the caret, which is the only thing the keyboard hint
  // in the footer is conditioned on — a permanent hint is furniture.
  var composerFocus = false;

  // An error owns the footer line until it is cleared, and the full text is on
  // the title because the line is deliberately one line and elides.
  function setError(msg) {
    cnote.textContent = msg || "";
    cnote.className = msg ? "grow cerr" : "grow";
    cnote.title = msg || "";
    if (!msg) syncComposer();
  }

  // Mirrors `.composer-box textarea { max-height }`. The field grows with the
  // draft and only starts scrolling once it would take too much of the page.
  var INPUT_MAX_PX = 176;

  function autoGrow() {
    input.style.height = "auto";
    var want = input.scrollHeight;
    input.style.height = Math.min(want, INPUT_MAX_PX) + "px";
    // No scrollbar until it is actually needed; one that appears and vanishes
    // as you type is what made the old box feel cheap.
    input.style.overflowY = want > INPUT_MAX_PX ? "auto" : "hidden";
  }

  // `[...str].length` counts code points, matching the Rust side's `chars()`.
  // `.length` would count UTF-16 units and reject a body of emoji that is well
  // inside the limit.
  function charCount(s) { return Array.from(String(s)).length; }

  function syncComposer() {
    var n = charCount(input.value);
    var over = n > MAX_TEXT;
    ccount.textContent = (n > MAX_TEXT - 150) ? (n + " / " + MAX_TEXT) : "";
    ccount.classList.toggle("over", over);

    var uploading = state.drafts.some(function (d) { return d.uploading; });
    var hasBody = input.value.trim().length > 0 ||
      state.drafts.some(function (d) { return d.url; });
    sendBtn.disabled = state.sending || uploading || over || !hasBody || !state.active;
    attachBtn.disabled = state.sending || !state.active || !!state.editing;

    input.placeholder = state.editing ? "Edit your message" : "Message";
    var sendLabel = state.editing ? "Save the edit" : "Send";
    sendBtn.title = sendLabel;
    sendBtn.setAttribute("aria-label", sendLabel);

    if (cnote.classList.contains("cerr")) return;
    var note = "", hint = false;
    if (state.connected === false) {
      note = "You're offline — messages will fail to send until the connection is back.";
    } else if (uploading) {
      note = "Uploading…";
    } else if (composerFocus) {
      note = state.editing
        ? "Enter saves · Shift+Enter for a new line · Esc cancels"
        : "Enter sends · Shift+Enter for a new line";
      hint = true;
    }
    cnote.className = "grow" + (hint ? " hint" : "");
    cnote.textContent = note;
    cnote.title = "";
  }

  function startReply(m) {
    cancelEdit();
    state.reply = {
      id: String(m.id),
      userId: m.user_id == null ? null : String(m.user_id),
      name: m.name || "Someone",
      text: m.text || (isDeleted(m) ? "Deleted message" : "Attachment")
    };
    ctxTitle.textContent = "Replying to " + state.reply.name;
    ctxText.textContent = String(state.reply.text).replace(/\s+/g, " ");
    ctxEl.classList.add("show");
    setError("");
    input.focus();
    syncComposer();
  }

  function cancelReply() {
    state.reply = null;
    if (!state.editing) ctxEl.classList.remove("show");
  }

  function startEdit(m) {
    cancelReply();
    state.editing = { id: String(m.id), original: m.text == null ? "" : String(m.text) };
    ctxTitle.textContent = "Editing your message";
    ctxText.textContent = state.editing.original.replace(/\s+/g, " ") || "(no text)";
    ctxEl.classList.add("show");
    input.value = state.editing.original;
    autoGrow();
    setError("");
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    syncComposer();
  }

  function cancelEdit() {
    if (state.editing) input.value = "";
    state.editing = null;
    ctxEl.classList.remove("show");
    autoGrow();
    syncComposer();
  }

  function clearDrafts() {
    state.drafts = [];
    draftsEl.textContent = "";
    draftsEl.classList.remove("show");
    syncComposer();
  }

  function renderDrafts() {
    draftsEl.textContent = "";
    state.drafts.forEach(function (d, i) {
      var box = el("div", "draft-att" + (d.error ? " failed" : ""));
      var img = document.createElement("img");
      img.src = d.dataUrl;
      img.alt = "Image to send";
      box.appendChild(img);
      box.appendChild(withIcon(btn("ctx-x", "Remove", function () {
        state.drafts.splice(i, 1);
        renderDrafts();
      }), "x"));
      if (d.uploading) box.appendChild(el("div", "up", "Uploading…"));
      else if (d.error) box.appendChild(el("div", "up", "Failed"));
      draftsEl.appendChild(box);
    });
    // The tray is a section of the field, so it must collapse completely when
    // it is empty rather than leaving a padded strip behind.
    draftsEl.classList.toggle("show", state.drafts.length > 0);
    syncComposer();
  }

  function readAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error("couldn't read the file")); };
      r.readAsDataURL(file);
    });
  }

  function readAsBytes(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(new Uint8Array(r.result)); };
      r.onerror = function () { reject(new Error("couldn't read the file")); };
      r.readAsArrayBuffer(file);
    });
  }

  async function attachFiles(files) {
    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      if (!file || !/^image\//i.test(file.type || "")) {
        setError("Only images can be attached.");
        continue;
      }
      var draft = { url: null, dataUrl: "", uploading: true, error: null };
      state.drafts.push(draft);
      try {
        draft.dataUrl = await readAsDataUrl(file);
        renderDrafts();
        var bytes = await readAsBytes(file);
        // `Vec<u8>` over the IPC bridge: a plain array of numbers is what serde
        // accepts on every Tauri version this app has shipped against.
        var url = await write("client_upload_image", {
          bytes: Array.prototype.slice.call(bytes),
          mime: file.type
        });
        draft.url = String(url);
        draft.uploading = false;
        // Sent images are not in the media cache until the next sync fetches
        // them; the local copy stands in so the bubble is not a placeholder.
        state.localPreview.set(draft.url, draft.dataUrl);
        setError("");
      } catch (e) {
        draft.uploading = false;
        draft.error = true;
        setError(e && e.message ? e.message : "The image couldn't be uploaded.");
      }
      renderDrafts();
    }
  }

  async function doSend() {
    if (state.sending || !state.active) return;
    if (state.editing) return doEditSubmit();

    var text = input.value;
    var atts = state.drafts.filter(function (d) { return d.url; })
      .map(function (d) { return { type: "image", url: d.url }; });
    if (!text.trim() && !atts.length) return;
    if (charCount(text) > MAX_TEXT) {
      setError("That's " + charCount(text) + " characters and GroupMe accepts about " + MAX_TEXT + ".");
      return;
    }

    var cid = state.active;
    var reply = state.reply;
    var keptText = text, keptDrafts = state.drafts.slice();

    // Optimistic row. Its id is deliberately not id-shaped: nothing compares it
    // against a real GroupMe id, and it is replaced by the server's copy — the
    // `source_guid` echo is what makes that match reliable on the Rust side.
    var localId = "local:" + (++localSeq);
    var optimistic = {
      id: localId,
      __local: true,
      __pending: true,
      user_id: state.selfId,
      name: state.accountName || "You",
      text: text,
      created_at: nowSecs(),
      system: false,
      attachments: atts.slice(),
      reactions: [],
      favorited_by: []
    };
    if (reply) {
      optimistic.attachments.push({ type: "reply", reply_id: reply.id, base_reply_id: reply.id,
        user_id: reply.userId || undefined });
    }

    state.sending = true;
    input.value = "";
    autoGrow();
    clearDrafts();
    cancelReply();
    setError("");
    syncComposer();
    appendLive(optimistic);
    scrollToBottom();

    var args = {
      conversationId: cid,
      kind: state.activeKind,
      text: text,
      attachments: atts.length ? atts : null,
      replyTo: reply ? reply.id : null,
      replyToUserId: reply ? reply.userId : null
    };

    try {
      var sent = await write("client_send_message", args);
      state.sending = false;
      if (sent && sent.user_id != null) rememberSelf(String(sent.user_id));
      if (state.active === cid && sent) {
        replaceMessage(sent, localId);
        touchConversation(cid, sent.text || (atts.length ? "sent a photo" : ""), Number(sent.created_at) || nowSecs());
        state.readAt[cid] = convoStamp(state.byId[cid] || {});
        saveReadAt();
        // Sending is reading. Ids stay strings.
        clearUnreadLocally(cid, sent.id == null ? null : String(sent.id));
      }
      syncComposer();
    } catch (e) {
      state.sending = false;
      // Nothing is lost and nothing is silently dropped: the optimistic row
      // goes away, the text and attachments come back, and the reason is
      // printed under the box where the retry lives.
      if (state.active === cid) removeMessage(localId);
      input.value = keptText;
      state.drafts = keptDrafts;
      renderDrafts();
      autoGrow();
      if (reply) startReply({ id: reply.id, user_id: reply.userId, name: reply.name, text: reply.text });
      setError((e && e.message ? e.message : "The message couldn't be sent") + " — press send to try again.");
      syncComposer();
    }
  }

  async function doEditSubmit() {
    var editing = state.editing;
    if (!editing) return;
    var text = input.value;
    if (!text.trim()) { setError("An edited message can't be empty. Delete it instead."); return; }
    if (charCount(text) > MAX_TEXT) {
      setError("That's " + charCount(text) + " characters and GroupMe accepts about " + MAX_TEXT + ".");
      return;
    }
    if (state.activeKind !== "group") {
      setError("GroupMe doesn't support editing direct messages.");
      return;
    }
    state.sending = true;
    syncComposer();
    try {
      var updated = await write("client_edit_message", {
        groupId: state.active, messageId: editing.id, text: text
      });
      state.sending = false;
      cancelEdit();
      if (updated) replaceMessage(updated);
      setError("");
      toast("Message edited");
    } catch (e) {
      state.sending = false;
      setError(e && e.message ? e.message : "The edit couldn't be saved.");
      syncComposer();
    }
  }

  async function doDelete(m) {
    var cid = state.active;
    try {
      await write("client_delete_message", { conversationId: cid, messageId: String(m.id) });
      m.deleted_at = nowSecs();
      replaceMessage(m);
      toast("Message deleted");
    } catch (e) {
      toast(e && e.message ? e.message : "The message couldn't be deleted.", true);
    }
  }

  async function doReact(m, code) {
    try {
      var reactions = await write("client_react", {
        conversationId: state.active, messageId: String(m.id), code: code == null ? null : String(code)
      });
      if (Array.isArray(reactions)) m.reactions = reactions;
      else if (code == null && state.selfId) {
        var favs = Array.isArray(m.favorited_by) ? m.favorited_by.slice() : [];
        if (favs.indexOf(state.selfId) < 0) favs.push(state.selfId);
        m.favorited_by = favs;
      }
      replaceMessage(m);
    } catch (e) {
      toast(e && e.message ? e.message : "The reaction couldn't be added.", true);
    }
  }

  async function doUnreact(m) {
    try {
      var reactions = await write("client_unreact", {
        conversationId: state.active, messageId: String(m.id)
      });
      if (Array.isArray(reactions)) m.reactions = reactions;
      if (state.selfId && Array.isArray(m.favorited_by)) {
        m.favorited_by = m.favorited_by.filter(function (u) { return String(u) !== state.selfId; });
      }
      replaceMessage(m);
    } catch (e) {
      toast(e && e.message ? e.message : "The reaction couldn't be removed.", true);
    }
  }

  /* ============================= popovers =============================== */

  var scrim = $("scrim"), emojiPop = $("emojiPop"), menuPop = $("menuPop");
  var datePop = $("datePop"), convSheet = $("convSheet");

  function closePops() {
    emojiPop.classList.remove("show");
    menuPop.classList.remove("show");
    datePop.classList.remove("show");
    convSheet.classList.remove("show");
    scrim.classList.remove("show");
  }

  function placePop(pop, anchor) {
    pop.classList.add("show");
    scrim.classList.add("show");
    var a = anchor.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(8, a.left), window.innerWidth - w - 8);
    var top = a.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, a.top - h - 6);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function openEmojiPicker(anchor, m) {
    emojiPop.textContent = "";
    REACTIONS.forEach(function (code) {
      var b = el("button", null, code);
      b.type = "button";
      b.setAttribute("aria-label", "React with " + code);
      b.addEventListener("click", function () { closePops(); doReact(m, code); });
      emojiPop.appendChild(b);
    });
    var like = el("button", null, "👌");
    like.type = "button";
    like.title = "Plain like";
    like.setAttribute("aria-label", "Like");
    like.addEventListener("click", function () { closePops(); doReact(m, null); });
    emojiPop.appendChild(like);
    placePop(emojiPop, anchor);
  }

  function menuItem(label, iconName, onClick, danger) {
    var b = el("button", danger ? "danger" : null);
    b.type = "button";
    b.appendChild(icon(iconName));
    b.appendChild(el("span", null, label));
    b.addEventListener("click", function () { closePops(); onClick(); });
    return b;
  }

  function openMessageMenu(anchor, m) {
    menuPop.textContent = "";
    menuPop.appendChild(menuItem("Reply", "reply", function () { startReply(m); }));
    if (m.text) menuPop.appendChild(menuItem("Copy text", "copy", function () { copyText(String(m.text)); }));

    var own = canActOn(m) && !isDeleted(m) && !m.__local;
    if (own && state.activeKind === "group") {
      menuPop.appendChild(menuItem("Edit", "edit", function () { startEdit(m); }));
    }
    if (own) {
      menuPop.appendChild(document.createElement("hr"));
      menuPop.appendChild(menuItem("Delete", "trash", function () { confirmDelete(m); }, true));
    }
    placePop(menuPop, anchor);
  }

  // Two-step rather than a modal: the second click is the confirmation, and it
  // cannot be reached by the same reflex that opened the menu.
  function confirmDelete(m) {
    showBanner("Delete this message for everyone? This can't be undone.", "Delete", function () {
      showBanner(null);
      doDelete(m);
    });
  }

  function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast("Copied"); },
          function () { toast("Couldn't copy", true); });
        return;
      }
    } catch (e) { /* fall through */ }
    toast("Copying isn't available here", true);
  }

  /* ============================== search ================================
     The reason this client exists. FTS5 over every archived message, with the
     match highlighted and a jump straight into the conversation at that
     point — which the web app cannot do at all.                            */

  var qEl = $("q"), searchWrap = $("searchWrap");
  var searchTimer = null, searchSeq = 0;

  function searchActive() { return qEl.value.trim().length > 0; }

  function snippet(text, q) {
    var t = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
    if (!q) return t.slice(0, 200);
    var i = t.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return t.slice(0, 200);
    var start = Math.max(0, i - 50);
    var end = Math.min(t.length, start + 200);
    return (start > 0 ? "…" : "") + t.slice(start, end) + (end < t.length ? "…" : "");
  }

  // Highlighting builds text nodes and <mark> elements. The matched text is
  // still untrusted, so it is set with textContent like everything else.
  function highlightInto(node, text, q) {
    var t = String(text == null ? "" : text);
    var needle = String(q || "").toLowerCase();
    if (!needle) { node.appendChild(document.createTextNode(t)); return node; }
    var lower = t.toLowerCase(), pos = 0;
    for (;;) {
      var i = lower.indexOf(needle, pos);
      if (i < 0) break;
      if (i > pos) node.appendChild(document.createTextNode(t.slice(pos, i)));
      var mk = document.createElement("mark");
      mk.textContent = t.slice(i, i + needle.length);
      node.appendChild(mk);
      pos = i + needle.length;
    }
    node.appendChild(document.createTextNode(t.slice(pos)));
    return node;
  }

  function onSearchInput() {
    clearTimeout(searchTimer);
    var q = qEl.value.trim();
    if (!q) { searchWrap.classList.remove("busy"); renderConversations(); return; }
    searchWrap.classList.add("busy");
    searchTimer = setTimeout(function () { runSearch(q); }, 220);
  }

  async function runSearch(q) {
    var mine = ++searchSeq;
    var hits = await call("archive_search", { query: q, limit: 100 });
    if (mine !== searchSeq || qEl.value.trim() !== q) return;
    renderSearchResults(Array.isArray(hits) ? hits : [], q);
  }

  // Set as an index rather than a second conversation list: a numbered entry,
  // the volume it came from, the hand that wrote it, the passage with the term
  // marked, and a stated way into the thread at that point.
  function renderSearchResults(hits, query) {
    listEl.textContent = "";
    var label = el("div", "list-label", hits.length ? "Results" : "No results");
    if (hits.length) {
      label.appendChild(el("span", "sub",
        hits.length >= 100 ? "first 100" : hits.length + (hits.length === 1 ? " match" : " matches")));
    }
    listEl.appendChild(label);

    if (!hits.length) {
      listEl.appendChild(el("div", "side-empty", "Nothing in the archive matches that."));
      return;
    }

    var frag = document.createDocumentFragment();
    hits.forEach(function (h, i) {
      var cid = fld(h, "conversation_id", "conversationId");
      var mid = fld(h, "message_id", "messageId");
      var cname = fld(h, "conversation_name", "conversationName") ||
        (cid != null && state.byId[cid] && state.byId[cid].name) || "Conversation";
      var sender = fld(h, "sender_name", "senderName") || "Someone";
      var when = fld(h, "created_at", "createdAt");
      var n = i + 1;

      var row = el("button", "row hit-row");
      row.type = "button";
      row.setAttribute("role", "listitem");
      // Entry number, not an avatar: this is an index, and the sender is named
      // on its own line below. Ordinary small integers, so String() is exact.
      row.appendChild(el("div", "hit-n", n < 100 ? ("0" + n).slice(-2) : String(n)));

      var body = el("div", "row-body");
      var top = el("div", "row-top");
      top.appendChild(el("div", "row-name", cname));
      top.appendChild(el("div", "hit-when", relTime(when)));
      body.appendChild(top);
      body.appendChild(el("div", "hit-who", sender));
      body.appendChild(highlightInto(el("div", "hit-text"), snippet(h.text, query), query));

      var jump = el("div", "hit-jump");
      jump.appendChild(el("span", null, "Jump to context"));
      jump.appendChild(icon("back"));
      body.appendChild(jump);
      row.appendChild(body);

      row.addEventListener("click", function () {
        if (cid == null) return;
        // Ids stay strings the whole way through: query -> hit -> cursor.
        if (String(cid) === String(state.active) && mid != null) goToMessage(String(mid), String(cid));
        else openConversation(String(cid), mid == null ? null : String(mid));
      });
      frag.appendChild(row);
    });
    listEl.appendChild(frag);
  }

  function clearSearch() {
    qEl.value = "";
    clearTimeout(searchTimer);
    searchSeq++;
    searchWrap.classList.remove("busy");
    renderConversations();
  }

  /* ===================== per-conversation actions =======================
     Pin / reorder pins / mute / leave / block. Each write applies optimistically
     for a responsive toggle, then confirms over IPC; on a filtered network the
     command rejects with a string and the change is reverted and surfaced. A
     write that silently did nothing is the outcome this app most wants to avoid. */

  function setBlocked(uid, v) {
    if (uid == null) return;
    if (v) blockedUsers[String(uid)] = true; else delete blockedUsers[String(uid)];
  }

  // Re-paints wherever the changed conversation is shown: the sidebar sections,
  // and the settings sheet if it is open on this conversation.
  function afterConvChange(c) {
    if (!searchActive()) renderConversations();
    if (convSheet.classList.contains("show") && sheetCid != null &&
        (c == null || String(c.id) === String(sheetCid))) renderSheet();
  }

  function commitConv(apply, revert, cmd, args, okMsg) {
    apply();
    write(cmd, args).then(function () {
      if (okMsg) toast(okMsg);
    }, function (e) {
      revert();
      toast((e && e.message) ? e.message : "That didn't work — check your connection.", true);
    });
  }

  function togglePin(c) {
    var was = pinRankOf(c);
    if (was != null) {
      commitConv(
        function () { c.pin_rank = null; afterConvChange(c); },
        function () { c.pin_rank = was; afterConvChange(c); },
        "client_set_pin", { conversationId: String(c.id), rank: null }, "Unpinned");
    } else {
      var rank = pinnedSorted().length; // append at the end of the pin order
      commitConv(
        function () { c.pin_rank = rank; afterConvChange(c); },
        function () { c.pin_rank = null; afterConvChange(c); },
        "client_set_pin", { conversationId: String(c.id), rank: rank }, "Pinned");
    }
  }

  function toggleMute(c) {
    var was = isMuted(c);
    commitConv(
      function () { c.muted = !was; afterConvChange(c); },
      function () { c.muted = was; afterConvChange(c); },
      "client_set_mute", { conversationId: String(c.id), muted: !was },
      was ? "Unmuted" : "Muted");
  }

  // Moves a pinned conversation one slot within the pin order and persists the
  // whole order, so ranks stay 0..n-1 with no gaps or collisions.
  function movePin(c, dir) {
    var pins = pinnedSorted();
    var i = pins.findIndex(function (p) { return String(p.id) === String(c.id); });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= pins.length) return;
    var reordered = pins.slice();
    var tmp = reordered[i]; reordered[i] = reordered[j]; reordered[j] = tmp;
    var prev = pins.map(function (p) { return { c: p, rank: pinRankOf(p) }; });
    commitConv(
      function () { reordered.forEach(function (p, k) { p.pin_rank = k; }); afterConvChange(null); },
      function () { prev.forEach(function (o) { o.c.pin_rank = o.rank; }); afterConvChange(null); },
      "client_reorder_pins", { orderedIds: reordered.map(function (p) { return String(p.id); }) });
  }

  function leaveGroup(c) {
    write("client_leave_group", { groupId: String(c.id) }).then(function () {
      removeConversation(c.id);
      toast("Left the group");
    }, function (e) {
      toast((e && e.message) ? e.message : "Couldn't leave the group.", true);
    });
  }

  function removeConversation(cid) {
    var c = state.byId[cid];
    delete state.byId[cid];
    var i = state.convos.indexOf(c);
    if (i >= 0) state.convos.splice(i, 1);
    if (String(state.active) === String(cid)) {
      state.active = null;
      threadEl.classList.remove("show");
      emptyEl.classList.remove("hide");
      app.classList.remove("thread-open");
      closeFind();
    }
    if (convSheet.classList.contains("show") && String(sheetCid) === String(cid)) closePops();
    if (!searchActive()) renderConversations();
  }

  function doBlock(c, blocked) {
    var uid = dmOtherUserId(c);
    if (uid == null) { toast("Couldn't tell who to block.", true); return; }
    commitConv(
      function () { setBlocked(uid, blocked); afterConvChange(c); },
      function () { setBlocked(uid, !blocked); afterConvChange(c); },
      "client_set_block", { userId: String(uid), blocked: !!blocked },
      blocked ? "Blocked" : "Unblocked");
  }

  function blockMember(uid, name, blocked) {
    if (uid == null) return;
    commitConv(
      function () { setBlocked(uid, blocked); if (sheetCid != null && convSheet.classList.contains("show")) renderSheet(); },
      function () { setBlocked(uid, !blocked); if (sheetCid != null && convSheet.classList.contains("show")) renderSheet(); },
      "client_set_block", { userId: String(uid), blocked: !!blocked },
      blocked ? ("Blocked " + shortName(name)) : ("Unblocked " + shortName(name)));
  }

  /* ---------- the sidebar row overflow menu ---------- */

  function openConvMenu(anchor, c) {
    var pinned = isPinned(c), muted = isMuted(c);
    menuPop.textContent = "";

    menuPop.appendChild(menuItem(pinned ? "Unpin" : "Pin to top", "pin", function () { togglePin(c); }));
    if (pinned) {
      var pins = pinnedSorted();
      var idx = pins.findIndex(function (p) { return String(p.id) === String(c.id); });
      if (idx > 0) menuPop.appendChild(menuItem("Move up", "up", function () { movePin(c, -1); }));
      if (idx >= 0 && idx < pins.length - 1) menuPop.appendChild(menuItem("Move down", "caret", function () { movePin(c, 1); }));
    }
    menuPop.appendChild(menuItem(muted ? "Unmute" : "Mute", muted ? "bell" : "bell-off", function () { toggleMute(c); }));
    menuPop.appendChild(menuItem("Settings…", "cog", function () { openConvSettings(String(c.id)); }));

    menuPop.appendChild(document.createElement("hr"));
    if (c.kind === "group") {
      menuPop.appendChild(menuItem("Leave group", "leave", function () { confirmLeave(anchor, c); }, true));
    } else {
      var uid = dmOtherUserId(c);
      var blocked = isBlocked(uid);
      menuPop.appendChild(menuItem((blocked ? "Unblock " : "Block ") + shortName(convoTitle(c)), "block",
        function () { if (blocked) doBlock(c, false); else confirmBlock(anchor, c); }, true));
    }
    placePop(menuPop, anchor);
  }

  function confirmPop(anchor, message, actionLabel, fn) {
    menuPop.textContent = "";
    var box = el("div", "confirm");
    box.appendChild(el("div", "confirm-msg", message));
    var row = el("div", "confirm-row");
    var cancel = el("button", "confirm-btn", "Cancel");
    cancel.type = "button";
    cancel.addEventListener("click", closePops);
    var ok = el("button", "confirm-btn danger", actionLabel);
    ok.type = "button";
    ok.addEventListener("click", function () { closePops(); fn(); });
    row.appendChild(cancel); row.appendChild(ok);
    box.appendChild(row);
    menuPop.appendChild(box);
    placePop(menuPop, anchor);
  }

  function confirmLeave(anchor, c) {
    confirmPop(anchor, "Leave “" + convoTitle(c) + "”? You'll stop receiving its messages.",
      "Leave", function () { leaveGroup(c); });
  }
  function confirmBlock(anchor, c) {
    confirmPop(anchor, "Block " + convoTitle(c) + "? They won't be able to message you.",
      "Block", function () { doBlock(c, true); });
  }

  /* ================= conversation settings sheet ========================
     Clicking the header identity (avatar or name) or the gear opens this. For a
     group it shows the whole roster from `client_group_detail` plus the actions;
     for a DM it is a lighter panel — the other person, mute and block. */

  var sheetCid = null, sheetFilter = "", sheetConfirmMode = null;
  var MEMBER_CAP = 300;

  function openConvSettings(cid) {
    var c = state.byId[cid];
    if (!c) return;
    closePops();
    sheetCid = String(cid);
    sheetFilter = "";
    sheetConfirmMode = null;
    renderSheet();
    convSheet.classList.add("show");
    scrim.classList.add("show");
    if (c.kind === "group" && !groupDetailCache[sheetCid]) loadGroupDetail(sheetCid);
  }

  function loadGroupDetail(cid) {
    call("client_group_detail", { groupId: String(cid) }).then(function (g) {
      // `call` swallows a failure to null; store a sentinel so the panel shows
      // the graceful "directory blocked" note rather than a permanent spinner.
      groupDetailCache[String(cid)] = g || { __failed: true };
      if (sheetCid === String(cid) && convSheet.classList.contains("show")) renderSheet();
    });
  }

  function sheetSubText(c) {
    if (c.kind !== "group") return "Direct message";
    var g = groupDetailCache[String(c.id)];
    var n = null;
    if (g && Array.isArray(g.members)) n = g.members.length;
    else { var mc = fld(c, "members_count", "membersCount"); if (mc != null && Number(mc) > 0) n = Number(mc); }
    return n != null ? ("Group · " + n.toLocaleString() + (n === 1 ? " member" : " members")) : "Group";
  }

  function sheetAct(label, iconName, on, danger, fn) {
    var b = el("button", "sheet-act" + (on ? " on" : "") + (danger ? " danger" : ""));
    b.type = "button";
    b.appendChild(icon(iconName));
    b.appendChild(el("span", null, label));
    b.addEventListener("click", fn);
    return b;
  }

  function renderSheet() {
    if (sheetCid == null) return;
    var c = state.byId[sheetCid];
    if (!c) { closePops(); return; }
    var isGroup = c.kind === "group";
    convSheet.textContent = "";

    var head = el("div", "sheet-head");
    head.appendChild(makeAvatar(convoTitle(c), fld(c, "image_url", "imageUrl"), c.id,
      "hd" + (isGroup ? " square" : "")));
    var ht = el("div", "sheet-headtext");
    ht.appendChild(el("div", "sheet-title", convoTitle(c)));
    ht.appendChild(el("div", "sheet-sub", sheetSubText(c)));
    head.appendChild(ht);
    var x = btn("sheet-x", "Close", closePops);
    x.appendChild(icon("x"));
    head.appendChild(x);
    convSheet.appendChild(head);

    var body = el("div", "sheet-body");

    var acts = el("div", "sheet-actions");
    var pinned = isPinned(c), muted = isMuted(c);
    acts.appendChild(sheetAct(pinned ? "Unpin" : "Pin", "pin", pinned, false, function () { togglePin(c); }));
    acts.appendChild(sheetAct(muted ? "Unmute" : "Mute", muted ? "bell" : "bell-off", muted, false, function () { toggleMute(c); }));
    if (pinned) {
      var pins = pinnedSorted();
      var idx = pins.findIndex(function (p) { return String(p.id) === String(c.id); });
      if (idx > 0) acts.appendChild(sheetAct("Move up", "up", false, false, function () { movePin(c, -1); }));
      if (idx >= 0 && idx < pins.length - 1) acts.appendChild(sheetAct("Move down", "caret", false, false, function () { movePin(c, 1); }));
    }
    if (isGroup) {
      acts.appendChild(sheetAct("Leave group", "leave", false, true, function () { sheetConfirmMode = "leave"; renderSheet(); }));
    } else {
      var uid = dmOtherUserId(c);
      var blocked = isBlocked(uid);
      acts.appendChild(sheetAct(blocked ? "Unblock" : "Block", "block", blocked, true, function () {
        if (blocked) doBlock(c, false); else { sheetConfirmMode = "block"; renderSheet(); }
      }));
    }
    body.appendChild(acts);

    if (sheetConfirmMode) body.appendChild(buildSheetConfirm(c));

    if (isGroup) body.appendChild(buildMembers(c));
    else body.appendChild(dmNote(c));

    convSheet.appendChild(body);
  }

  function buildSheetConfirm(c) {
    var band = el("div", "sheet-confirm");
    band.appendChild(el("span", "grow",
      sheetConfirmMode === "leave" ? ("Leave “" + convoTitle(c) + "”?") : ("Block " + convoTitle(c) + "?")));
    var cancel = el("button", null, "Cancel"); cancel.type = "button";
    cancel.addEventListener("click", function () { sheetConfirmMode = null; renderSheet(); });
    var go = el("button", "go", sheetConfirmMode === "leave" ? "Leave" : "Block"); go.type = "button";
    go.addEventListener("click", function () {
      var mode = sheetConfirmMode; sheetConfirmMode = null;
      if (mode === "leave") leaveGroup(c); else doBlock(c, true);
      renderSheet();
    });
    band.appendChild(cancel); band.appendChild(go);
    return band;
  }

  function dmNote(c) {
    var uid = dmOtherUserId(c);
    return el("div", "sheet-note", isBlocked(uid)
      ? "You've blocked this person. Unblock to exchange messages again."
      : "A direct conversation. Mute silences its notifications; Block stops their messages.");
  }

  function memberName(m) {
    return String(fld(m, "nickname", "name") || "Member");
  }

  function topRole(m) {
    var roles = fld(m, "roles");
    if (!Array.isArray(roles)) return null;
    var lower = roles.map(function (r) { return String(r).toLowerCase(); });
    if (lower.indexOf("owner") >= 0) return "Owner";
    if (lower.indexOf("admin") >= 0) return "Admin";
    return null;
  }

  function memberRow(m, nm) {
    var row = el("div", "member");
    row.appendChild(makeAvatar(nm, fld(m, "image_url", "imageUrl", "avatar_url", "avatarUrl"),
      fld(m, "user_id", "userId") || nm, "sm"));
    var tx = el("div", "member-text");
    tx.appendChild(el("div", "member-name", nm));
    var realName = fld(m, "name"), nick = fld(m, "nickname");
    if (nick && realName && String(nick) !== String(realName)) {
      tx.appendChild(el("div", "member-sub", String(realName)));
    }
    row.appendChild(tx);

    var role = topRole(m);
    if (role) row.appendChild(el("span", "member-role" + (role === "Owner" ? " owner" : ""), role));

    var uid = fld(m, "user_id", "userId");
    if (uid != null && (!state.selfId || String(uid) !== state.selfId)) {
      var blocked = isBlocked(uid);
      var bb = btn("member-block" + (blocked ? " on" : ""),
        (blocked ? "Unblock " : "Block ") + nm, function (e) {
          e.stopPropagation();
          blockMember(String(uid), nm, !blocked);
        });
      bb.appendChild(icon("block"));
      row.appendChild(bb);
    }
    return row;
  }

  function fillMembers(list, members, needle) {
    list.textContent = "";
    var shown = 0, matched = 0;
    for (var i = 0; i < members.length; i++) {
      var m = members[i];
      var nm = memberName(m);
      if (needle && nm.toLowerCase().indexOf(needle) < 0) {
        var real = fld(m, "name");
        if (!(real && String(real).toLowerCase().indexOf(needle) >= 0)) continue;
      }
      matched++;
      if (shown >= MEMBER_CAP) continue;
      list.appendChild(memberRow(m, nm));
      shown++;
    }
    if (!matched) {
      list.appendChild(el("div", "sheet-note", needle ? "No members match that." : "No members to show."));
    } else if (matched > shown) {
      list.appendChild(el("div", "sheet-note",
        "Showing " + shown.toLocaleString() + " of " + matched.toLocaleString() + " — narrow the filter to find someone."));
    }
  }

  function refreshMembers(c) {
    var list = $("membersList");
    if (!list) return;
    var g = groupDetailCache[String(c.id)];
    var members = g && Array.isArray(g.members) ? g.members : [];
    fillMembers(list, members, sheetFilter.trim().toLowerCase());
  }

  function buildMembers(c) {
    var wrap = document.createDocumentFragment();
    var g = groupDetailCache[String(c.id)];

    if (!g) {
      var note = el("div", "sheet-note");
      var sp = el("div", "spinner");
      sp.setAttribute("role", "status");
      sp.setAttribute("aria-label", "Loading members");
      note.appendChild(sp);
      wrap.appendChild(note);
      return wrap;
    }
    var members = Array.isArray(g.members) ? g.members : null;
    if (!members) {
      wrap.appendChild(el("div", "sheet-note",
        "The member list couldn't be loaded — the group directory is currently blocked by a network filter. The conversation itself is fully readable and searchable."));
      return wrap;
    }

    var sec = el("div", "sheet-sec", "Members");
    sec.appendChild(el("span", "cnt", members.length.toLocaleString()));
    wrap.appendChild(sec);

    if (members.length > 12) {
      var fbox = el("div", "member-filter");
      var fin = el("input");
      fin.type = "search";
      fin.placeholder = "Filter members";
      fin.value = sheetFilter;
      fin.setAttribute("aria-label", "Filter members");
      fin.addEventListener("input", function () { sheetFilter = fin.value; refreshMembers(c); });
      fbox.appendChild(fin);
      wrap.appendChild(fbox);
    }

    var list = el("div", "members");
    list.id = "membersList";
    fillMembers(list, members, sheetFilter.trim().toLowerCase());
    wrap.appendChild(list);
    return wrap;
  }

  /* ===================== in-conversation find ===========================
     Keyword search scoped to the open thread via `archive_search` with a
     conversation id. Results jump to the message in its transcript context. */

  var findbarEl = $("findbar"), findqEl = $("findq"), findResultsEl = $("findResults"),
      findCountEl = $("findCount");
  var findTimer = null, findSeq = 0, findHits = [], findSel = -1;

  function openFind() {
    if (!state.active) return;
    findbarEl.classList.add("show");
    findqEl.focus();
    findqEl.select();
  }
  function closeFind() {
    findbarEl.classList.remove("show");
    findResultsEl.classList.remove("show");
    findResultsEl.textContent = "";
    findqEl.value = "";
    findCountEl.textContent = "";
    findHits = []; findSel = -1; findSeq++;
    clearTimeout(findTimer);
  }
  function toggleFind() {
    if (findbarEl.classList.contains("show")) closeFind(); else openFind();
  }

  function onFindInput() {
    clearTimeout(findTimer);
    var q = findqEl.value.trim();
    if (!q) {
      findResultsEl.classList.remove("show");
      findResultsEl.textContent = "";
      findCountEl.textContent = "";
      findHits = []; findSel = -1;
      return;
    }
    findTimer = setTimeout(function () { runFind(q); }, 200);
  }

  async function runFind(q) {
    if (!state.active) return;
    var mine = ++findSeq;
    var cid = state.active;
    var hits = await call("archive_search", { query: q, conversationId: cid, limit: 60 });
    if (mine !== findSeq || findqEl.value.trim() !== q || state.active !== cid) return;
    findHits = Array.isArray(hits) ? hits : [];
    findSel = findHits.length ? 0 : -1;
    renderFindResults(q);
  }

  function renderFindResults(q) {
    findResultsEl.textContent = "";
