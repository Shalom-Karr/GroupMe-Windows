    if (!findHits.length) {
      findResultsEl.appendChild(el("div", "find-empty", "No matches in this conversation."));
      findCountEl.textContent = "0";
      findResultsEl.classList.add("show");
      updateFindNav();
      return;
    }
    findHits.forEach(function (h, i) {
      var sender = fld(h, "sender_name", "senderName") || "Someone";
      var when = fld(h, "created_at", "createdAt");
      var b = el("button", "find-result" + (i === findSel ? " sel" : ""));
      b.type = "button";
      b.setAttribute("role", "option");
      var top = el("div", "fr-top");
      top.appendChild(el("span", "fr-who", sender));
      top.appendChild(el("span", "fr-when", relTime(when)));
      b.appendChild(top);
      b.appendChild(highlightInto(el("div", "fr-text"), snippet(h.text, q), q));
      b.addEventListener("click", function () { findSel = i; jumpToFindHit(); });
      findResultsEl.appendChild(b);
    });
    findResultsEl.classList.add("show");
    updateFindNav();
  }

  function updateFindNav() {
    $("findPrev").disabled = findSel <= 0;
    $("findNext").disabled = findSel < 0 || findSel >= findHits.length - 1;
    if (findHits.length && findSel >= 0) {
      findCountEl.textContent = (findSel + 1) + " / " + (findHits.length >= 60 ? "60+" : findHits.length);
    } else if (findHits.length) {
      findCountEl.textContent = findHits.length >= 60 ? "60+" : String(findHits.length);
    }
  }

  function paintFindSel() {
    var nodes = findResultsEl.querySelectorAll(".find-result");
    for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle("sel", i === findSel);
    if (nodes[findSel]) nodes[findSel].scrollIntoView({ block: "nearest" });
  }

  function stepFind(dir) {
    if (!findHits.length) return;
    var next = findSel + dir;
    if (next < 0 || next >= findHits.length) return;
    findSel = next;
    paintFindSel();
    updateFindNav();
    jumpToFindHit();
  }

  function jumpToFindHit() {
    if (findSel < 0 || findSel >= findHits.length) return;
    var h = findHits[findSel];
    var mid = fld(h, "message_id", "messageId");
    var cid = fld(h, "conversation_id", "conversationId") || state.active;
    if (mid == null) return;
    paintFindSel();
    updateFindNav();
    // Ids stay strings the whole way. goToMessage scrolls if the row is loaded,
    // otherwise reopens the conversation anchored on it.
    goToMessage(String(mid), String(cid));
  }

  /* ===================== jump to a date =================================
     A native date control; the chosen day is resolved to a message id via
     `archive_message_near_date`, then opened as an anchored view. */

  var datePickEl = null;

  function ensureDatePop() {
    if (datePickEl) return;
    datePop.textContent = "";
    datePop.appendChild(el("div", "dp-label", "Jump to on or before"));
    datePickEl = el("input");
    datePickEl.type = "date";
    datePickEl.setAttribute("aria-label", "Choose a date");
    datePop.appendChild(datePickEl);
    var go = el("button", "dp-go", "Go to date");
    go.type = "button";
    go.addEventListener("click", jumpToDate);
    datePop.appendChild(go);
    datePickEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); jumpToDate(); }
    });
  }

  function openDatePop(anchor) {
    if (!state.active) return;
    ensureDatePop();
    placePop(datePop, anchor);
    setTimeout(function () { try { datePickEl.focus(); } catch (e) { /* ignore */ } }, 0);
  }

  async function jumpToDate() {
    if (!datePickEl || !datePickEl.value || !state.active) { closePops(); return; }
    var parts = datePickEl.value.split("-");
    // Local end of the chosen day, in epoch seconds — an ordinary number, not an
    // id — so the newest message on that day or earlier is returned.
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 23, 59, 59);
    var beforeUnix = Math.floor(d.getTime() / 1000);
    var cid = state.active;
    closePops();
    var mid = await call("archive_message_near_date", { conversationId: cid, beforeUnix: beforeUnix });
    if (mid == null) { toast("No messages on or before that date."); return; }
    openConversation(cid, String(mid));
  }

  /* ============================== realtime =============================== */

  /* ---------- the header pill ----------

     Two signals, one pill, and connectivity outranks the socket.

     `realtime://state` describes the websocket. Its `unauthorized` status is
     *latched* in Rust: `Worker::run` publishes it and returns, because retrying
     a refused token cannot succeed — so nothing will ever supersede that value
     for the life of the process. Painting it directly meant that hours later,
     on an ordinary network drop, the header still read UNAUTHORIZED: wrong,
     because the socket is not the reason nothing is arriving, and alarming in a
     way "offline" is not.

     So the socket is consulted only while the app is online. Offline is decided
     by the Rust connectivity monitor (which probes) or by `navigator.onLine`,
     and either one saying so is enough. An auth problem can therefore only be
     shown when there is a working connection for the credential to have been
     refused over — which is the only situation in which it is actionable.    */

  function isOffline() {
    return state.net === "offline" || navigator.onLine === false;
  }

  var AUTH_STATUS = /^(unauthorized|unauthorised|unauthenticated|forbidden|invalid[_ -]?token|signed[_ -]?out)$/;

  function classifyRt(a) {
    var raw = String(a.label == null ? "" : a.label).toLowerCase().trim();
    var auth = !a.connected && AUTH_STATUS.test(raw);
    var label;
    // Short on purpose: the pill sits between the wordmark and the UI toggle in
    // a 292 px sidebar. The whole explanation is on the pill's title.
    if (a.connected) label = "Live";
    else if (auth) label = "Sign in";
    else if (raw === "connecting") label = "Connecting";
    else if (raw === "disconnected" || raw === "closed") label = "Reconnecting";
    else label = a.label ? String(a.label) : "Offline";
    return { connected: !!a.connected, auth: auth, label: label, raw: raw };
  }

  function paintConn() {
    var rt = state.rt;
    var connected, label, tone, title;

    if (!HAS_IPC) {
      connected = null; tone = null; label = "Preview";
      title = "Opened outside the app, so this is preview data.";
    } else if (isOffline()) {
      // Ahead of every socket state, including a latched auth failure.
      connected = false; tone = "down"; label = "Offline";
      title = "No connection. Every archived message is still readable here; " +
              "sending will fail until you are back online.";
    } else if (rt && rt.auth) {
      connected = false; tone = "down"; label = "Sign in";
      title = "GroupMe refused the saved session, so nothing new will arrive. " +
              "Switch to the GroupMe web UI once to sign in again. Everything " +
              "already archived is still readable here.";
    } else if (state.net === "degraded" && !(rt && rt.connected)) {
      connected = false; tone = "warn"; label = "Unstable";
      title = "The connection is dropping requests. Reading is local and " +
              "unaffected; sending may fail.";
    } else if (!rt) {
      connected = null; tone = null; label = "Connecting";
      title = "Opening the realtime connection.";
    } else {
      connected = rt.connected;
      // "Connecting" is a transient state on the way to working, so it is not
      // painted in the alarm colour.
      tone = rt.connected ? "live" : (rt.raw === "connecting" ? null : "down");
      label = rt.label;
      title = rt.connected
        ? "Connected — new messages arrive as they are sent"
        : "Not connected — you can read everything, but sending will fail";
    }

    state.connected = connected;
    var pill = $("conn");
    pill.classList.toggle("live", tone === "live");
    pill.classList.toggle("down", tone === "down");
    pill.classList.toggle("warn", tone === "warn");
    $("connText").textContent = label;
    pill.title = title;
    syncComposer();
  }

  function onRealtimeMessage(evt) {
    var a = adaptMessage(evt);
    if (!a) return;
    var stamp = Number(fld(a.msg, "created_at", "createdAt")) || nowSecs();
    var preview = a.msg.text || (Array.isArray(a.msg.attachments) && a.msg.attachments.length ? "sent an attachment" : "");

    if (a.cid === state.active && !state.anchored) {
      var wasAtBottom = state.atBottom;
      appendLive(a.msg);
      // A message that arrives while the reader is scrolled away has not been
      // read, so the cached server count has to move with it.
      if (!wasAtBottom && !isMine(a.msg)) bumpUnreadLocally(a.cid, a.msg.id);
      touchConversation(a.cid, preview, stamp);
      if (wasAtBottom) { scrollToBottom(); markRead(a.cid); }
      else showBanner("New messages below.", "Jump to latest", function () {
        showBanner(null); scrollToBottom(); markRead(a.cid);
      });
      return;
    }
    if (!isMine(a.msg)) bumpUnreadLocally(a.cid, a.msg.id);
    touchConversation(a.cid, preview, stamp);
  }

  function onRealtimeReaction(evt) {
    var a = adaptReaction(evt);
    if (!a) return;
    if (a.cid !== state.active) return;
    var m = state.msgById.get(a.mid);
    if (!m) return;
    m.reactions = a.reactions;
    replaceMessage(m);
  }

  function onRealtimeTyping(evt) {
    var a = adaptTyping(evt);
    if (!a) return;
    var m = state.typing.get(a.cid);
    if (!m) { m = new Map(); state.typing.set(a.cid, m); }
    m.set(a.uid, { name: a.name, until: a.until });
    if (a.cid === state.active) updateSub();
  }

  // Recorded, then resolved. It is never painted on its own.
  function onRealtimeState(evt) {
    var a = adaptState(evt);
    if (!a) return;
    state.rt = classifyRt(a);
    paintConn();
  }

  function onConnectivity(evt) {
    var s = adaptConnectivity(evt);
    if (s == null) return;
    state.net = s;
    paintConn();
  }

  async function subscribe() {
    if (!HAS_EVENTS) return;
    var pairs = [
      ["realtime://message", onRealtimeMessage],
      ["realtime://reaction", onRealtimeReaction],
      ["realtime://typing", onRealtimeTyping],
      ["realtime://state", onRealtimeState],
      // The Rust connectivity monitor's probe result. Outranks the socket state
      // above when it says offline — see paintConn.
      ["archive://connectivity", onConnectivity],
      // Emitted by the existing sync loop; the conversation list and the
      // footer counters are stale until it fires.
      ["archive://synced", onSynced]
    ];
    for (var i = 0; i < pairs.length; i++) {
      try {
        await TAURI.event.listen(pairs[i][0], pairs[i][1]);
      } catch (e) {
        console.warn("could not subscribe to " + pairs[i][0], e);
      }
    }
  }

  var syncedTimer = null;
  function onSynced() {
    // A burst of sync events must not turn into a burst of full list rebuilds.
    clearTimeout(syncedTimer);
    syncedTimer = setTimeout(async function () {
      await loadStats();
      var n = await loadConversations();
      if (n && !state.active) showIdleEmpty();
    }, 400);
  }

  /* ============================ empty states ============================ */

  // Built as elements, not markup: the keycaps want their own type, and the one
  // rule in this file is that nothing reaches the DOM as an HTML string.
  function setFine(parts) {
    var fine = $("emptyFine");
    fine.textContent = "";
    parts.forEach(function (p) {
      if (p && p.key) fine.appendChild(el("b", null, p.key));
      else fine.appendChild(document.createTextNode(String(p)));
    });
  }

  function showIdleEmpty() {
    $("emptySpin").textContent = "";
    $("emptyKicker").textContent = "The local archive";
    $("emptyTitle").textContent = "Every message you have ever sent, in one place";
    $("emptyText").textContent =
      "Everything is read from the copy of your history kept on this computer, so it opens instantly and every message is searchable — which is the one thing GroupMe itself cannot do.";
    setFine(["Press ", { key: "/" }, " to search · ", { key: "Esc" }, " to clear"]);
  }

  function showSyncingEmpty(hasAccount) {
    $("emptyKicker").textContent = hasAccount ? "First sync in progress" : "Not signed in yet";
    $("emptyTitle").textContent = hasAccount ? "Downloading your history" : "Waiting for sign-in";
    $("emptyText").textContent = hasAccount
      ? "The first sync is still running. Conversations appear here as they arrive, newest first."
      : "Open GroupMe once so the app can pick up the session, and your conversations will start downloading.";
    setFine(["This window stays usable while it runs"]);
    $("emptySpin").textContent = "";
    $("emptySpin").appendChild(el("div", "spinner"));
  }

  /* ============================== wiring ================================ */

  $("brandMark").appendChild(icon("logo"));
  $("emptyMark").appendChild(icon("logo"));
  $("back").appendChild(icon("back"));
  $("toFind").appendChild(icon("search"));
  $("toDate").appendChild(icon("calendar"));
  $("toLatest").appendChild(icon("jump"));
  $("toSettings").appendChild(icon("cog"));
  $("findPrev").appendChild(icon("up"));
  $("findNext").appendChild(icon("caret"));
  $("findClose").appendChild(icon("x"));
  $("ctxX").appendChild(icon("x"));
  attachBtn.appendChild(icon("image"));
  sendBtn.appendChild(icon("send"));
  searchWrap.insertBefore(icon("search"), searchWrap.firstChild);

  qEl.addEventListener("input", onSearchInput);

  scroller.addEventListener("scroll", function () {
    if (scroller.scrollTop < 400) loadOlder();
    state.atBottom = (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight) < 80;
    if (state.atBottom && bannerEl.classList.contains("show") && !state.anchored) showBanner(null);
  }, { passive: true });

  $("back").addEventListener("click", function () { app.classList.remove("thread-open"); });

  $("toLatest").addEventListener("click", function () {
    if (state.anchored && state.active) openConversation(state.active);
    else { scrollToBottom(); if (state.active) markRead(state.active); }
  });

  // Header identity and gear both open the conversation settings panel.
  $("headId").addEventListener("click", function () { if (state.active) openConvSettings(state.active); });
  $("toSettings").addEventListener("click", function () { if (state.active) openConvSettings(state.active); });
  $("toFind").addEventListener("click", toggleFind);
  $("toDate").addEventListener("click", function (e) { openDatePop(e.currentTarget); });

  $("findClose").addEventListener("click", closeFind);
  $("findPrev").addEventListener("click", function () { stepFind(-1); });
  $("findNext").addEventListener("click", function () { stepFind(1); });
  findqEl.addEventListener("input", onFindInput);
  findqEl.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.stopPropagation(); closeFind(); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      if (findHits.length) { if (findSel < 0) findSel = 0; jumpToFindHit(); }
      return;
    }
    if (e.key === "ArrowDown") { e.preventDefault(); stepFind(1); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); stepFind(-1); return; }
  });

  $("ctxX").addEventListener("click", function () {
    if (state.editing) cancelEdit(); else { cancelReply(); syncComposer(); }
  });

  sendBtn.addEventListener("click", doSend);
  attachBtn.addEventListener("click", function () { fileEl.click(); });
  fileEl.addEventListener("change", function () {
    var files = fileEl.files;
    if (files && files.length) attachFiles(files);
    fileEl.value = "";
  });

  /* Throttled: GroupMe's own client republishes while you keep typing rather
     than sending one notice per keystroke, and the notice carries its own
     expiry, so a fixed floor between publishes is enough. */
  var TYPING_EVERY_MS = 3000;
  var lastTypingAt = 0;
  function noteTyping() {
    if (!HAS_IPC || !state.active) return;
    var now = Date.now();
    if (now - lastTypingAt < TYPING_EVERY_MS) return;
    lastTypingAt = now;
    call("client_typing", { conversationId: state.active, kind: state.activeKind || "group" });
  }

  input.addEventListener("focus", function () { composerFocus = true; syncComposer(); });
  input.addEventListener("blur", function () { composerFocus = false; syncComposer(); });

  input.addEventListener("input", function () {
    autoGrow();
    if (cnote.classList.contains("cerr")) setError("");
    syncComposer();
    // Editing an existing message is not composing a new one.
    if (input.value.trim() && !state.editing) noteTyping();
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.altKey) { e.preventDefault(); doSend(); return; }
    if (e.key === "Escape") {
      if (state.editing) { cancelEdit(); e.stopPropagation(); }
      else if (state.reply) { cancelReply(); syncComposer(); e.stopPropagation(); }
    }
  });

  // Dropping an image on the thread attaches it rather than navigating the
  // webview to a file:// URL, which is what the default handler would do.
  ["dragenter", "dragover"].forEach(function (evt) {
    threadEl.addEventListener(evt, function (e) { e.preventDefault(); });
  });
  threadEl.addEventListener("drop", function (e) {
    e.preventDefault();
    if (!state.active) return;
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) attachFiles(files);
  });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) { e.preventDefault(); });

  scrim.addEventListener("click", closePops);
  window.addEventListener("resize", closePops);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (emojiPop.classList.contains("show") || menuPop.classList.contains("show") ||
          datePop.classList.contains("show") || convSheet.classList.contains("show")) { closePops(); return; }
      if (findbarEl.classList.contains("show")) { closeFind(); return; }
      if (bannerEl.classList.contains("show")) { showBanner(null); return; }
      if (qEl.value) { clearSearch(); qEl.blur(); }
      return;
    }
    var typingInField = document.activeElement === qEl || document.activeElement === input;
    if (e.key === "/" && !typingInField) { e.preventDefault(); qEl.focus(); qEl.select(); }
    if ((e.key === "f" || e.key === "F") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); qEl.focus(); qEl.select(); }
  });

  /* The Rust monitor is the authority on reachability — `navigator.onLine`
     reports whether an interface exists, not whether anything is reachable
     through it, which is exactly what a captive portal defeats. But it flips
     instantly where the monitor takes up to a probe interval, and `isOffline`
     reads it directly, so repainting is the whole job here. The monitor polls
     every 5 s while it believes it is offline, so recovery is quick. */
  window.addEventListener("online", paintConn);
  window.addEventListener("offline", paintConn);

  /* =============================== boot ================================= */

  /* The other half of the surface toggle. The injected button on
     web.groupme.com brings the user here; this one takes them back. Both
     record the choice, so the router reopens whichever surface was used
     last. Preference first, then navigate — best-effort, since losing the
     preference only costs one extra click next launch. */
  document.getElementById("uiswap").addEventListener("click", async function () {
    await call("client_set_ui_preference", { ui: "web" });
    location.replace("https://web.groupme.com");
  });

  (async function boot() {
    loadReadAt();
    autoGrow();
    // Neither signal has reported yet; paintConn resolves that to "Connecting"
    // when online and "Offline" when navigator already knows better.
    paintConn();

    // Arriving here IS the preference — however the user got here, the last
    // surface used is the one the router should reopen next launch.
    if (HAS_IPC) {
      call("client_set_ui_preference", { ui: "client" });
    }

    var stats = await loadStats();
    var count = await loadConversations();

    if (!count) showSyncingEmpty(!!(stats && fld(stats, "account_name", "accountName")));
    else showIdleEmpty();

    await subscribe();
    syncComposer();
  })();

})();
</script>
