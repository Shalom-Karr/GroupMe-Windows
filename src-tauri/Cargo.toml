[package]
name = "groupme-desktop"
version = "0.5.0"
description = "GroupMe for Windows — native desktop shell (Tauri 2) with a local SQLite archive for offline reading"
authors = ["Shalom Karr"]
# AGPL-3.0-only WITH the Commons Clause condition. Commons Clause has no SPDX
# identifier, so the file is authoritative and `license` is deliberately unset —
# a bare "AGPL-3.0-only" here would misstate the terms as permitting commercial
# use. See LICENSE: non-commercial only without a separate paid licence.
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.77"

[lib]
name = "groupme_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "groupme-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` registers the `asset:` URI scheme. Without it `convertFileSrc`
# resolves to a handler that was never installed, so every cached avatar and
# image silently fails to load and the offline reader shows placeholders for
# media it already has on disk.
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

# Tray icon compositing: the unread badge is drawn over the base icon at
# runtime rather than shipping a second icon file per state.
image = { version = "0.25", default-features = false, features = ["png"] }

# Archive storage. `bundled` compiles SQLite from source, which both removes the
# system-sqlite dependency on end-user machines and turns on FTS5 — the archive
# is only worth having if it is searchable.
rusqlite = { version = "0.32", features = ["bundled"] }

# native-tls, NOT rustls-tls.
#
# `rustls-tls` validates against webpki-roots -- a Mozilla root store compiled
# into the binary -- and ignores the Windows certificate store completely. On
# any machine behind TLS inspection (corporate proxy, security appliance, AV
# with HTTPS scanning) the presented chain is issued by a private root that
# lives in the Windows store, so rustls rejects it with
# `invalid peer certificate: UnknownIssuer` while Edge, Chrome and PowerShell
# on the same machine all succeed.
#
# That failure is total and silent here: no API reachability means the router
# never reaches GroupMe, so no token is captured, so nothing ever syncs and the
# archive stays empty.
#
# native-tls uses schannel on Windows -- the same TLS stack, and the same trust
# store, as every other application on the machine. For a Windows-only desktop
# app that is the correct default: it should work wherever the user's browser
# already works.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "native-tls",
  "gzip",
  "stream",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Access token lives in Windows Credential Manager, never in the SQLite file or
# a plaintext config. The DB holds only a fingerprint so we can tell whether the
# archive belongs to the account currently signed in.
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"

anyhow = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"

# Faye realtime. native-tls here for the same reason as reqwest: schannel uses
# the Windows trust store, so the socket works on machines behind TLS
# inspection where a bundled root store does not.
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "connect",
  "native-tls",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# source_guid on outgoing messages. GroupMe echoes it back, which is how an
# optimistic local row is matched to the server's copy instead of duplicating.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Every API-client test runs against a local mock rather than api.groupme.com,
# so the suite is offline, deterministic, and safe to run without an account.
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "test-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
# opt-level 3, not "s". Size optimisation costs 10-25% on the hot paths here —
# serde_json over every message, SHA-256 per cached blob, FTS5 tokenisation —
# to save a few hundred KB of installer, which nobody notices.
opt-level = 3
strip = true
