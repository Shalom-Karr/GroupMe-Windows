<!--
  Connectivity router.

  The first thing the window loads. It decides whether the session goes to the
  live client or the local archive, so the user never meets WebView2's raw
  "can't reach this page" error — which is the moment a wrapped web app stops
  feeling like an app.

  Deliberately self-contained: no CDN, no downloaded fonts, no build step — every
  face named here ships with Windows. Anything fetched from the network would fail
  in exactly the case this page exists to handle.
-->
<meta charset="utf-8" />
<title>GroupMe</title>
<style>
  :root {
    color-scheme: light dark;

    --font-display: "Sitka Heading", Constantia, Georgia, serif;
    --font-ui:      Corbel, Candara, "Segoe UI", sans-serif;
    --font-label:   "Bahnschrift SemiLight", Bahnschrift, Corbel, sans-serif;
    --font-mono:    "Cascadia Mono", Consolas, monospace;

    --bg: #f6f3ec; --surface: #fffdf8; --raised: #ece7db;
    --rule: #dcd5c6; --fg: #16130d; --fg-soft: #5d5647;
    --accent: #a8341f; --accent-soft: #f2e3dc;
    --ok: #1f5c56; --warn: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100e0c; --surface: #191611; --raised: #221e18;
      --rule: #302a22; --fg: #f1ece1; --fg-soft: #9d9483;
      --accent: #e2603f; --accent-soft: #33211b;
      --ok: #4fb3a4; --warn: #d4a24c;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 var(--font-ui);
    display: grid;
    place-items: center;
    -webkit-user-select: none;
    user-select: none;
  }

  /* A title page: mark, standing head, rule, status line, action. */
  .sheet { width: 21rem; padding: 2rem; text-align: center; }

  .mark {
    width: 40px; height: 40px; margin: 0 auto 1.15rem;
    border: 1px solid var(--rule); border-radius: 2px;
    background: var(--surface);
    display: grid; place-items: center;
  }
  .mark svg { width: 20px; height: 20px; display: block; }
  .mark path  { stroke: var(--fg-soft); }
  .mark .a    { stroke: var(--accent); }

  .wordmark {
    font-family: var(--font-label);
    font-size: .625rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--fg-soft);
    margin: 0 0 .9rem;
    padding-left: .3em; /* optical: absorbs the trailing letter-space */
  }

  /* Hairline with a short accent segment — the one flourish on the page. */
  .hair {
    height: 1px; background: var(--rule);
    margin: 0 auto 1.35rem; position: relative;
  }
  .hair::after {
    content: ""; position: absolute; top: 0; left: 50%;
    width: 1.75rem; height: 1px; margin-left: -.875rem;
    background: var(--accent);
  }

  h1 {
    font-family: var(--font-display);
    font-size: 1.5rem; font-weight: 400; line-height: 1.25;
    letter-spacing: -.005em;
    margin: 0 0 .4rem;
  }
  p#detail { margin: 0; color: var(--fg-soft); font-size: .875rem; }

  .bar {
    width: 11rem; height: 2px; margin: 1.6rem auto 0;
    background: var(--rule); overflow: hidden;
  }
  .bar i {
    display: block; width: 34%; height: 100%;
    background: var(--accent);
    animation: sweep 1.5s cubic-bezier(.5, 0, .5, 1) infinite;
  }
  @keyframes sweep {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(295%); }
  }

  .actions { margin-top: 1.6rem; display: none; gap: .5rem; justify-content: center; }
  .actions.show { display: flex; }
  button {
    font-family: var(--font-ui); font-size: .8125rem;
    padding: .5rem 1.05rem;
    border-radius: 2px; border: 1px solid var(--rule);
    background: var(--surface); color: var(--fg);
    cursor: pointer;
    transition: border-color .14s ease, background-color .14s ease;
  }
  button:hover { border-color: var(--fg-soft); }
  button.primary {
    background: var(--accent); border-color: var(--accent);
    color: var(--surface);
  }
  button.primary:hover { filter: brightness(1.07); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .colophon {
    position: fixed; left: 0; right: 0; bottom: 1.75rem;
    margin: 0; text-align: center;
    font-size: .6875rem; color: var(--fg-soft);
  }

  /* One orchestrated reveal, top to bottom, instead of scattered motion. */
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .sheet > *, .colophon { animation: rise .5s cubic-bezier(.2, .7, .3, 1) both; }
  .sheet > *:nth-child(1) { animation-delay: .04s; }
  .sheet > *:nth-child(2) { animation-delay: .10s; }
  .sheet > *:nth-child(3) { animation-delay: .16s; }
  .sheet > *:nth-child(4) { animation-delay: .22s; }
  .sheet > *:nth-child(5) { animation-delay: .28s; }
  .sheet > *:nth-child(6) { animation-delay: .34s; }
  .colophon { animation-delay: .46s; }
  /* The action row reveals when it is unhidden, not on load. */
  .sheet .actions { animation: none; }
  .sheet .actions.show { animation: rise .4s cubic-bezier(.2, .7, .3, 1) both; }

  @media (prefers-reduced-motion: reduce) {
    .bar i { animation: none; width: 100%; }
    .sheet > *, .colophon, .sheet .actions.show { animation: none; }
    button { transition: none; }
  }
</style>

<main class="sheet">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 20 20" fill="none" stroke-width="1.3" stroke-linecap="square">
      <path d="M2.5 3.25v13.5"/>
      <path d="M6 6h11"/>
      <path d="M6 10h11"/>
      <path class="a" d="M6 14h6"/>
    </svg>
  </div>
  <p class="wordmark">GroupMe Archive</p>
  <div class="hair" aria-hidden="true"></div>
  <h1 id="title" aria-live="polite">Connecting…</h1>
  <p id="detail" aria-live="polite">Checking your connection</p>
  <div class="bar" id="bar"><i></i></div>
  <div class="actions" id="actions">
    <button class="primary" id="retry">Try again</button>
    <button id="offline">Read offline</button>
  </div>
</main>
<p class="colophon">Your messages are archived locally, on this PC.</p>

<script>
  const LIVE = "https://web.groupme.com";
  const OFFLINE = "offline.html";
  const CLIENT = "client.html";
  // A cache-busted opaque probe. no-cors resolves on any HTTP response and
  // rejects only on a genuine network failure, which is exactly the signal we
  // want — a 4xx from GroupMe still means the internet works.
  const PROBE = "https://api.groupme.com/v3/users/me?_probe=";

  const $ = (id) => document.getElementById(id);

  async function reachable(timeoutMs = 6000) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeoutMs);
    try {
      await fetch(PROBE + Date.now(), {
        mode: "no-cors",
        cache: "no-store",
        signal: ctl.signal,
      });
      return true;
    } catch {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  function fail() {
    $("title").textContent = "You're offline";
    $("detail").textContent = "Your archived messages are still readable.";
    $("bar").style.display = "none";
    $("actions").classList.add("show");
  }

  async function route() {
    $("bar").style.display = "";
    $("actions").classList.remove("show");
    $("title").textContent = "Connecting…";
    $("detail").textContent = "Checking your connection";

    // navigator.onLine only knows about the link layer — a captive portal or a
    // DNS blackhole reports true. Trust it to say "no", never to say "yes".
    if (navigator.onLine === false || !(await reachable())) {
      fail();
      return;
    }
    location.replace((await preferredUi()) === "client" ? CLIENT : LIVE);
  }

  // Last-used surface: the web client or the custom one. Anything unexpected —
  // no IPC, a rejected invoke, an unknown value — falls back to the web client,
  // the only surface that can bootstrap a session on a fresh install.
  async function preferredUi() {
    try {
      if (window.__TAURI__ && window.__TAURI__.core) {
        return await window.__TAURI__.core.invoke("client_ui_preference");
      }
    } catch (e) {}
    return "web";
  }

  $("retry").addEventListener("click", route);
  $("offline").addEventListener("click", () => location.replace(OFFLINE));
  window.addEventListener("online", route);

  route();
</script>
