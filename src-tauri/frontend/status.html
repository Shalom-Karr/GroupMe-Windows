<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Archive Status — GroupMe</title>
  <style>
    :root {
      color-scheme: light dark;

      --font-display: "Sitka Heading", Constantia, Georgia, serif;
      --font-ui:      Corbel, Candara, "Segoe UI", sans-serif;
      --font-label:   "Bahnschrift SemiLight", Bahnschrift, Corbel, sans-serif;
      --font-mono:    "Cascadia Mono", Consolas, monospace;

      --bg: #f6f3ec; --surface: #fffdf8; --raised: #ece7db;
      --rule: #dcd5c6; --fg: #16130d; --fg-soft: #5d5647;
      --accent: #a8341f; --accent-soft: #f2e3dc;
      --ok: #1f5c56; --warn: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #100e0c; --surface: #191611; --raised: #221e18;
        --rule: #302a22; --fg: #f1ece1; --fg-soft: #9d9483;
        --accent: #e2603f; --accent-soft: #33211b;
        --ok: #4fb3a4; --warn: #d4a24c;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 var(--font-ui);
      -webkit-user-select: none;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    /* ── Standing head (drag region) ── */
    .header {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 11px 0 12px;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
      cursor: default;
    }
    .header-identity {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-label);
      font-size: .625rem;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--fg-soft);
      white-space: nowrap;
    }
    .app-icon {
      width: 22px; height: 22px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--surface);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .app-icon svg { display: block; width: 12px; height: 12px; }
    .app-icon path { stroke: var(--fg-soft); }
    .app-icon .a   { stroke: var(--accent); }
    .close-btn {
      width: 24px; height: 24px;
      border-radius: 2px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--fg-soft);
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: border-color .14s ease, color .14s ease;
    }
    .close-btn:hover { border-color: var(--rule); color: var(--fg); }
    .close-btn:active { background: var(--raised); }
    .close-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ── Content ── */
    .content {
      flex: 1;
      padding: 16px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      min-height: 0;
      /* The window cannot resize, so an unusually long hint scrolls here rather
         than pushing the footer off the panel. */
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--rule) transparent;
    }

    /* ── Verdict ── */
    /* The level is carried by a marginal rule and the colour of the standing
       line — no tinted panels, no alarm styling. The wording always states the
       verdict on its own, so colour is never the only signal. */
    .verdict {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 2px solid var(--fg-soft);
      border-radius: 0 2px 2px 0;
      padding: 12px 14px 13px;
    }
    .verdict[data-level="ok"]      { border-left-color: var(--ok); }
    .verdict[data-level="warn"]    { border-left-color: var(--warn); }
    .verdict[data-level="info"]    { border-left-color: var(--accent); }
    .verdict[data-level="neutral"] { border-left-color: var(--fg-soft); }

    #verdict-text {
      display: block;
      font-family: var(--font-display);
      font-size: 1.0625rem;
      font-weight: 400;
      line-height: 1.25;
      color: var(--fg-soft);
    }
    .verdict[data-level="ok"]   #verdict-text { color: var(--ok); }
    .verdict[data-level="warn"] #verdict-text { color: var(--warn); }
    .verdict[data-level="info"] #verdict-text { color: var(--accent); }

    #verdict-hint {
      font-size: .75rem;
      color: var(--fg-soft);
      margin-top: 5px;
      line-height: 1.45;
      /* Error strings arrive unbroken and must not widen a fixed window. */
      overflow-wrap: anywhere;
    }

    /* ── Register of counts ── */
    .stats-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 2px;
      overflow: hidden;
    }
    .stat-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 8px 13px 9px;
      border-bottom: 1px solid var(--rule);
      gap: 14px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label {
      font-family: var(--font-label);
      font-size: .5625rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--fg-soft);
      white-space: nowrap;
    }
    .stat-value-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      min-width: 0;
    }
    .stat-value {
      font-size: .875rem;
      text-align: right;
      max-width: 15rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Numerals and timestamps are set in mono so successive readings line up. */
    .stat-value.num, .stat-sub {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .stat-value.num { font-size: .8125rem; }
    .stat-sub {
      font-size: .6875rem;
      color: var(--fg-soft);
      text-align: right;
      margin-top: 2px;
    }

    /* ── Colophon ── */
    .footer {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-top: 1px solid var(--rule);
      flex-shrink: 0;
      gap: 10px;
    }
    .footer-note {
      font-size: .6875rem;
      color: var(--fg-soft);
    }

    /* Live "updated" badge */
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-label);
      font-size: .5625rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--ok);
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
    }
    .live-badge.show { opacity: 1; }
    .live-dot {
      width: 5px; height: 5px;
      background: currentColor;
    }

    @keyframes dot-pop {
      0%   { transform: scale(2.2); opacity: 0; }
      40%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .live-badge.show .live-dot { animation: dot-pop .35s ease-out; }

    /* One orchestrated reveal, head to colophon. */
    @keyframes rise {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: none; }
    }
    .header, .verdict, .stats-card, .footer {
      animation: rise .45s cubic-bezier(.2, .7, .3, 1) both;
    }
    .header     { animation-delay: .02s; }
    .verdict    { animation-delay: .10s; }
    .stats-card { animation-delay: .17s; }
    .footer     { animation-delay: .24s; }

    @media (prefers-reduced-motion: reduce) {
      .close-btn             { transition: none; }
      .live-badge            { transition: none; }
      .live-badge.show .live-dot { animation: none; }
      .header, .verdict, .stats-card, .footer { animation: none; }
    }
  </style>
</head>
<body>

<!-- ── HEADER — entire row is the drag region ── -->
<div class="header" data-tauri-drag-region>
  <div class="header-identity">
    <div class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke-linecap="square">
        <path d="M2.5 3.25v13.5"/>
        <path d="M6 6h11"/>
        <path d="M6 10h11"/>
        <path class="a" d="M6 14h6"/>
      </svg>
    </div>
    GroupMe Archive
  </div>
  <button class="close-btn" id="close-btn" aria-label="Close" title="Close (Esc)">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none"
         stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <line x1="1" y1="1" x2="9" y2="9"/>
      <line x1="9" y1="1" x2="1" y2="9"/>
    </svg>
  </button>
</div>

<!-- ── CONTENT ── -->
<div class="content">

  <!-- Top-line verdict -->
  <div class="verdict" id="verdict" data-level="neutral" role="status">
    <span id="verdict-text">Loading…</span>
    <div id="verdict-hint" hidden></div>
  </div>

  <!-- Register of counts -->
  <div class="stats-card">
    <div class="stat-row">
      <span class="stat-label">Account</span>
      <div class="stat-value-wrap">
        <span class="stat-value" id="stat-account">—</span>
      </div>
    </div>
    <div class="stat-row">
      <span class="stat-label">Groups</span>
      <div class="stat-value-wrap">
        <span class="stat-value num" id="stat-groups">—</span>
        <span class="stat-sub" id="stat-groups-sub"></span>
      </div>
    </div>
    <div class="stat-row">
      <span class="stat-label">Direct messages</span>
      <div class="stat-value-wrap">
        <span class="stat-value num" id="stat-dms">—</span>
        <span class="stat-sub" id="stat-dms-sub"></span>
      </div>
    </div>
    <div class="stat-row">
      <span class="stat-label">Messages archived</span>
      <div class="stat-value-wrap">
        <span class="stat-value num" id="stat-messages">—</span>
      </div>
    </div>
    <div class="stat-row">
      <span class="stat-label">Last synced</span>
      <div class="stat-value-wrap">
        <span class="stat-value num" id="stat-rel-time">—</span>
        <span class="stat-sub" id="stat-abs-time"></span>
      </div>
    </div>
  </div>

</div>

<!-- ── FOOTER ── -->
<div class="footer">
  <span class="footer-note">Syncs automatically every 60 seconds.</span>
  <span class="live-badge" id="live-badge" aria-live="polite" aria-atomic="true">
    <span class="live-dot" aria-hidden="true"></span>
    updated just now
  </span>
</div>

<script>
(function () {
  'use strict';

  // Sample data used when the page is opened directly in a browser (no Tauri).
  var SAMPLE_STATS = {
    conversations: 42,
    messages: 1847,
    groups: 12, dms: 30, group_messages: 1400, dm_messages: 447,
    last_sync_at: Math.floor(Date.now() / 1000) - 90,
    account_name: 'Sample User'
  };

  var hasTauri = typeof window.__TAURI__ !== 'undefined';

  // ── Pure helpers ──

  function relTime(unixSec) {
    if (unixSec == null) return '—';
    var ageMs = Date.now() - unixSec * 1000;
    var s = Math.floor(ageMs / 1000);
    if (s < 60) return 'just now';
    var m = Math.floor(s / 60);
    if (m < 60) return m === 1 ? '1 minute ago' : m + ' minutes ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h === 1 ? '1 hour ago' : h + ' hours ago';
    var d = Math.floor(h / 24);
    if (d === 1) return 'yesterday';
    return d + ' days ago';
  }

  function absTime(unixSec) {
    if (unixSec == null) return '';
    return new Date(unixSec * 1000).toLocaleString(undefined, {
      dateStyle: 'short',
      timeStyle: 'short'
    });
  }

  function fmtNum(n) {
    if (n == null) return '—';
    return n.toLocaleString();
  }

  // Derive the top-line verdict from stats.
  // Returns { level: 'ok'|'warn'|'info'|'neutral', text, hint }.
  function getVerdict(stats) {
    var name  = stats.account_name;
    var msgs  = stats.messages;
    var last  = stats.last_sync_at;

    if (!name && !msgs) {
      return {
        level: 'neutral',
        text: 'Not signed in yet',
        hint: 'Sign in to GroupMe in the main window to start the archive.'
      };
    }
    if (!msgs) {
      return {
        level: 'info',
        text: 'Signed in, nothing archived yet',
        hint: 'The first sync can take a few minutes — check back shortly.'
      };
    }
    if (last != null) {
      var staleMs = Date.now() - last * 1000;
      if (staleMs > 10 * 60 * 1000) {
        return {
          level: 'warn',
          text: 'Sync may be stalled',
          hint: 'Last sync was more than 10 minutes ago. Restart the app if this persists.'
        };
      }
    }
    return {
      level: 'ok',
      text: 'Archive is up to date',
      hint: ''
    };
  }

  // ── State ──

  var _stats     = null;
  var _pulseTimer = null;

  // ── DOM refs (queried once) ──

  var elVerdict       = document.getElementById('verdict');
  var elVerdictText   = document.getElementById('verdict-text');
  var elVerdictHint   = document.getElementById('verdict-hint');
  var elAccount       = document.getElementById('stat-account');
  var elGroups        = document.getElementById('stat-groups');
  var elGroupsSub     = document.getElementById('stat-groups-sub');
  var elDms           = document.getElementById('stat-dms');
  var elDmsSub        = document.getElementById('stat-dms-sub');
  var elMsgs          = document.getElementById('stat-messages');
  var elRelTime       = document.getElementById('stat-rel-time');
  var elAbsTime       = document.getElementById('stat-abs-time');
  var elLiveBadge     = document.getElementById('live-badge');

  // ── Render ──

  function renderVerdict(stats) {
    var v = getVerdict(stats);
    elVerdict.dataset.level = v.level;
    elVerdictText.textContent = v.text;   // textContent — safe
    elVerdictHint.textContent = v.hint;   // textContent — safe
    elVerdictHint.hidden = !v.hint;
  }

  function renderTime(unixSec) {
    elRelTime.textContent = relTime(unixSec);
    elAbsTime.textContent = absTime(unixSec);
  }

  function render(stats) {
    _stats = stats;
    renderVerdict(stats);
    elAccount.textContent       = stats.account_name || '—';  // textContent — safe

    var groups = stats.groups == null ? null : stats.groups;
    var dms    = stats.dms == null ? null : stats.dms;
    elGroups.textContent = fmtNum(groups);
    elDms.textContent    = fmtNum(dms);
    // Per-kind message counts as the sub-line, and — the reason this split
    // exists — a plain-language note when groups are empty while DMs are not,
    // which on this machine means a network filter is blocking the group API.
    elGroupsSub.textContent =
      (stats.group_messages != null ? fmtNum(stats.group_messages) + ' messages' : '');
    elDmsSub.textContent =
      (stats.dm_messages != null ? fmtNum(stats.dm_messages) + ' messages' : '');
    if (groups === 0 && dms > 0) {
      elGroupsSub.textContent = 'none archived — the group API may be blocked by a filter';
    }

    elMsgs.textContent = fmtNum(stats.messages);
    renderTime(stats.last_sync_at);
  }

  // Called every 30 s to keep relative times accurate without a network round-trip.
  function tickRelTime() {
    if (!_stats) return;
    renderTime(_stats.last_sync_at);
    // Re-evaluate the stale threshold without touching the network.
    renderVerdict(_stats);
  }

  // ── Live pulse badge ──

  function showPulse() {
    elLiveBadge.classList.remove('show');
    // Force reflow so the dot animation restarts on every event.
    void elLiveBadge.offsetWidth;
    elLiveBadge.classList.add('show');
    clearTimeout(_pulseTimer);
    _pulseTimer = setTimeout(function () {
      elLiveBadge.classList.remove('show');
    }, 4000);
  }

  // ── Data loading ──

  async function loadStats() {
    try {
      var stats = hasTauri
        ? await window.__TAURI__.core.invoke('archive_stats')
        : SAMPLE_STATS;
      render(stats);
    } catch (err) {
      elVerdict.dataset.level = 'warn';
      elVerdictText.textContent = 'Could not load archive status';
      elVerdictHint.textContent = String(err);  // textContent — safe
      elVerdictHint.hidden = false;
    }
  }

  async function onSynced() {
    await loadStats();
    showPulse();
  }

  // ── Window controls ──

  async function hideWindow() {
    if (hasTauri) {
      try {
        await window.__TAURI__.window.getCurrentWindow().hide();
      } catch (_) {
        // Swallow — worst case the window stays visible until the user alt-F4s it.
      }
    }
  }

  document.getElementById('close-btn').addEventListener('click', hideWindow);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') hideWindow();
  });

  // ── Boot ──

  async function init() {
    await loadStats();

    if (hasTauri) {
      try {
        await window.__TAURI__.event.listen('archive://synced', onSynced);
      } catch (e) {
        console.warn('GroupMe status: could not subscribe to archive://synced', e);
      }
    }

    // Keep "3 minutes ago" etc. accurate while the panel is open.
    setInterval(tickRelTime, 30000);
  }

  init();
}());
</script>
</body>
</html>
